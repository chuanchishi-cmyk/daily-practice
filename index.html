<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="番茄鐘、月曆、統計、考試衝刺、論文地圖、覺察日記、靜心與自訂頁面的個人讀書工作台。資料只存在你的瀏覽器。">
<meta name="theme-color" content="#f6f3ee">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>讀書工作台</title>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* Layout: quiet left rail (top strip on narrow screens), main column of soft paper-like cards; warm clay accent only for the running timer and primary actions, sage for secondary */
:root{
  --bg:#f6f3ee; --surface:#fffdfa; --sunk:#f0ece5; --ink:#3b3631; --muted:#8a8178; --line:#e8e2d8;
  --accent:#c2704f; --accent-ink:#ffffff; --focus:#5e8977;
  --good:#5a8a5e; --warn:#b98638; --bad:#b65a4e;
  --c0:#5f8f8c; --c1:#c39a4c; --c2:#8b7bae; --c3:#6a8db2; --c4:#c2704f; --c5:#7c9a68; --c6:#ad7898; --c7:#999263; --c8:#ae845e; --c9:#5c9886; --c10:#bd7383; --c11:#7c88a4;
  --shadow:0 1px 2px rgba(80,60,40,.05),0 4px 14px rgba(80,60,40,.04);
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1a17; --surface:#25221e; --sunk:#201e1a; --ink:#ece6dd; --muted:#a3998e; --line:#37322c;
  --accent:#e08d6b; --accent-ink:#2a160d; --focus:#8bb5a3;
  --good:#8dbf90; --warn:#ddb06a; --bad:#e08a7e;
  --c0:#8bbab6; --c1:#dcb872; --c2:#b3a5d6; --c3:#96b4d6; --c4:#e08d6b; --c5:#a5c290; --c6:#d3a2bf; --c7:#c3bc8a; --c8:#d4ab84; --c9:#88c2ae; --c10:#e09cab; --c11:#a8b3cc;
  --shadow:0 1px 2px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1a17; --surface:#25221e; --sunk:#201e1a; --ink:#ece6dd; --muted:#a3998e; --line:#37322c;
  --accent:#e08d6b; --accent-ink:#2a160d; --focus:#8bb5a3;
  --good:#8dbf90; --warn:#ddb06a; --bad:#e08a7e;
  --c0:#8bbab6; --c1:#dcb872; --c2:#b3a5d6; --c3:#96b4d6; --c4:#e08d6b; --c5:#a5c290; --c6:#d3a2bf; --c7:#c3bc8a; --c8:#d4ab84; --c9:#88c2ae; --c10:#e09cab; --c11:#a8b3cc;
  --shadow:0 1px 2px rgba(0,0,0,.25);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
.app{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100%}
nav.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;padding:20px 12px 20px max(12px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;background:var(--sunk)}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;padding:4px 10px 16px;letter-spacing:.02em}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.04em}
nav.rail a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
nav.rail a:hover{background:var(--surface)}
nav.rail a[aria-current="page"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--focus)}
nav.rail a .k{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.rail .foot{margin-top:auto;font-size:11px;color:var(--muted);padding:10px;line-height:1.5}
.rail .mini{font-family:var(--f-mono);font-size:13px;color:var(--accent);padding:6px 10px;display:none}
.rail .mini.on{display:block}
main{padding-block:24px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0;max-width:1280px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font-family:var(--f-display);font-size:28px;font-weight:700;margin:0;text-wrap:balance;letter-spacing:.02em}
h2{font-size:15px;font-weight:700;margin:0 0 12px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h3{font-size:13px;font-weight:700;margin:14px 0 8px}
.eyebrow{margin:0 0 2px;font-size:12px;color:var(--muted);letter-spacing:.06em}
.muted{color:var(--muted);font-weight:400;font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.gridA{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:16px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:baseline;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:12px;color:var(--ink);text-decoration:none}
.chip b{font-family:var(--f-mono);font-size:15px}
.chip.hot{border-color:var(--accent);color:var(--accent)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
button,.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;line-height:1.3}
button:hover{border-color:var(--muted)}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button.sec{background:var(--focus);border-color:var(--focus);color:var(--surface);font-weight:500}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.ghost:hover{color:var(--ink);background:var(--sunk)}
button.sm{padding:3px 8px;font-size:12px}
button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input,select,textarea{font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:0}
textarea{width:100%;resize:vertical;min-height:64px;line-height:1.6}
input[type=number]{width:80px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label.f>input,label.f>select,label.f>textarea{color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--sunk);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 12px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:700}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:13px;padding:10px 0}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--focus);border-radius:99px}
.pill{font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill.good{color:var(--good)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}.pill.mut{color:var(--muted)}
.banner{background:var(--sunk);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--muted);margin-bottom:14px}
/* pomodoro */
.pomo .modes{margin-bottom:14px}
.clock{font-family:var(--f-mono);font-weight:600;font-size:clamp(56px,9vw,96px);letter-spacing:-.02em;line-height:1;text-align:center;padding:14px 0 6px;font-variant-numeric:tabular-nums}
.clock.run{color:var(--accent)}
.pbar{height:4px;background:var(--sunk);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.pbar>i{display:block;height:100%;background:var(--accent);width:0}
.cycles{display:flex;gap:6px;justify-content:center;margin-bottom:14px;font-size:12px;color:var(--muted);align-items:center}
.cycles i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--accent)}
.cycles i.on{background:var(--accent)}
.pform{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.pform .wide{grid-column:1/-1}
.ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ctrl .pri{min-width:120px;padding:9px 18px;font-size:15px}
/* counters */
.ctr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.ctr:first-child{border-top:0}
.ctr .v{font-family:var(--f-mono);font-size:18px}
.ctr .bar{grid-column:1/-1}
.ctr.done .bar>i{background:var(--good)}
/* top3 */
.t3{display:flex;gap:8px;align-items:center;padding:4px 0}
.t3 input[type=text]{flex:1}
.t3.done input[type=text]{text-decoration:line-through;color:var(--muted)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .hd{font-size:11px;color:var(--muted);text-align:center;padding:4px 0}
.cell{min-height:92px;border-radius:8px;border:1px solid var(--line);padding:6px 7px;cursor:pointer;display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--surface);font:inherit;color:inherit;min-width:0}
.cell.out{opacity:.4}
.cell.today{border-color:var(--focus);box-shadow:inset 0 0 0 1px var(--focus)}
.cell.sel{outline:2px solid var(--ink);outline-offset:-1px}
.cell .d{font-family:var(--f-mono);font-size:12px;display:flex;justify-content:space-between;align-items:center}
.cell .m{font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.cell .tag{font-size:10.5px;line-height:1.3;padding:1px 5px;border-radius:4px;background:var(--sunk);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cell .tag.ex{background:var(--accent);color:var(--accent-ink)}
.cell .tag.ms{border-left:3px solid var(--c2)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
/* charts */
.chartwrap{overflow-x:auto}
svg.chart{width:100%;height:auto;display:block;max-height:320px}
svg.chart.wide{min-width:620px}
svg .grid{stroke:var(--line);stroke-width:1}
svg .ax{fill:var(--muted);font-size:10px;font-family:var(--f-mono)}
svg .lbl{fill:var(--ink);font-size:11px;font-family:var(--f-body)}
svg .today{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:3 3}
.hbars .li{gap:8px}
.hbars .nm{width:56px;flex:none;font-size:13px}
.hbars .bar{flex:1;height:10px}
.hbars .val{width:110px;text-align:right;font-size:12px;flex:none}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .n{font-family:var(--f-mono);font-size:24px;font-weight:600}
.kpi .n small{font-size:12px;color:var(--muted);font-family:var(--f-body);font-weight:400;margin-left:3px}
/* exam timer */
.xclock{font-family:var(--f-mono);font-weight:600;font-size:clamp(48px,8vw,84px);text-align:center;line-height:1;padding:10px 0;font-variant-numeric:tabular-nums}
.xclock.run{color:var(--focus)}
.xclock.low{color:var(--bad)}
.segs{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin:8px 0 14px}
.segs span{font-size:12px;padding:3px 9px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.segs span.on{background:var(--focus);color:var(--surface)}
.segs span.past{text-decoration:line-through}
.bigdays{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500}
td.num,th.num{text-align:right}
.tablewrap{overflow-x:auto}
/* plan */
.projtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.phase{border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:var(--surface)}
.phase>summary{list-style:none;cursor:pointer;padding:11px 14px;display:grid;grid-template-columns:22px minmax(0,1fr) 160px auto;gap:10px;align-items:center}
.phase>summary::-webkit-details-marker{display:none}
.phase .ix{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.phase .body{padding:4px 14px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.phase.done>summary .nm{color:var(--muted);text-decoration:line-through}
.phase.cur{border-color:var(--focus)}
.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.fields .w2{grid-column:span 2}
.next{background:var(--sunk);border-radius:8px;padding:10px 12px}
.next b{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:4px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,15,16,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:8px;font-size:13px;z-index:60;max-width:calc(100% - 32px)}
.mood{display:flex;gap:4px}
.mood button{width:34px;padding:5px 0;font-family:var(--f-mono)}
.wins input{width:100%;margin-bottom:6px}
.qa{white-space:pre-wrap;overflow-wrap:anywhere}
nav.rail .sharebtn{margin:12px 6px 0;background:var(--focus);border-color:var(--focus);color:var(--surface);font-weight:500}
.quiz{max-width:760px}
.qprog{display:flex;gap:4px;margin-bottom:18px;flex-wrap:wrap}
.qprog span{flex:1;min-width:64px;font-size:12px;color:var(--muted);padding-top:6px;border-top:3px solid var(--line)}
.qprog span.on{color:var(--ink);font-weight:700;border-color:var(--accent)}
.qprog span.past{border-color:var(--focus)}
.qq{padding:14px 0;border-top:1px solid var(--line)}
.qq:first-of-type{border-top:0}
.qt{display:block;font-size:15px;margin-bottom:10px;font-weight:500}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:8px 14px;border-radius:999px;text-align:left}
.likert{display:flex;gap:6px;align-items:center}
.likert button{width:44px;padding:8px 0;font-family:var(--f-mono)}
.likert::before{content:"不像我";font-size:11px;color:var(--muted);margin-right:4px}
.likert::after{content:"很像我";font-size:11px;color:var(--muted);margin-left:4px}
.callout{background:var(--sunk);border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 6px 6px 0}
.guide ul{margin:0;padding-left:18px}
.likert.v6 button{width:40px}
.mrec2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;margin-top:6px}
.mrec2 h3{margin:8px 0 6px}
.madd{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.madd summary{cursor:pointer;font-size:13px}
@media (max-width:820px){.mrec2{grid-template-columns:1fr}}
svg.ni{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
nav.rail a[aria-current="page"] svg.ni{opacity:1;stroke:var(--focus)}
.tagc.editing{padding-right:6px;cursor:default;border-style:dashed}
.tdel{border:0;background:transparent;padding:0 3px;font-size:14px;color:var(--muted);line-height:1}
.tdel:hover{color:var(--bad)}
.tagpick{display:flex;flex-direction:column;gap:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tagc{padding:5px 11px;border-radius:999px;font-size:13px;background:var(--bg);border-color:var(--line);display:inline-flex;align-items:center;gap:5px}
.tagc::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--tc,var(--muted))}
.tagc.add::before{display:none}
.tagc.add{border-style:dashed;color:var(--muted)}
.tagc.on{background:color-mix(in srgb,var(--tc) 16%,var(--surface));border-color:var(--tc);font-weight:600}
.tagc .pj{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.widgets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
.widgets>.widget{display:flex;flex-direction:column;min-height:200px}
.widgets>.empty{grid-column:1/-1}
@media (max-width:1100px){.widgets{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){.widgets{grid-template-columns:1fr}}
.widget.editing{border-style:dashed}
.wtools{margin-left:auto;display:inline-flex;gap:2px}
.xlink{margin-left:auto;font-size:12px;font-weight:400;color:var(--focus);text-decoration:none;white-space:nowrap}
.xlink:hover{text-decoration:underline}
h3 .xlink{margin-left:8px}
.mclock.small{font-size:34px;padding:0;text-align:left}
.books3{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:16px}
.starter.editing,.emo.editing{position:relative;cursor:default;border:1px dashed var(--line)}
.starter.editing{display:flex;flex-direction:column;gap:2px;padding:8px 28px 8px 10px;border-radius:10px;background:var(--bg)}
.starter.editing span{font-size:11.5px;color:var(--muted)}
.stdel{position:absolute;top:2px;right:2px;padding:2px 7px}
.emo.editing{padding-right:28px}
.spick{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px 22px}
.spick .opt[disabled]{opacity:.35}
.vgrid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
.vtable td{vertical-align:top}
@media (max-width:820px){.vgrid{grid-template-columns:1fr}}
.ex{font-size:12.5px;color:var(--muted);margin:-4px 0 10px;padding-left:22px}
.grid-al{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0 24px}
.qq.al{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qq.al .qt{margin:0}
.likert.al::before{content:"昏沉"}
.likert.al::after{content:"清醒"}
.quiz select{font-size:14px;padding:7px 10px;margin-left:22px}
.guide p{margin:0 0 6px}
.theory details{border-top:1px solid var(--line);padding:10px 0}
.theory details:first-child{border-top:0}
.theory summary{cursor:pointer;font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center}
.theory p{margin:8px 0;max-width:72ch}
.booklist{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.blinks{display:inline-flex;gap:10px;margin-left:8px;flex-wrap:wrap;font-size:12px}
.blinks a{color:var(--focus)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}

<script>
(()=>{
'use strict';
const STANDALONE=true;
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o??null));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const parseD=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parseD(k);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const weekStart=k=>{const d=parseD(k);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return ymd(d)};
const WD=['一','二','三','四','五','六','日'];
const wdName=k=>'日一二三四五六'[parseD(k).getDay()];
const fmtLong=k=>{const d=parseD(k);return `${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日（週${wdName(k)}）`};
const fmtMD=k=>{const d=parseD(k);return `${d.getMonth()+1}/${d.getDate()}`};
const fmtMin=m=>{m=Math.round(m);if(m<60)return m+' 分';const h=Math.floor(m/60),r=m%60;return r?`${h} 時 ${r} 分`:`${h} 小時`};
const mmss=s=>{s=Math.max(0,Math.ceil(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${pad(m)}:${pad(x)}`:`${pad(m)}:${pad(x)}`};
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}

/* ---------- defaults ---------- */
const DEF={
  subjects:[
    {id:'R',name:'托福閱讀',c:0,unit:'篇'},{id:'L',name:'托福聽力',c:3,unit:'段'},
    {id:'S',name:'托福口說',c:2,unit:'題'},{id:'W',name:'托福寫作',c:1,unit:'篇'},
    {id:'T',name:'論文',c:4,unit:'頁'},{id:'P',name:'專案進度',c:5,unit:''},{id:'M',name:'專注靜心',c:9,unit:'分'},
    {id:'E',name:'運動',c:8,unit:'分'},{id:'B',name:'閱讀',c:10,unit:'頁'}],
  pomo:{work:25,short:5,long:15,every:4},
  counters:[{id:'fix',name:'訂正錯題',goal:5,step:1},{id:'drill',name:'完成練習題',goal:20,step:5},{id:'hit',name:'練習達標次數',goal:3,step:1}],
  exams:[{id:'toefl',name:'托福 TOEFL',date:''}],
  timers:[
    {id:'n1',name:'閱讀',segs:[{n:'閱讀',s:1800}]},
    {id:'n2',name:'聽力',segs:[{n:'聽力',s:1740}]},
    {id:'n3',name:'寫作',segs:[{n:'寫作',s:1380}]},
    {id:'n4',name:'口說',segs:[{n:'口說',s:480}]},
    {id:'n5',name:'整場模考',segs:[{n:'閱讀',s:1800},{n:'聽力',s:1740},{n:'寫作',s:1380},{n:'口說',s:480}]}],
  tv:2,
  scale:'30'
};
const CAUSES=['觀念','單字','粗心','時間不夠','題型不熟','聽不清楚'];
const SRS=[1,3,7,14,30];
const SECS=[['r','閱讀','R'],['l','聽力','L'],['s','口說','S'],['w','寫作','W']];
const CUSTOM_DEF={secs:[{id:'c1',n:'第一部分'},{id:'c2',n:'第二部分'}],max:100,step:1,total:'sum'};
function scoreSpec(scale){
  const c=cfg();
  if(scale==='custom'){const cs=Object.assign(clone(CUSTOM_DEF),c.customScore||{});const T={sum:'加總',avg:'平均',none:'不計總分'}[cs.total]||'加總';
    return {secs:cs.secs.map((x,i)=>[x.id,x.n,null,i%12]),max:+cs.max||100,step:+cs.step||1,total:cs.total,label:`自訂：每項 0–${+cs.max||100}，${T==='不計總分'?'不計總分':'總分為各項'+T}`}}
  if(scale==='band')return {secs:SECS.map(([k,n,sid])=>[k,n,sid]),max:6,step:.5,total:'avg5',label:'1–6 級分制'};
  return {secs:SECS.map(([k,n,sid])=>[k,n,sid]),max:30,step:1,total:'sum',label:'每科 0–30，總分 120'};
}
const secColor=x=>x[2]?subj(x[2]).c:x[3];
function scoreTotal(m,sp){const v=sp.secs.map(([k])=>m[k]).filter(x=>x!==''&&x!=null).map(Number);if(!v.length||sp.total==='none')return '—';const sum=v.reduce((a,b)=>a+b,0);if(sp.total==='avg5')return (Math.round(sum/v.length*2)/2).toFixed(1);if(sp.total==='avg')return fmtN(sum/v.length);return fmtN(sum)}
let scaleEditing=false;
function scaleEditorHTML(){
  const cs=Object.assign(clone(CUSTOM_DEF),cfg().customScore||{});
  return `<div class="tedit"><span class="muted" style="font-size:12px">設定要記錄的項目、每項滿分和總分的算法。</span>
    ${cs.secs.map((x,i)=>`<div class="row"><input type="text" id="csn${i}" value="${esc(x.n)}" style="flex:1" aria-label="項目名稱"><button class="ghost sm" data-act="csDel" data-i="${i}" aria-label="刪除這個項目"${cs.secs.length<2?' disabled':''}>×</button></div>`).join('')}
    <div><button class="sm" data-act="csAdd">新增項目</button></div>
    <div class="row"><label class="f">每項滿分<input type="number" id="csMax" min="1" value="${esc(cs.max)}"></label>
      <label class="f">分數單位<select id="csStep">${[['1','整數'],['0.5','0.5 分'],['0.1','0.1 分']].map(([v,n])=>`<option value="${v}"${String(cs.step)===v?' selected':''}>${n}</option>`).join('')}</select></label>
      <label class="f">總分<select id="csTot">${[['sum','加總'],['avg','平均'],['none','不計總分']].map(([v,n])=>`<option value="${v}"${cs.total===v?' selected':''}>${n}</option>`).join('')}</select></label></div>
    <div class="row sb"><span class="muted" style="font-size:12px">已記錄的分數會保留；刪除的項目不再顯示。</span><button class="sec sm" data-act="csSave">儲存計分方式</button></div></div>`;
}

/* ---------- store ---------- */
const COLLS=['meta','days','mocks','mistakes','projects','reviews','quiz','quotes','pnotes','pages'];
const S={};COLLS.forEach(c=>S[c]={});
let backend='loading',base=null,dlNS=null,canWrite=true,localWhy='',unsubs=[];
const LKEY='studydesk-v1';
const OLD_TIMERS='[{"id":"x1","name":"閱讀單節","segs":[{"n":"閱讀","s":1800}]},{"id":"x2","name":"聽力單節","segs":[{"n":"聽力","s":1800}]},{"id":"x3","name":"寫作單節","segs":[{"n":"寫作","s":1500}]},{"id":"x4","name":"口說一題","segs":[{"n":"準備","s":15},{"n":"作答","s":45}]},{"id":"x5","name":"整場模考","segs":[{"n":"閱讀","s":1800},{"n":"聽力","s":1800},{"n":"寫作","s":1500},{"n":"口說","s":600}]}]';
function cfg(){const m=S.meta.main||{};const c=Object.assign(clone(DEF),m);if(!m.tv&&JSON.stringify(m.timers||null)===OLD_TIMERS)c.timers=clone(DEF.timers);{const sn=(m.subjects||[]).map(x=>x.name).join('|');if(sn==='閱讀|聽力|口說|寫作|論文'||sn==='托福閱讀|托福聽力|托福口說|托福寫作|論文|專案進度|專注靜心')c.subjects=clone(DEF.subjects);}const cn=(m.counters||[]).map(x=>x.name).join('|');if(cn==='英文單字|跟讀句數|論文字數'||cn==='英文單字|跟讀句數|整理書摘')c.counters=clone(DEF.counters);return c}
function day(k){return S.days[k]||{date:k,sessions:[],j:{},counts:{}}}
function persistLocal(){lsSet(LKEY,S)}
const wq={};
function save(c,id,data){
  S[c][id]=data;
  if(backend!=='db'){persistLocal();return}

/* ---------- charts ---------- */
function niceMax(v){if(v<=0)return 4;const raw=v/4,p=Math.pow(10,Math.floor(Math.log10(raw)));const n=raw/p;const s=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;return s*p*4}
function fmtN(v){return Math.round(v*10)/10}
function stackBars(rows,{h=200,unit='分',every=1,marker=null,minW=320,minMax=null,per=30}={}){
  const W=Math.max(rows.length*per,minW),pl=38,pb=22,pt=10,ih=h-pb-pt;
  const max=niceMax(Math.max(minMax==null?(unit==='分'?30:4):minMax,...rows.map(r=>r.parts.reduce((a,p)=>a+p.v,0))));
  const bw=(W-pl)/rows.length;
  let s=`<svg class="chart${minW>=700?' wide':''}" viewBox="0 0 ${W} ${h}" role="img" aria-label="長條圖">`;
  for(let i=0;i<=4;i++){const v=max*i/4,y=pt+ih-ih*i/4;s+=`<line class="grid" x1="${pl}" x2="${W}" y1="${y}" y2="${y}"/><text class="ax" x="${pl-6}" y="${y+3.5}" text-anchor="end">${fmtN(v)}</text>`}
  rows.forEach((r,i)=>{let y=pt+ih;const x=pl+i*bw+bw*.18,w=bw*.64;
    if(marker&&r.key===marker)s+=`<rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${ih}" fill="var(--sunk)"/>`;
    r.parts.forEach(p=>{if(!p.v)return;const hh=ih*p.v/max;y-=hh;s+=`<rect x="${x}" y="${y}" width="${w}" height="${hh}" fill="var(--c${p.c})"><title>${esc(r.label)} ${esc(p.n||'')}：${fmtN(p.v)} ${unit}</title></rect>`});
    if(i%every===0)s+=`<text class="ax" x="${pl+i*bw+bw/2}" y="${h-6}" text-anchor="middle">${esc(r.label)}</text>`});
  return `<div class="chartwrap">${s}</svg></div>`;
}
function lineChart(series,{h=220,ymax=30,labels=[]}={}){
  const W=640,pl=34,pr=26,pb=24,pt=10,ih=h-pb-pt,iw=W-pl-pr,n=labels.length;
  const X=i=>pl+(n<=1?iw/2:iw*i/(n-1)),Y=v=>pt+ih-ih*v/ymax;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="分數趨勢">`;
  for(let i=0;i<=4;i++){const v=ymax*i/4;s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${pl-6}" y="${Y(v)+3.5}" text-anchor="end">${fmtN(v)}</text>`}
  const ev=Math.max(1,Math.ceil(n/8));labels.forEach((l,i)=>{if(i%ev===0||i===n-1)s+=`<text class="ax" x="${X(i)}" y="${h-6}" text-anchor="middle">${esc(l)}</text>`});
  series.forEach(se=>{const pts=se.vals.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);if(!pts.length)return;
    s+=`<polyline fill="none" stroke="var(--c${se.c})" stroke-width="2" points="${pts.map(p=>p.join(',')).join(' ')}"/>`;
    pts.forEach((p,i)=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4:2.5}" fill="var(--c${se.c})"/>`})});
  return `<div class="chartwrap">${s}</svg></div>`;
}
function hbars(items,unitFn){
  const max=Math.max(1,...items.map(i=>i.v));
  return `<div class="list hbars">${items.map(i=>`<div class="li"><span class="nm">${esc(i.n)}</span><div class="bar"><i style="width:${100*i.v/max}%;background:var(--c${i.c})"></i></div><span class="val num">${unitFn(i)}</span></div>`).join('')}</div>`;
}

let stMode='week',stAnchor=today();

  if(stMode==='day')return [stAnchor];
  if(stMode==='week'){const s=weekStart(stAnchor);return Array.from({length:7},(_,i)=>addDays(s,i))}
  const [y,m]=stAnchor.split('-').map(Number);const n=new Date(y,m,0).getDate();return Array.from({length:n},(_,i)=>`${y}-${pad(m)}-${pad(i+1)}`);
}
function aggregate(keys){
  const bySub={},hours=Array(24).fill(0),outs={};let mins=0,n=0;
  keys.forEach(k=>(day(k).sessions||[]).forEach(s=>{const m=+s.min||0;mins+=m;n++;const b=bySub[s.sub]||(bySub[s.sub]={m:0,n:0});b.m+=m;b.n++;hours[new Date(s.t).getHours()]+=m;if(s.out){const key=s.sub+'|'+(s.unit||'');outs[key]=(outs[key]||0)+s.out}}));
  return {bySub,hours,outs,mins,n};
}

function mindStats(keys){
  const all=keys.flatMap(k=>((day(k).j||{}).practice||[]).map(x=>Object.assign({d:k},x)));
  const tot=all.reduce((a,x)=>a+(+x.min||0),0),qs=all.filter(x=>x.q).map(x=>x.q),avgQ=qs.length?fmtN(qs.reduce((a,b)=>a+b,0)/qs.length):'—';
  const byM={},byD={};all.forEach(x=>{byM[x.method]=(byM[x.method]||0)+(+x.min||0);(x.dist||[]).forEach(t=>byD[t]=(byD[t]||0)+1)});
  const head=`<h2>靜心 <span class="muted">${all.length} 次・${tot} 分鐘・平均安住 ${avgQ}</span> ${XL('靜心頁','mind')}</h2>`;
  if(!all.length)return `<section class="card" style="margin-bottom:16px">${head}<p class="empty">這段期間沒有靜心紀錄。</p></section>`;
  if(keys.length===1)return `<section class="card" style="margin-bottom:16px">${head}<div class="list">${all.map(x=>`<div class="li" style="align-items:flex-start"><span class="num">${x.min}′</span><div class="grow">${esc(x.method)}${x.q?` <span class="muted">安住 ${x.q}</span>`:''}${(x.dist||[]).length?` <span class="muted">・${x.dist.join('、')}</span>`:''}${x.note?`<div class="muted">${esc(x.note)}</div>`:''}</div></div>`).join('')}</div></section>`;
  const rows=keys.map(k=>({key:k,label:stMode==='week'?'週'+wdName(k):String(parseD(k).getDate()),parts:[{c:9,v:((day(k).j||{}).practice||[]).reduce((a,x)=>a+(+x.min||0),0),n:'靜心'}]}));
  const notes=all.filter(x=>x.note).slice(-5).reverse();
  return `<section class="card" style="margin-bottom:16px">${head}
    <div class="grid3" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr)">
      <div><h3 style="margin-top:0">每天靜心分鐘</h3>${stackBars(rows,{h:150,unit:'分',minW:480,every:stMode==='month'?3:1,marker:today()})}</div>
      <div><h3 style="margin-top:0">方法</h3>${hbars(Object.entries(byM).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([n,v],i)=>({n,v,c:[9,0,5,3,2][i]})),x=>x.v+' 分')}
        ${Object.keys(byD).length?`<h3>常見干擾</h3><div class="chips">${Object.entries(byD).sort((a,b)=>b[1]-a[1]).map(([t,n])=>`<span class="chip">${esc(t)} <b>${n}</b></span>`).join('')}</div>`:''}</div>
      <div><h3 style="margin-top:0">最近的觀察</h3>${notes.length?notes.map(x=>`<p class="qa" style="margin:0 0 8px"><span class="muted">${fmtMD(x.d)}</span> ${esc(x.note)}</p>`).join(''):'<p class="empty">還沒有寫觀察筆記。</p>'}</div>
    </div></section>`;
}
function moodInsight(keys){
  const pairs=keys.map(k=>{const d=day(k);return {m:d.j&&d.j.mood,e:d.j&&d.j.energy,min:(d.sessions||[]).reduce((a,s)=>a+(+s.min||0),0)}}).filter(p=>p.m||p.e);
  if(pairs.length<5)return `<p class="muted" style="margin-top:12px">在覺察日記記錄 5 天以上的心境和精力，這裡會顯示它們和專注時間的關係。</p>`;
  const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
  const hi=avg(pairs.filter(p=>p.e>=4).map(p=>p.min)),lo=avg(pairs.filter(p=>p.e&&p.e<=2).map(p=>p.min));
  const mh=avg(pairs.filter(p=>p.m>=4).map(p=>p.min)),ml=avg(pairs.filter(p=>p.m&&p.m<=2).map(p=>p.min));
  return `<h3>心境、精力與專注 ${XL('覺察日記','journal')}</h3><p class="muted">精力 4–5 分的日子平均專注 ${hi??'—'} 分，1–2 分的日子 ${lo??'—'} 分。<br>心境 4–5 分的日子平均 ${mh??'—'} 分，1–2 分的日子 ${ml??'—'} 分。</p>`;
}
function weekReview(keys,A,subs){
  const wk=keys[0],rv=S.reviews[wk]||{};
  const wins=keys.flatMap(k=>((day(k).j||{}).wins||[]).filter(Boolean).map(w=>({k,w})));
  const inWk=d=>d&&d>=keys[0]&&d<=keys[6];
  const projMoves=Object.keys(S.projects).map(id=>{const p=proj(id);const st=p.stages.reduce((a,s)=>a+s.steps.filter(x=>inWk(x.doneAt)).length,0),w=(p.wins||[]).filter(x=>inWk(x.d)).length,q=Object.values(S.quotes).filter(x=>x.proj===id&&inWk(x.d)).length;if(!st&&!w&&!q)return '';return `<li>${esc(p.name)}：完成 ${st} 步、${w} 個小成果、${q} 則書摘</li>`}).join('');
  const top=subs[0];
  return `<section class="card"><h2>週回顧 <span class="muted">回頭看看這一週，寫下下週想調整的事</span></h2>
  <div class="grid3">
    <div><h3>這週的數字</h3><p>專注 ${fmtMin(A.mins)}、${A.n} 個番茄。${top?`花最多時間在「${esc(top.n)}」（${fmtMin(top.v)}）。`:''}</p>${projMoves?`<h3>研究專案推進</h3><ul style="margin:0;padding-left:18px">${projMoves}</ul>`:''}</div>
    <div><h3>這週做到的事 <span class="muted">${wins.length} 則</span></h3>${wins.length?`<ul style="margin:0;padding-left:18px">${wins.slice(0,12).map(x=>`<li><span class="muted">${fmtMD(x.k)}</span> ${esc(x.w)}</li>`).join('')}</ul>`:'<p class="empty">這週還沒寫回顧。</p>'}</div>
    <div><h3>下週要調整</h3><textarea id="rv${wk}" data-in="review" data-k="${wk}" rows="6" placeholder="例：口說練習排在早上；論文每天至少 1 個番茄">${esc(rv.text)}</textarea></div>
  </div></section>`;
}

function notesHTML(p){

/* ---------- energy check-in ---------- */
function energyHTML(k){
  const en=day(k).en||[],fo=day(k).fo||[];
  const row=(lab,act,list,key,hint)=>`<div class="row sb"><span>${lab}</span><div class="mood">${[1,2,3,4,5].map(n=>`<button data-act="${act}" data-n="${n}" aria-label="${lab} ${n} 分">${n}</button>`).join('')}</div></div>
  <div class="muted" style="margin:4px 0 10px">${list.length?'今天：'+list.map(x=>`${esc(x.t)} <b class="num">${x[key]}</b>`).join('・'):hint}</div>`;
  return row('現在的精力','enLog',en,'e','1 很累，5 精神最好。')+row('剛才的專注度','foLog',fo,'v','1 一直分心，5 完全投入。')+`<p class="muted" style="margin:0;font-size:12px">每天記 3–4 次，就能看出精神和專注最好的時段。</p>`;
}

function sleepCalc(E){
  const night=(s,w)=>{if(s==null||w==null)return null;const on=+s,off=+w+1440,dur=off-on;return {on,off,dur,mid:(on+dur/2)%1440}};

  const work=E.reg==='n'?null:night(E.wSleep,E.wWake);
  const msf=free?free.mid/60:4.5;
  const type=msf<3?'e2':msf<4?'e1':msf<5?'m':msf<6?'l1':'l2';
  const sj=work?Math.abs(free.mid-work.mid)/60:0;

function energyModel(E){

  const low=pool.filter(b=>b.k!==peak).reduce((a,b)=>sc[b.k]<sc[a.k]?b:a,pool.find(b=>b.k!==peak)||pool[0]).k;

    else if(b.k===peak)r=['高峰','bad','深度工作：最需要思考、分析、寫作的事'];
    else if(b.k===idea)r=['靈感','good','發想與規劃：腦力激盪、構思、整理想法'];
    else if(b.k===low)r=['低潮','mut','例行事務：回訊息、整理資料、行政、輕量複習'];
    else if(E.dip===2&&(b.k==='b3'||b.k==='b4'))r=['低潮','mut','午後低潮：例行事務、走動，或小睡 15 分鐘'];
    else if(sc[b.k]>=3.5)r=['次高','warn','練習與學習：做練習題、閱讀、學新東西'];

  if(b.type==='log')return `<div class="tablewrap"><table class="logt"><thead><tr>${b.cols.map((c,i)=>`<th><input type="text" data-ch="blkCol" ${A_} data-i="${i}" value="${esc(c)}" aria-label="欄位名稱"></th>`).join('')}<th><button class="ghost sm" data-act="blkColAdd" ${A_}>＋ 欄位</button></th></tr></thead>
    <tbody>${b.rows.map(r=>`<tr>${b.cols.map((_,i)=>`<td>${esc(r.c[i]||'')}</td>`).join('')}<td><button class="ghost sm" data-act="blkRowDel" ${A_} data-id="${r.id}" aria-label="刪除">×</button></td></tr>`).join('')}
    <tr class="addrow">${b.cols.map((c,i)=>`<td><input type="text" id="br${b.id}_${i}" placeholder="${esc(c)}"${i===0&&/日期/.test(c)?` value="${today()}"`:''}></td>`).join('')}<td><button class="sm sec" data-act="blkRowAdd" ${A_}>加入</button></td></tr></tbody></table></div>
    ${b.cols.length>1?`<div class="row" style="margin-top:6px"><span class="muted">刪除欄位：</span>${b.cols.map((c,i)=>`<button class="ghost sm" data-act="blkColDel" ${A_} data-i="${i}">${esc(c)} ×</button>`).join('')}</div>`:''}`;
  return '';
}
function vPage(id){
  const p=S.pages[id];
  if(!p)return `<header class="ph"><div><p class="eyebrow">我的頁面</p><h1>找不到這個頁面</h1></div></header><p class="empty">可能已經刪除，或資料還在載入。</p>`;
  return `<header class="ph"><div style="flex:1;min-width:0"><p class="eyebrow">我的頁面</p><input class="pgtitle" id="pgt${id}" type="text" data-ch="pgName" data-p="${id}" value="${esc(p.name)}" aria-label="頁面名稱"></div>
    <div class="row"><button class="${pgAdding?'':'sec'}" data-act="pgAddToggle">${pgAdding?'完成':'＋ 新增區塊'}</button><button class="ghost sm" data-act="pgDel" data-p="${id}">刪除頁面</button></div></header>
  ${pgAdding?`<section class="card" style="margin-bottom:16px"><h2>選一種區塊加入</h2><div class="tplgrid">${Object.entries(BLOCKS).map(([k,b])=>`<button class="tpl" data-act="blkAdd" data-p="${id}" data-t="${k}"><b>${b.n}</b><span>${b.d}</span></button>`).join('')}</div></section>`:''}
  ${p.blocks.length?`<div class="blocks">${p.blocks.map((b,i)=>`<section class="card blk ${b.type==='log'||b.type==='note'?'wide':''}">
    <div class="row sb blkhead"><input class="blktitle" type="text" data-ch="blkTxt" data-p="${id}" data-b="${b.id}" data-f="title" value="${esc(b.title)}" aria-label="區塊名稱"><span class="row blktools"><span class="pill mut">${BLOCKS[b.type].n}</span><button class="ghost sm" data-act="blkMv" data-p="${id}" data-b="${b.id}" data-d="-1" aria-label="往前"${i===0?' disabled':''}>↑</button><button class="ghost sm" data-act="blkMv" data-p="${id}" data-b="${b.id}" data-d="1" aria-label="往後"${i===p.blocks.length-1?' disabled':''}>↓</button><button class="ghost sm" data-act="blkDel" data-p="${id}" data-b="${b.id}" aria-label="刪除區塊">×</button></span></div>
    ${blockBody(id,b)}</section>`).join('')}</div>`:`<section class="card empty-page"><h2>這是一個空白頁面</h2><p class="muted">按「＋ 新增區塊」，從筆記、清單、計數器、進度條、倒數日、每日打卡、紀錄表中挑選，組合成你需要的樣子。</p><button class="sec" data-act="pgAddToggle">＋ 新增區塊</button></section>`}`;
}
const blk=(p,b)=>p.blocks.find(x=>x.id===b);

/* ---------- Google Calendar import ---------- */
const GC={key:'',events:{},state:'idle',msg:''};
function gcOn(){return !STANDALONE&&!!cfg().gcalOn}
async function gcLoad(force){
  const days=monthDays(calM),key=calM;
  if(!force&&GC.key===key&&GC.state==='ok')return;
  GC.key=key;GC.state='loading';GC.msg='';
  let mcp=null;try{mcp=window.claude&&claude.use?await claude.use('mcp'):null}catch{}
  if(!mcp){GC.state='err';GC.msg='這裡無法連到 Google 日曆。請在 claude.ai 開啟這個頁面。';if(R==='calendar')render();return}
  const ev={};let token=null,guard=0;
  try{
    do{const input={startTime:days[0]+'T00:00:00',endTime:addDays(days[41],1)+'T00:00:00',orderBy:'startTime',pageSize:250};if(token)input.pageToken=token;
      const res=await mcp.callTool('Google Calendar','list_events',input,{cache:force?{refresh:true,staleTime:300000,gcTime:3600000}:{staleTime:300000,gcTime:3600000}});
      const pl=res&&res.payload||{};
      (pl.events||[]).forEach(e=>{if(e.status==='cancelled')return;if(cfg().gcalSkipFree!==false&&(e.transparency==='transparent'||e.availability==='AVAILABILITY_FREE'))return;
        const s=e.start||{},en=e.end||{};const allDay=!!s.date;const d0=allDay?s.date:ymd(new Date(s.dateTime));let d1=allDay?addDays(en.date||s.date,-1):ymd(new Date(en.dateTime||s.dateTime));if(d1<d0)d1=d0;
        const t=allDay?'':(()=>{const x=new Date(s.dateTime);return pad(x.getHours())+':'+pad(x.getMinutes())})();
        for(let k=d0,g=0;k<=d1&&g<40;k=addDays(k,1),g++)(ev[k]=ev[k]||[]).push({t,n:e.summary||'（無標題）',url:e.htmlLink||'',allDay});});
      token=pl.nextPageToken;}while(token&&++guard<4);
    GC.events=ev;GC.state='ok';
  }catch(e){GC.state='err';const c=e&&e.code;GC.msg=c==='server_not_connected'?'還沒有連接 Google 日曆。到 claude.ai 的「設定 → 連接器」加入 Google Calendar 後再試一次。':c==='not_in_manifest'||c==='approval_required'?'這次沒有允許讀取 Google 日曆。再按一次「重新整理」可以重新詢問。':c==='needs_reauth'?'Google 日曆需要重新連接（claude.ai 設定 → 連接器）。':'讀取 Google 日曆時發生問題，請稍後再試。'}
  if(R==='calendar')render();
}
function gcBar(){
  if(STANDALONE)return '';
  if(!gcOn())return `<div class="gcbar"><div><b>把 Google 日曆的行程放進來</b><div class="muted">在月曆上同時看到課表、會議和你的讀書紀錄。只會讀取，不會修改你的日曆。</div></div><button class="sec" data-act="gcOn">顯示 Google 日曆</button></div>`;
  return `<div class="gcbar on"><div><b>Google 日曆</b> <span class="muted">${GC.state==='loading'?'讀取中…':GC.state==='err'?esc(GC.msg):'已顯示這個月的行程'}</span></div><div class="row"><label class="row" style="font-size:12px"><input type="checkbox" data-ch="gcFree" ${cfg().gcalSkipFree!==false?'checked':''}> 略過標為「空閒」的活動</label><button class="sm" data-act="gcRefresh">重新整理</button><button class="ghost sm" data-act="gcOff">隱藏</button></div></div>`;
}

Object.assign(A,{
  pgNewOpen:openNewPage,
  pgNew:el=>newPage(el.dataset.t),
  pgAddToggle:()=>{pgAdding=!pgAdding;render()},
  pgDel:el=>{if(!twoStep(el))return;remove('pages',el.dataset.p);location.hash='today'},
  blkAdd:el=>{editPage(el.dataset.p,p=>{p.blocks.push(mkBlock(el.dataset.t))});pgAdding=false;render();setTimeout(()=>{const b=document.querySelectorAll('.blk');b.length&&b[b.length-1].scrollIntoView({block:'center'})},40)},
  blkDel:el=>{if(!twoStep(el))return;editPage(el.dataset.p,p=>{p.blocks=p.blocks.filter(b=>b.id!==el.dataset.b)});render()},
  blkMv:el=>{editPage(el.dataset.p,p=>{const i=p.blocks.findIndex(b=>b.id===el.dataset.b),j=i+(+el.dataset.d);if(j>=0&&j<p.blocks.length)[p.blocks[i],p.blocks[j]]=[p.blocks[j],p.blocks[i]]});render()},
  blkItemAdd:el=>{const i=$('#bi'+el.dataset.b),t=i.value.trim();if(!t)return;editPage(el.dataset.p,p=>{blk(p,el.dataset.b).items.push({id:rid(),t,done:false})});render();setTimeout(()=>{const n=$('#bi'+el.dataset.b);n&&n.focus()},30)},
  blkItemDel:el=>{editPage(el.dataset.p,p=>{const b=blk(p,el.dataset.b);b.items=b.items.filter(x=>x.id!==el.dataset.id)});render()},
  blkCnt:el=>{editPage(el.dataset.p,p=>{const b=blk(p,el.dataset.b);b.value=Math.max(0,(+b.value||0)+(+el.dataset.d)*(+b.step||1))});render()},
  blkReset:el=>{if(!twoStep(el))return;editPage(el.dataset.p,p=>{blk(p,el.dataset.b).value=0});render()},
  blkHabit:el=>{const k=el.dataset.k;editPage(el.dataset.p,p=>{const b=blk(p,el.dataset.b);if(b.days[k])delete b.days[k];else b.days[k]=true});render()},
  blkColAdd:el=>{editPage(el.dataset.p,p=>{blk(p,el.dataset.b).cols.push('新欄位')});render()},
  blkColDel:el=>{if(!twoStep(el))return;const i=+el.dataset.i;editPage(el.dataset.p,p=>{const b=blk(p,el.dataset.b);b.cols.splice(i,1);b.rows.forEach(r=>r.c.splice(i,1))});render()},
  blkRowAdd:el=>{const b0=blk(S.pages[el.dataset.p],el.dataset.b);const c=b0.cols.map((_,i)=>($('#br'+el.dataset.b+'_'+i)||{}).value||'');if(!c.some(x=>x.trim()))return toast('至少填一欄');editPage(el.dataset.p,p=>{blk(p,el.dataset.b).rows.push({id:rid(),c})});render()},
  blkRowDel:el=>{if(!twoStep(el))return;editPage(el.dataset.p,p=>{const b=blk(p,el.dataset.b);b.rows=b.rows.filter(r=>r.id!==el.dataset.id)});render()},
  gcOn:()=>{editCfg(c=>{c.gcalOn=true});GC.state='idle';render();gcLoad(false)},
  gcOff:()=>{editCfg(c=>{c.gcalOn=false});render()},
  gcRefresh:()=>{gcLoad(true);render()},
  navToggle:el=>{const r=el.dataset.r;editCfg(c=>{c.hidden=c.hidden||[];if(c.hidden.includes(r))c.hidden=c.hidden.filter(x=>x!==r);else c.hidden.push(r)});render()}
});
Object.assign(C,{
  pgName:el=>{editPage(el.dataset.p,p=>{p.name=el.value.trim()||'未命名頁面'});renderNav()},
  blkTxt:el=>{editPage(el.dataset.p,p=>{blk(p,el.dataset.b)[el.dataset.f]=el.value});if(el.dataset.f!=='title')render()},
  blkNum:el=>{editPage(el.dataset.p,p=>{blk(p,el.dataset.b)[el.dataset.f]=Math.max(0,+el.value||0)});render()},
  blkChk:el=>{editPage(el.dataset.p,p=>{const x=blk(p,el.dataset.b).items.find(y=>y.id===el.dataset.id);if(x)x.done=el.checked});render()},
  blkCol:el=>{editPage(el.dataset.p,p=>{blk(p,el.dataset.b).cols[+el.dataset.i]=el.value.trim()||'欄位'});render()},
  gcFree:el=>{editCfg(c=>{c.gcalSkipFree=el.checked});gcLoad(true)}
});
Object.assign(IN,{blkF:el=>{editPage(el.dataset.p,p=>{blk(p,el.dataset.b)[el.dataset.f]=el.value},true)}});

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(!f)return;if(el.tagName==='A'&&el.getAttribute('href')&&el.getAttribute('href').startsWith('#')&&el.dataset.act!=='goReview'&&el.dataset.act!=='toJournal'){e.preventDefault()}f(el,e)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(el&&C[el.dataset.ch])C[el.dataset.ch](el,e)});
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(el&&IN[el.dataset.in])IN[el.dataset.in](el,e)});
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea,select,[contenteditable]'))return;
  if($('#modal').innerHTML){if(e.key==='Escape')closeModal();return}
  if(e.key===' '&&R==='today'){e.preventDefault();P.running?pPause():pStart();render()}
  const n=+e.key;if(n>=1&&n<=9&&!e.metaKey&&!e.ctrlKey&&!e.altKey){const it=navItems()[n-1];if(it)location.hash=it[0]}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick(true)});
init();
})();
</script>
