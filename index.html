<style>
/* Layout: quiet left rail (top strip on narrow screens), main column of soft paper-like cards; warm clay accent only for the running timer and primary actions, sage for secondary */
:root{
  --bg:#f6f3ee; --surface:#fffdfa; --sunk:#f0ece5; --ink:#3b3631; --muted:#8a8178; --line:#e8e2d8;
  --accent:#c2704f; --accent-ink:#ffffff; --focus:#5e8977;
  --good:#5a8a5e; --warn:#b98638; --bad:#b65a4e;
  --c0:#5f8f8c; --c1:#c39a4c; --c2:#8b7bae; --c3:#6a8db2; --c4:#c2704f; --c5:#7c9a68; --c6:#ad7898; --c7:#999263; --c8:#ae845e; --c9:#5c9886; --c10:#bd7383; --c11:#7c88a4;
  --shadow:0 1px 2px rgba(80,60,40,.05),0 4px 14px rgba(80,60,40,.04);
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1a17; --surface:#25221e; --sunk:#201e1a; --ink:#ece6dd; --muted:#a3998e; --line:#37322c;
  --accent:#e08d6b; --accent-ink:#2a160d; --focus:#8bb5a3;
  --good:#8dbf90; --warn:#ddb06a; --bad:#e08a7e;
  --c0:#8bbab6; --c1:#dcb872; --c2:#b3a5d6; --c3:#96b4d6; --c4:#e08d6b; --c5:#a5c290; --c6:#d3a2bf; --c7:#c3bc8a; --c8:#d4ab84; --c9:#88c2ae; --c10:#e09cab; --c11:#a8b3cc;
  --shadow:0 1px 2px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1a17; --surface:#25221e; --sunk:#201e1a; --ink:#ece6dd; --muted:#a3998e; --line:#37322c;
  --accent:#e08d6b; --accent-ink:#2a160d; --focus:#8bb5a3;
  --good:#8dbf90; --warn:#ddb06a; --bad:#e08a7e;
  --c0:#8bbab6; --c1:#dcb872; --c2:#b3a5d6; --c3:#96b4d6; --c4:#e08d6b; --c5:#a5c290; --c6:#d3a2bf; --c7:#c3bc8a; --c8:#d4ab84; --c9:#88c2ae; --c10:#e09cab; --c11:#a8b3cc;
  --shadow:0 1px 2px rgba(0,0,0,.25);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{--fs:var(--fsu,1);accent-color:var(--focus);background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:calc(14px * var(--fs,1));line-height:1.55}
.app{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100%}
nav.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh / var(--zoom,1));padding:20px 12px 20px max(12px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;background:var(--sunk)}
.brand{font-family:var(--f-display);font-weight:700;font-size:calc(18px * var(--fs,1));padding:4px 10px 16px;letter-spacing:.02em}
.brand{display:flex;align-items:center;gap:10px}
.brand>span{font-size:calc(22px * var(--fs,1));line-height:1.25;letter-spacing:.08em}
.brand small{letter-spacing:.02em}
.blogo{width:36px;height:36px;border-radius:9px;flex:none}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:calc(11px * var(--fs,1));color:var(--muted);letter-spacing:.04em}
nav.rail a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
nav.rail a:hover{background:var(--surface)}
nav.rail a[aria-current="page"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--focus)}
nav.rail a .k{margin-left:auto;font-family:var(--f-mono);font-size:calc(11px * var(--fs,1));color:var(--muted)}
.rail .foot{margin-top:auto;font-size:calc(11px * var(--fs,1));color:var(--muted);padding:10px;line-height:1.5}
.rail .mini{font-family:var(--f-mono);font-size:calc(13px * var(--fs,1));color:var(--accent);padding:6px 10px;display:none}
.rail .mini.on{display:block}
main{padding-block:24px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0;max-width:1280px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font-family:var(--f-display);font-size:calc(28px * var(--fs,1));font-weight:700;margin:0;text-wrap:balance;letter-spacing:.02em}
h2{font-size:calc(15px * var(--fs,1));font-weight:700;margin:0 0 12px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h3{font-size:calc(13px * var(--fs,1));font-weight:700;margin:14px 0 8px}
.eyebrow{margin:0 0 2px;font-size:calc(12px * var(--fs,1));color:var(--muted);letter-spacing:.06em}
.muted{color:var(--muted);font-weight:400;font-size:calc(12px * var(--fs,1))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.gridA{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:16px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:baseline;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:calc(12px * var(--fs,1));color:var(--ink);text-decoration:none}
.chip b{font-family:var(--f-mono);font-size:calc(15px * var(--fs,1))}
.chip.hot{border-color:var(--accent);color:var(--accent)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
button,.btn{font:inherit;font-size:calc(13px * var(--fs,1));border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;line-height:1.3}
button:hover{border-color:var(--muted)}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button.sec{background:var(--focus);border-color:var(--focus);color:var(--surface);font-weight:500}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.ghost:hover{color:var(--ink);background:var(--sunk)}
button.sm{padding:3px 8px;font-size:calc(12px * var(--fs,1))}
button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input,select,textarea{font:inherit;font-size:calc(13px * var(--fs,1));color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:0}
textarea{width:100%;resize:vertical;min-height:64px;line-height:1.6}
input[type=number]{width:80px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:calc(12px * var(--fs,1));color:var(--muted)}
label.f>input,label.f>select,label.f>textarea{color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--sunk);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 12px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:700}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:calc(13px * var(--fs,1));padding:10px 0}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--focus);border-radius:99px}
.pill{font-size:calc(11px * var(--fs,1));padding:1px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill.good{color:var(--good)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}.pill.mut{color:var(--muted)}
.banner{background:var(--sunk);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;font-size:calc(12px * var(--fs,1));color:var(--muted);margin-bottom:14px}
/* pomodoro */
.pomo .modes{margin-bottom:14px}
.clock{font-family:var(--f-mono);font-weight:600;font-size:clamp(56px,9vw,96px);letter-spacing:-.02em;line-height:1;text-align:center;padding:14px 0 6px;font-variant-numeric:tabular-nums}
.clock.run{color:var(--accent)}
.pbar{height:4px;background:var(--sunk);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.pbar>i{display:block;height:100%;background:var(--accent);width:0}
.cycles{display:flex;gap:6px;justify-content:center;margin-bottom:14px;font-size:calc(12px * var(--fs,1));color:var(--muted);align-items:center}
.cycles i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--accent)}
.cycles i.on{background:var(--accent)}
.pform{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.pform .wide{grid-column:1/-1}
.ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ctrl .pri{min-width:120px;padding:9px 18px;font-size:calc(15px * var(--fs,1))}
/* counters */
.ctr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.ctr:first-child{border-top:0}
.ctr .v{font-family:var(--f-mono);font-size:calc(18px * var(--fs,1))}
.ctr .bar{grid-column:1/-1}
.ctr.done .bar>i{background:var(--good)}
/* top3 */
.t3{display:flex;gap:8px;align-items:center;padding:4px 0}
.t3 input[type=text]{flex:1}
.t3.done input[type=text]{text-decoration:line-through;color:var(--muted)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .hd{font-size:calc(11px * var(--fs,1));color:var(--muted);text-align:center;padding:4px 0}
.cell{min-height:92px;border-radius:8px;border:1px solid var(--line);padding:6px 7px;cursor:pointer;display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--surface);font:inherit;color:inherit;min-width:0}
.cell.out{opacity:.4}
.cell.today{border-color:var(--focus);box-shadow:inset 0 0 0 1px var(--focus)}
.cell.sel{outline:2px solid var(--ink);outline-offset:-1px}
.cell .d{font-family:var(--f-mono);font-size:calc(12px * var(--fs,1));display:flex;justify-content:space-between;align-items:center}
.cell .m{font-size:calc(11px * var(--fs,1));color:var(--muted);font-family:var(--f-mono)}
.cell .tag{font-size:calc(10.5px * var(--fs,1));line-height:1.3;padding:1px 5px;border-radius:4px;background:var(--sunk);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cell .tag.ex{background:var(--accent);color:var(--accent-ink)}
.cell .tag.ms{border-left:3px solid var(--c2)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:calc(12px * var(--fs,1));color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
/* charts */
.chartwrap{overflow-x:auto}
svg.chart{width:100%;height:auto;display:block;max-height:320px}
svg.chart.wide{min-width:620px}
svg .grid{stroke:var(--line);stroke-width:1}
svg .ax{fill:var(--muted);font-size:calc(10px * var(--fs,1));font-family:var(--f-mono)}
svg .lbl{fill:var(--ink);font-size:calc(11px * var(--fs,1));font-family:var(--f-body)}
svg .today{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:3 3}
.hbars .li{gap:8px}
.hbars .nm{width:56px;flex:none;font-size:calc(13px * var(--fs,1))}
.hbars .bar{flex:1;height:10px}
.hbars .val{width:110px;text-align:right;font-size:calc(12px * var(--fs,1));flex:none}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .l{font-size:calc(12px * var(--fs,1));color:var(--muted)}
.kpi .n{font-family:var(--f-mono);font-size:calc(24px * var(--fs,1));font-weight:600}
.kpi .n small{font-size:calc(12px * var(--fs,1));color:var(--muted);font-family:var(--f-body);font-weight:400;margin-left:3px}
/* exam timer */
.xclock{font-family:var(--f-mono);font-weight:600;font-size:clamp(48px,8vw,84px);text-align:center;line-height:1;padding:10px 0;font-variant-numeric:tabular-nums}
.xclock.run{color:var(--focus)}
.xclock.low{color:var(--bad)}
.segs{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin:8px 0 14px}
.segs span{font-size:calc(12px * var(--fs,1));padding:3px 9px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.segs span.on{background:var(--focus);color:var(--surface)}
.segs span.past{text-decoration:line-through}
.bigdays{font-family:var(--f-display);font-size:calc(40px * var(--fs,1));font-weight:700;line-height:1}
table{border-collapse:collapse;width:100%;font-size:calc(13px * var(--fs,1))}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:calc(12px * var(--fs,1));color:var(--muted);font-weight:500}
td.num,th.num{text-align:right}
.tablewrap{overflow-x:auto}
/* plan */
.projtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.phase{border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:var(--surface)}
.phase>summary{list-style:none;cursor:pointer;padding:11px 14px;display:grid;grid-template-columns:22px minmax(0,1fr) 160px auto;gap:10px;align-items:center}
.phase>summary::-webkit-details-marker{display:none}
.phase .ix{font-family:var(--f-mono);font-size:calc(12px * var(--fs,1));color:var(--muted)}
.phase .body{padding:4px 14px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.phase.done>summary .nm{color:var(--muted);text-decoration:line-through}
.phase.cur{border-color:var(--focus)}
.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.fields .w2{grid-column:span 2}
.next{background:var(--sunk);border-radius:8px;padding:10px 12px}
.next b{display:block;font-size:calc(12px * var(--fs,1));color:var(--muted);font-weight:500;margin-bottom:4px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(36,28,20,.36);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;animation:mFade .2s ease both}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;width:min(520px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 60px rgba(50,32,15,.20);animation:mUp .28s cubic-bezier(.2,.7,.2,1) both}
@keyframes mFade{from{opacity:0}}@keyframes mUp{from{opacity:0;transform:translateY(12px) scale(.98)}}
.modal a:not(.btn),main a:not(.btn):not(.xlink){color:var(--focus)}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:8px;font-size:calc(13px * var(--fs,1));z-index:60;max-width:calc(100% - 32px)}
.mood{display:flex;gap:4px}
.mood button{width:34px;padding:5px 0;font-family:var(--f-mono)}
.wins input{width:100%;margin-bottom:6px}
.qa{white-space:pre-wrap;overflow-wrap:anywhere}
nav.rail .sharebtn{margin:12px 6px 0;background:var(--focus);border-color:var(--focus);color:var(--surface);font-weight:500}
.quiz{max-width:760px}
.qprog{display:flex;gap:4px;margin-bottom:18px;flex-wrap:wrap}
.qprog span{flex:1;min-width:64px;font-size:calc(12px * var(--fs,1));color:var(--muted);padding-top:6px;border-top:3px solid var(--line)}
.qprog span.on{color:var(--ink);font-weight:700;border-color:var(--accent)}
.qprog span.past{border-color:var(--focus)}
.qq{padding:14px 0;border-top:1px solid var(--line)}
.qq:first-of-type{border-top:0}
.qt{display:block;font-size:calc(15px * var(--fs,1));margin-bottom:10px;font-weight:500}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:8px 14px;border-radius:999px;text-align:left}
.likert{display:flex;gap:6px;align-items:center}
.likert button{width:44px;padding:8px 0;font-family:var(--f-mono)}
.likert::before{content:"不像我";font-size:calc(11px * var(--fs,1));color:var(--muted);margin-right:4px}
.likert::after{content:"很像我";font-size:calc(11px * var(--fs,1));color:var(--muted);margin-left:4px}
.callout{background:var(--sunk);border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 6px 6px 0}
.guide ul{margin:0;padding-left:18px}
.likert.v6 button{width:40px}
nav.rail .fbbtn{margin:6px 6px 0;color:var(--muted);font-size:calc(12px * var(--fs,1))}
.fbitem.done .qa{color:var(--muted);text-decoration:line-through}
.mrec2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;margin-top:6px}
.mrec2 h3{margin:8px 0 6px}

  nav.rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;overflow-x:auto;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line);z-index:5}
  .brand,.rail .foot,nav.rail a .k{display:none}
  nav.rail .sharebtn{margin:0;white-space:nowrap}
  nav.rail .fbbtn{margin:0;white-space:nowrap}
  nav.rail .syncchip{margin:0;white-space:nowrap}
  nav.rail a{white-space:nowrap}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .grid2,.grid3{grid-template-columns:1fr}
  .fields{grid-template-columns:1fr 1fr!important}
  .phase>summary{grid-template-columns:22px minmax(0,1fr) auto}
  .phase>summary .bar{display:none}
  .cell{min-height:64px}
  .cell .tag{display:none}
  .emo{width:calc(50% - 4px)}
  .plan-grid{grid-template-columns:1fr}
  .navsep{display:none}
  .navlinks{flex-direction:row}
  .navadd{white-space:nowrap}
  .grid3{grid-template-columns:1fr!important}
  .step{grid-template-columns:auto minmax(0,1fr) auto}
  .step input[type=date],.step [data-act=stepMv]{display:none}
  .card,main>*{min-width:0}
  .track{width:100%;max-width:100%;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .tseg{flex:0 0 auto!important;min-width:96px;scroll-snap-align:start}
  .tseg.on{min-width:132px}
  .tseg .tlab{font-size:calc(12px * var(--fs,1));padding:6px 8px}
  .ph{flex-direction:column;align-items:stretch;gap:10px}
  .ph h1{font-size:calc(26px * var(--fs,1));overflow-wrap:anywhere}
  .card{padding:16px}
  button,.btn{min-height:40px}
  button.sm,.btn.sm{min-height:34px;padding:5px 12px}
  .seg button{min-height:36px}
  .xlink{display:inline-block;padding:6px 0}
  .tdel,.mood button,.likert button,.hcell,.cal .cell,nav.rail button,nav.rail a{min-height:0}
  .modal{align-items:flex-end;padding:0}
  .modal .box{width:100%;border-radius:20px 20px 0 0;max-height:92vh;padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px))}
  .modal .box.welcome{border-radius:20px;margin:16px;width:calc(100% - 32px)!important;align-self:center}
  .ostage{grid-template-columns:22px minmax(0,1fr) 40px}
  .ostage .bar,.ostage>span.muted:not(.num){display:none}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sunk)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- splash ---- */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#f3ece0;color:#3b3631;cursor:pointer;transition:opacity .55s ease,visibility .55s}
#splash.out{opacity:0;visibility:hidden}
#splash .sp-art{position:relative;width:min(56vw,300px);aspect-ratio:1;border-radius:22%;overflow:hidden;box-shadow:0 18px 50px rgba(90,60,30,.18);animation:spIn .9s cubic-bezier(.2,.7,.2,1) both}
#splash .sp-art img{width:100%;height:100%;display:block}
#splash .sp-ring{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#splash .sp-ring circle{fill:none;stroke:#c9a35a;stroke-width:.9;stroke-linecap:round;stroke-dasharray:196;stroke-dashoffset:196;transform:rotate(-90deg);transform-origin:50% 38%;animation:spDraw 1.5s .35s cubic-bezier(.45,.05,.3,1) forwards}
#splash .sp-ring .dot{fill:#e8c98a;stroke:none;transform-origin:50% 38%;animation:spDot 1.5s .35s cubic-bezier(.45,.05,.3,1) forwards;opacity:0}
#splash .sp-name{font-family:var(--f-display);font-size:30px;letter-spacing:.35em;margin:6px 0 0 .35em;animation:spUp .7s .8s both}
#splash .sp-line{font-size:15px;color:#7d7268;letter-spacing:.12em;margin:0;animation:spUp .7s 1.15s both}
#splash .sp-skip{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));font-size:12px;color:#a59a8f;animation:spUp .5s 1.6s both}
@keyframes spIn{from{opacity:0;transform:scale(.92);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spDot{0%{opacity:1;transform:rotate(0)}95%{opacity:1}100%{opacity:0;transform:rotate(360deg)}}
@keyframes spUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #splash{background:#1f1c19;color:#eee7dc}:root:not([data-theme="light"]) #splash .sp-line{color:#b3a899}}
:root[data-theme="dark"] #splash{background:#1f1c19;color:#eee7dc}
:root[data-theme="dark"] #splash .sp-line{color:#b3a899}
/* ---- page switch ---- */
#main.enter{animation:pgIn .32s cubic-bezier(.2,.7,.2,1) both}
@keyframes pgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.blogo.turn{animation:logoTurn .7s cubic-bezier(.4,0,.2,1)}
@keyframes logoTurn{0%{transform:perspective(200px) rotateY(0)}50%{transform:perspective(200px) rotateY(-90deg) scale(.92)}100%{transform:perspective(200px) rotateY(0)}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}#main.enter,.blogo.turn{animation:none}}
</style>

function tSegSec(){const p=tPreset();return (p.segs[T.seg]||p.segs[0]||{s:0}).s}
function tLeft(){return T.running?Math.max(0,(T.endAt-Date.now())/1000):(T.left??tSegSec())}
function tAdvance(){
  const p=tPreset();
  if(T.seg<p.segs.length-1){T.seg++;T.left=null;T.endAt=Date.now()+tSegSec()*1000;endSound('t',()=>beep(2),'下一段：'+p.segs[T.seg].n);toast('下一段：'+p.segs[T.seg].n)}
  else{T.running=false;T.left=0;endSound('t',()=>beep(4),'測驗時間到');toast('測驗時間到')}

/* ---------- audio ---------- */
let AC=null,MASTER=null,CUR_BUS=null,SOFF=0;const SCH={};
function volPref(){const v=+lsGet('sd-vol',80);return v>=0&&v<=100?v:80}
if(lsGet('sd-bg-v2',false)!==true){lsSet('sd-bg',true);lsSet('sd-bg-v2',true)}
function bgPref(){return lsGet('sd-bg',true)!==false}
function wakePref(){return lsGet('sd-wake',false)===true}
function applyVol(){if(MASTER)MASTER.gain.value=Math.pow(volPref()/100,1.6)*1.4}
function unlockAudio(){try{
  if(navigator.audioSession&&bgPref())try{navigator.audioSession.type='playback'}catch{}
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  if(!MASTER){MASTER=AC.createGain();MASTER.connect(AC.destination);applyVol()}
  if(bgPref())keepAlive(true);
}catch{}}
const T0=()=>AC.currentTime+SOFF;
const dest=()=>CUR_BUS||MASTER||AC.destination;
// play a sound in the future on the audio clock, so it still rings when timers in the page are throttled
function schedule(key,offset,fn){cancelSched(key);if(!AC||offset<0)return;const bus=AC.createGain();bus.connect(MASTER||AC.destination);const r=reverb();if(r)bus.connect(r);
  CUR_BUS=bus;SOFF=offset;try{fn()}catch{}CUR_BUS=null;SOFF=0;SCH[key]={bus,at:AC.currentTime+offset,endAt:Date.now()+offset*1000}}
function cancelSched(key){const x=SCH[key];if(x){try{x.bus.disconnect()}catch{}delete SCH[key]}}
function endSound(key,fn,title,body){const x=SCH[key];if(x&&AC&&AC.currentTime>=x.at-.3){delete SCH[key]}else{cancelSched(key);fn()}
  try{navigator.vibrate&&navigator.vibrate([250,120,250])}catch{}notify(title,body)}
async function notify(title,body){if(!title||!document.hidden||!('Notification' in window)||Notification.permission!=='granted')return;
  try{const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();const o={body:body||'',tag:'rike-timer',renotify:true,icon:'icon-192.png'};if(reg&&reg.showNotification)reg.showNotification(title,o);else new Notification(title,o)}catch{}}
let KA=null;
function silentWav(){const n=4000,b=new Uint8Array(44+n),v=new DataView(b.buffer),w=(o,s)=>[...s].forEach((c,i)=>b[o+i]=c.charCodeAt(0));
  w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);
  for(let i=0;i<n;i++)b[44+i]=128+(i%2);let s='';b.forEach(x=>s+=String.fromCharCode(x));return 'data:audio/wav;base64,'+btoa(s)}
function keepAlive(on){try{if(on){if(!KA){KA=new Audio(silentWav());KA.loop=true;KA.setAttribute('playsinline','');KA.volume=.01}if(KA.paused)KA.play().catch(()=>{})}else if(KA&&!KA.paused)KA.pause()}catch{}}
let WL=null;
async function wakeLock(on){try{if(on&&!WL&&navigator.wakeLock&&!document.hidden){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}else if(!on&&WL){await WL.release();WL=null}}catch{WL=null}}
function mediaMeta(t){try{if('mediaSession' in navigator&&window.MediaMetadata){navigator.mediaSession.metadata=t?new MediaMetadata({title:t,artist:'日課',artwork:[{src:'icon-192.png',sizes:'192x192',type:'image/png'}]}):null}}catch{}}
// keep scheduled end sounds in step with the timers
function syncSched(){
  const want={};
  if(P.running)want.p={end:P.endAt,fn:()=>beep(P.mode==='work'?3:2)};
  if(T.running){const last=T.seg>=tPreset().segs.length-1;want.t={end:T.endAt,fn:()=>beep(last?4:2)}}
  if(MT.running)want.m={end:MT.endAt,fn:()=>yinqing(3,6.5)};
  ['p','t','m'].forEach(k=>{const w=want[k],x=SCH[k];if(!w){if(x&&!(AC&&AC.currentTime>=x.at-.3))cancelSched(k);return}
    if(AC&&(!x||Math.abs(x.endAt-w.end)>1500))schedule(k,(w.end-Date.now())/1000,w.fn)});
  const any=P.running||T.running||MT.running;
  if(!any)keepAlive(false);
  wakeLock(any&&wakePref());
  mediaMeta(any?(P.running?(P.mode==='work'?'番茄鐘・專注中':'番茄鐘・休息中'):T.running?'測驗計時中':'靜心中'):null);
}
function beep(n){if(!AC)return;try{for(let i=0;i<n;i++){const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=i%2?660:880;o.connect(g);g.connect(dest());const t=T0()+i*.32;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.start(t);o.stop(t+.27)}}catch{}}

/* ---------- charts ---------- */
function niceMax(v){if(v<=0)return 4;const raw=v/4,p=Math.pow(10,Math.floor(Math.log10(raw)));const n=raw/p;const s=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;return s*p*4}
function fmtN(v){return Math.round(v*10)/10}
function stackBars(rows,{h=200,unit='分',every=1,marker=null,minW=320,minMax=null,per=30}={}){
  const W=Math.max(rows.length*per,minW),pl=38,pb=22,pt=10,ih=h-pb-pt;
  const max=niceMax(Math.max(minMax==null?(unit==='分'?30:4):minMax,...rows.map(r=>r.parts.reduce((a,p)=>a+p.v,0))));
  const bw=(W-pl)/rows.length;
  let s=`<svg class="chart${minW>=700?' wide':''}" viewBox="0 0 ${W} ${h}" role="img" aria-label="長條圖">`;
  for(let i=0;i<=4;i++){const v=max*i/4,y=pt+ih-ih*i/4;s+=`<line class="grid" x1="${pl}" x2="${W}" y1="${y}" y2="${y}"/><text class="ax" x="${pl-6}" y="${y+3.5}" text-anchor="end">${fmtN(v)}</text>`}
  rows.forEach((r,i)=>{let y=pt+ih;const x=pl+i*bw+bw*.18,w=bw*.64;
    if(marker&&r.key===marker)s+=`<rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${ih}" fill="var(--sunk)"/>`;
    r.parts.forEach(p=>{if(!p.v)return;const hh=ih*p.v/max;y-=hh;s+=`<rect x="${x}" y="${y}" width="${w}" height="${hh}" fill="var(--c${p.c})"><title>${esc(r.label)} ${esc(p.n||'')}：${fmtN(p.v)} ${unit}</title></rect>`});
    if(i%every===0)s+=`<text class="ax" x="${pl+i*bw+bw/2}" y="${h-6}" text-anchor="middle">${esc(r.label)}</text>`});
  return `<div class="chartwrap">${s}</svg></div>`;
}
function lineChart(series,{h=220,ymax=30,labels=[]}={}){
  const W=640,pl=34,pr=26,pb=24,pt=10,ih=h-pb-pt,iw=W-pl-pr,n=labels.length;
  const X=i=>pl+(n<=1?iw/2:iw*i/(n-1)),Y=v=>pt+ih-ih*v/ymax;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="分數趨勢">`;
  for(let i=0;i<=4;i++){const v=ymax*i/4;s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${pl-6}" y="${Y(v)+3.5}" text-anchor="end">${fmtN(v)}</text>`}
  const ev=Math.max(1,Math.ceil(n/8));labels.forEach((l,i)=>{if(i%ev===0||i===n-1)s+=`<text class="ax" x="${X(i)}" y="${h-6}" text-anchor="middle">${esc(l)}</text>`});
  series.forEach(se=>{const pts=se.vals.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);if(!pts.length)return;
    s+=`<polyline fill="none" stroke="var(--c${se.c})" stroke-width="2" points="${pts.map(p=>p.join(',')).join(' ')}"/>`;
    pts.forEach((p,i)=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4:2.5}" fill="var(--c${se.c})"/>`})});
  return `<div class="chartwrap">${s}</svg></div>`;
}
function hbars(items,unitFn){
  const max=Math.max(1,...items.map(i=>i.v));
  return `<div class="list hbars">${items.map(i=>`<div class="li"><span class="nm">${esc(i.n)}</span><div class="bar"><i style="width:${100*i.v/max}%;background:var(--c${i.c})"></i></div><span class="val num">${unitFn(i)}</span></div>`).join('')}</div>`;
}

function moodInsight(keys){
  const pairs=keys.map(k=>{const d=day(k);return {m:d.j&&d.j.mood,e:d.j&&d.j.energy,min:(d.sessions||[]).reduce((a,s)=>a+(+s.min||0),0)}}).filter(p=>p.m||p.e);
  if(pairs.length<5)return `<p class="muted" style="margin-top:12px">在覺察日記記錄 5 天以上的心境和精力，這裡會顯示它們和專注時間的關係。</p>`;
  const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
  const hi=avg(pairs.filter(p=>p.e>=4).map(p=>p.min)),lo=avg(pairs.filter(p=>p.e&&p.e<=2).map(p=>p.min));
  const mh=avg(pairs.filter(p=>p.m>=4).map(p=>p.min)),ml=avg(pairs.filter(p=>p.m&&p.m<=2).map(p=>p.min));
  return `<h3>心境、精力與專注 ${XL('覺察日記','journal')}</h3><p class="muted">精力 4–5 分的日子平均專注 ${hi??'—'} 分，1–2 分的日子 ${lo??'—'} 分。<br>心境 4–5 分的日子平均 ${mh??'—'} 分，1–2 分的日子 ${ml??'—'} 分。</p>`;
}
function weekReview(keys,A,subs){
  const wk=keys[0],rv=S.reviews[wk]||{};
  const wins=keys.flatMap(k=>((day(k).j||{}).wins||[]).filter(Boolean).map(w=>({k,w})));
  const inWk=d=>d&&d>=keys[0]&&d<=keys[6];
  const projMoves=Object.keys(S.projects).map(id=>{const p=proj(id);const st=p.stages.reduce((a,s)=>a+s.steps.filter(x=>inWk(x.doneAt)).length,0),w=(p.wins||[]).filter(x=>inWk(x.d)).length,q=Object.values(S.quotes).filter(x=>x.proj===id&&inWk(x.d)).length;if(!st&&!w&&!q)return '';return `<li>${esc(p.name)}：完成 ${st} 步、${w} 個小成果、${q} 則書摘</li>`}).join('');
  const top=subs[0];
  return `<section class="card"><h2>週回顧 <span class="muted">回頭看看這一週，寫下下週想調整的事</span></h2>

    <div><h3>下週要調整</h3><textarea id="rv${wk}" data-in="review" data-k="${wk}" rows="6" placeholder="例：口說練習排在早上；論文每天至少 1 個番茄">${esc(rv.text)}</textarea></div>
  </div></section>`;
}

  ${fbAdminHTML()}
  <section class="card" style="margin-bottom:16px"><div class="row sb"><div><h2 style="margin:0">使用說明</h2><p class="muted" style="margin:4px 0 0">第一次使用的簡介，以及怎麼把日課加到手機主畫面。</p></div><div class="row"><button class="sm" data-act="wAgain">再看一次簡介</button>${STANDALONE?'<a class="btn sm" href="guide.html" target="_blank" rel="noopener">完整說明</a>':''}</div></div></section>

  ${dataCardHTML()}${syncCardHTML()}`;

function parseSegs(str){return str.split(/[,，、]/).map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/^(.*?)\s*(\d+)(?::(\d{1,2}))?$/);if(!m)return null;return {n:m[1].trim()||'計時',s:(+m[2])*60+(+(m[3]||0))}}).filter(s=>s&&s.s>0)}

const VIEWS={mind:vMind,today:vToday,calendar:vCalendar,stats:vStats,exam:vExam,plan:vPlan,journal:vJournal,quiz:vQuiz,prefs:vPrefs};

/* ---------- actions ---------- */
const armed=new WeakSet();
function twoStep(el){if(armed.has(el))return true;armed.add(el);const o=el.textContent;el.textContent='確定刪除？';el.classList.remove('ghost');setTimeout(()=>{armed.delete(el);if(el.isConnected){el.textContent=o;el.classList.add('ghost')}},3000);return false}
const A={
  pmode:el=>{pSetMode(el.dataset.m);render()},
  ptoggle:()=>{const was=P.running;was?pPause():pStart();render();if(was){const i=$('#pPause');i&&i.focus()}},
  parkAdd:()=>{const i=$('#parkIn'),t=i.value.trim();if(!t)return toast('先寫下想到的事');const n=new Date();editDay(today(),d=>{d.j.park=d.j.park||[];d.j.park.push({id:rid(),t:pad(n.getHours())+':'+pad(n.getMinutes()),text:t,done:false})});render();setTimeout(()=>{const j=$('#parkIn');j&&j.focus()},30)},
  parkDel:el=>{editDay(today(),d=>{d.j.park=(d.j.park||[]).filter(x=>x.id!==el.dataset.id)});render()},
  preset:()=>{pReset();render()},
  pfinish:()=>{if(P.mode!=='work')return;const el=(modeSec('work')-pLeft())/60;if(el<1&&!P.running&&!P.startedAt){openRecord({min:cfg().pomo.work,manual:true,sub:P.sub,proj:P.proj,phase:P.phase,task:P.task});return}pComplete(true)},
  pskip:()=>{P.mode='work';pReset();render()},
  todayStep:el=>{const st=proj(el.dataset.p).stages.find(s=>s.id===el.dataset.st);const x=st.steps.find(y=>y.id===el.dataset.id);P.proj=el.dataset.p;P.phase=st.id;P.task=x.t;if(!P.running)P.mode='work';savP();render();window.scrollTo(0,0)},
  manual:el=>{const k=el.dataset.k||today();const d=k===today()?new Date(Date.now()-cfg().pomo.work*60000):new Date(k+'T09:00');openRecord({manual:true,min:cfg().pomo.work,t:d.toISOString(),sub:P.sub,proj:P.proj,phase:P.phase})},
  recSave:saveRecord,
  recWhy:el=>{const w=$('#rWhy');if(w){w.value=el.dataset.v;el.parentNode.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===el?'true':'false'))}},
  recCancel:closeModal,
  delSess:el=>{if(!twoStep(el))return;editDay(el.dataset.k,d=>{d.sessions=d.sessions.filter(s=>s.id!==el.dataset.id)});render()},
  cnt:el=>{const id=el.dataset.id,x=cfg().counters.find(c=>c.id===id)||{step:1};editDay(el.dataset.k,d=>{d.counts[id]=Math.max(0,(+d.counts[id]||0)+(+el.dataset.d)*(+x.step||1))});render()},
  goReview:()=>{mkFilter='due';setTimeout(()=>{const m=$('#mistakes');m&&m.scrollIntoView()},60)},
  calSel:el=>{calSel=el.dataset.k;if(el.dataset.k.slice(0,7)!==calM)calM=el.dataset.k.slice(0,7);render()},
  calNav:el=>{const d=+el.dataset.d;if(!d){calM=today().slice(0,7);calSel=today()}else{const x=parseD(calM+'-01');x.setMonth(x.getMonth()+d);calM=ymd(x).slice(0,7)}render()},
  toJournal:el=>{jDay=el.dataset.k},
  go:el=>{const to=el.dataset.to,k=el.dataset.k;
    if(to==='calendar'&&k){calSel=k;calM=k.slice(0,7)}
    if(to==='stats'){if(el.dataset.m)stMode=el.dataset.m;if(k)stAnchor=k}
    if(to==='journal'&&k)jDay=k;
    if(location.hash==='#'+to)render();else location.hash=to;window.scrollTo(0,0)},
  stMode:el=>{stMode=el.dataset.m;render()},
  stNav:el=>{const d=+el.dataset.d;if(!d)stAnchor=today();else if(stMode==='day')stAnchor=addDays(stAnchor,d);else if(stMode==='week')stAnchor=addDays(stAnchor,7*d);else{const x=parseD(stAnchor.slice(0,7)+'-01');x.setMonth(x.getMonth()+d);stAnchor=ymd(x)}render()},
  tPick:el=>{if(T.running)return toast('計時進行中，先暫停或重設');T={pid:el.dataset.id,seg:0,running:false,endAt:0,left:null};savT();render()},
  tToggle:()=>{unlockAudio();if(T.running){T.left=tLeft();T.running=false}else{if(tLeft()<=0){T.seg=0;T.left=null}T.endAt=Date.now()+tLeft()*1000;T.running=true}savT();render()},
  tPlus:()=>{if(T.running)T.endAt+=60000;else T.left=tLeft()+60;savT();tick(true)},
  tNext:()=>{const p=tPreset();if(T.seg<p.segs.length-1){T.seg++;T.left=null;if(T.running)T.endAt=Date.now()+tSegSec()*1000}savT();render()},
  tReset:()=>{T.running=false;T.seg=0;T.left=null;savT();render()},
  tEdit:()=>{tEditing=!tEditing;render()},
  tSegRead:()=>{const p=tPreset();return p.segs.map((_,i)=>({n:($('#tsn'+i).value||'計時').trim(),s:Math.max(0,(+$('#tsm'+i).value||0)*60+(+$('#tss'+i).value||0))}))},
  tSegAdd:()=>{const segs=A.tSegRead();segs.push({n:'新段落',s:600});editCfg(c=>{const t=c.timers.find(x=>x.id===T.pid);if(t)t.segs=segs;c.tv=2});render()},
  tSegDel:el=>{const segs=A.tSegRead();segs.splice(+el.dataset.i,1);editCfg(c=>{const t=c.timers.find(x=>x.id===T.pid);if(t)t.segs=segs;c.tv=2});render()},
  tNew:()=>{if(T.running)return toast('計時進行中，先暫停或重設');const id=rid();editCfg(c=>{c.timers.push({id,name:'我的計時',segs:[{n:'作答',s:1500}]});c.tv=2});T={pid:id,seg:0,running:false,endAt:0,left:null};savT();tEditing=true;render();setTimeout(()=>{const n=$('#tName');n&&n.select()},40)},
  tDelP:el=>{if(!twoStep(el))return;editCfg(c=>{c.timers=c.timers.filter(x=>x.id!==T.pid);c.tv=2});T={pid:(cfg().timers[0]||{}).id,seg:0,running:false,endAt:0,left:null};savT();tEditing=false;render()},
  tSave:()=>{const segs=A.tSegRead().filter(x=>x.s>0);if(!segs.length)return toast('至少要有一段大於 0 秒');const nm=(($('#tName')||{}).value||'').trim();editCfg(c=>{const t=c.timers.find(x=>x.id===T.pid);if(t){t.segs=segs;if(nm)t.name=nm}c.tv=2});if(!T.running){T.seg=0;T.left=null;savT()}tEditing=false;toast('已儲存');render()},
  tDefault:()=>{const d=DEF.timers.find(x=>x.id===T.pid);editCfg(c=>{const t=c.timers.find(x=>x.id===T.pid);if(t&&d)t.segs=clone(d.segs);else if(!d){c.timers=clone(DEF.timers);T.pid='n1'}c.tv=2});T.seg=0;T.left=null;savT();toast(d?'已恢復預設時間':'已恢復全部預設');render()},
  exAdd:()=>{editCfg(c=>c.exams.push({id:rid(),name:'新的考試',date:''}));render()},
  exDel:el=>{if(!twoStep(el))return;editCfg(c=>c.exams.splice(+el.dataset.i,1));render()},
  mkSubEditT:()=>{mkSubEdit=!mkSubEdit;mkSubAdding=false;render()},
  mkSubDel:el=>{const id=el.dataset.id,t=mkSubs().find(x=>x.id===id);if(!t)return;editCfg(c=>{c.mkSubjects=mkSubs().filter(x=>x.id!==id);c.mkArchived=(c.mkArchived||[]).concat([t])});toast('已刪除「'+t.n+'」，舊的錯題仍保留');render()},
  mkSubAdd:()=>{const n=$('#mkSubNew').value.trim();if(!n)return toast('先寫科目名稱');if(mkSubs().some(x=>x.n===n))return toast('已經有「'+n+'」');const id='mk'+rid();editCfg(c=>{c.mkSubjects=mkSubs().concat([{id,n,c:mkSubs().length%12}])});mkSubAdding=false;render();setTimeout(()=>{const sel=$('#msS');if(sel)sel.value=id},20)},
  mockAdd:()=>{const m={date:$('#mkD').value||today(),scale:cfg().scale,note:$('#mkN').value.trim()};let any=false;scoreSpec(cfg().scale).secs.forEach(([k])=>{const v=$('#mk_'+k).value;m[k]=v===''?'':+v;if(v!=='')any=true});if(!any)return toast('至少填一科分數');save('mocks',rid(),m);toast('已新增模考紀錄');render()},
  mockDel:el=>{if(!twoStep(el))return;remove('mocks',el.dataset.id);render()},
  msAdd:()=>{const q=$('#msQ').value.trim();if(!q)return toast('先寫下題目或摘要');save('mistakes',rid(),{sub:(($('#msS')||{}).value||'').replace('__add',''),q,a:$('#msA').value.trim(),causes:[$('#msC').value],created:today(),stage:0,due:addDays(today(),SRS[0]),hist:[]});toast('已加入，明天會提醒複習');render()},
  msF:el=>{mkFilter=el.dataset.m;render()},
  msRev:el=>{const m=clone(S.mistakes[el.dataset.id]);const ok=el.dataset.ok==='1';m.hist=(m.hist||[]).concat([{d:today(),ok}]);if(ok){m.stage++;m.due=m.stage>=SRS.length?null:addDays(today(),SRS[m.stage])}else{m.stage=0;m.due=addDays(today(),1)}save('mistakes',el.dataset.id,m);render()},
  msDel:el=>{if(!twoStep(el))return;remove('mistakes',el.dataset.id);render()},
  projSel:el=>{planNew=!el.dataset.id;if(el.dataset.id)curProj=el.dataset.id;render()},
  projNew:el=>newProject(el.dataset.k),
  projDel:el=>{if(!twoStep(el))return;remove('projects',el.dataset.id);curProj=null;render()},
  phAdd:()=>{editProj(p=>{const last=(p.phases||[]).slice(-1)[0];const s=last&&last.end?addDays(last.end,1):today();p.phases.push({id:rid(),name:'新階段',start:s,end:addDays(s,30),unit:'',target:0,done:0,next:'',status:'todo',ms:[]})});render()},
  phDel:el=>{if(!twoStep(el))return;editProj(p=>{p.phases=p.phases.filter(x=>x.id!==el.dataset.id)});render()},
  phMove:el=>{editProj(p=>{const i=p.phases.findIndex(x=>x.id===el.dataset.id),j=i+(+el.dataset.d);if(j<0||j>=p.phases.length)return;[p.phases[i],p.phases[j]]=[p.phases[j],p.phases[i]]});render()},

  msRm:el=>{editProj(p=>{const x=p.phases.find(y=>y.id===el.dataset.id);x.ms=x.ms.filter(m=>m.id!==el.dataset.m)});render()},
  mtAdd:()=>{const n=$('#mtN').value.trim(),a=$('#mtA').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!n&&!a.length)return;editProj(p=>{p.meetings=p.meetings||[];p.meetings.push({id:rid(),date:$('#mtD').value||today(),notes:n,acts:a.map(t=>({id:rid(),t,done:false}))})});render()},
  mtDel:el=>{if(!twoStep(el))return;editProj(p=>{p.meetings=p.meetings.filter(m=>m.id!==el.dataset.id)});render()},
  jNav:el=>{const d=+el.dataset.d;jDay=d?addDays(jDay,d):today();render()},
  jScore:el=>{const f=el.dataset.f,n=+el.dataset.n;editDay(el.dataset.k,d=>{d.j[f]=d.j[f]===n?null:n});render()},

  if(b.type==='progress'){const pct=b.target?Math.min(100,b.cur/b.target*100):0;return `<div class="row sb"><span class="bignum num">${Math.round(pct)}<small>%</small></span><span class="muted num">${b.cur} / ${b.target} ${esc(b.unit)}</span></div><div class="bar big"><i style="width:${pct}%"></i></div><div class="row cfgrow"><label class="f">目前<input type="number" min="0" data-ch="blkNum" ${A_} data-f="cur" value="${b.cur}"></label><label class="f">目標<input type="number" min="1" data-ch="blkNum" ${A_} data-f="target" value="${b.target}"></label><label class="f">單位<input type="text" data-ch="blkTxt" ${A_} data-f="unit" value="${esc(b.unit)}" style="width:70px" placeholder="頁、章"></label></div>`}

  if(b.type==='habit'){const ds=Array.from({length:35},(_,i)=>addDays(today(),i-34)),done=ds.filter(k=>b.days[k]).length;let streak=0,k=today();if(!b.days[k])k=addDays(k,-1);while(b.days[k]){streak++;k=addDays(k,-1)}

  ${pgAdding?`<section class="card" style="margin-bottom:16px"><h2>選一種區塊加入</h2><div class="tplgrid">${Object.entries(BLOCKS).map(([k,b])=>`<button class="tpl" data-act="blkAdd" data-p="${id}" data-t="${k}"><b>${b.n}</b><span>${b.d}</span></button>`).join('')}</div></section>`:''}
  ${p.blocks.length?`<div class="blocks">${p.blocks.map((b,i)=>`<section class="card blk ${b.type==='log'||b.type==='note'?'wide':''}">
    <div class="row sb blkhead"><input class="blktitle" type="text" data-ch="blkTxt" data-p="${id}" data-b="${b.id}" data-f="title" value="${esc(b.title)}" aria-label="區塊名稱"><span class="row blktools"><span class="pill mut">${BLOCKS[b.type].n}</span><button class="ghost sm" data-act="blkMv" data-p="${id}" data-b="${b.id}" data-d="-1" aria-label="往前"${i===0?' disabled':''}>↑</button><button class="ghost sm" data-act="blkMv" data-p="${id}" data-b="${b.id}" data-d="1" aria-label="往後"${i===p.blocks.length-1?' disabled':''}>↓</button><button class="ghost sm" data-act="blkDel" data-p="${id}" data-b="${b.id}" aria-label="刪除區塊">×</button></span></div>
    ${blockBody(id,b)}</section>`).join('')}</div>`:`<section class="card empty-page"><h2>這是一個空白頁面</h2><p class="muted">按「＋ 新增區塊」，從筆記、清單、計數器、進度條、倒數日、每日打卡、紀錄表中挑選，組合成你需要的樣子。</p><button class="sec" data-act="pgAddToggle">＋ 新增區塊</button></section>`}`;
}
const blk=(p,b)=>p.blocks.find(x=>x.id===b);

/* ---------- Google Calendar import ---------- */
const GC={key:'',events:{},state:'idle',msg:''};
function gcOn(){return !STANDALONE&&!!cfg().gcalOn}
async function gcLoad(force){
  const days=monthDays(calM),key=calM;
  if(!force&&GC.key===key&&GC.state==='ok')return;
  GC.key=key;GC.state='loading';GC.msg='';
  let mcp=null;try{mcp=window.claude&&claude.use?await claude.use('mcp'):null}catch{}
  if(!mcp){GC.state='err';GC.msg='這裡無法連到 Google 日曆。請在 claude.ai 開啟這個頁面。';if(R==='calendar')render();return}
  const ev={};let token=null,guard=0;
  try{
    do{const input={startTime:days[0]+'T00:00:00',endTime:addDays(days[41],1)+'T00:00:00',orderBy:'startTime',pageSize:250};if(token)input.pageToken=token;
      const res=await mcp.callTool('Google Calendar','list_events',input,{cache:force?{refresh:true,staleTime:300000,gcTime:3600000}:{staleTime:300000,gcTime:3600000}});
      const pl=res&&res.payload||{};
      (pl.events||[]).forEach(e=>{if(e.status==='cancelled')return;if(cfg().gcalSkipFree!==false&&(e.transparency==='transparent'||e.availability==='AVAILABILITY_FREE'))return;
        const s=e.start||{},en=e.end||{};const allDay=!!s.date;const d0=allDay?s.date:ymd(new Date(s.dateTime));let d1=allDay?addDays(en.date||s.date,-1):ymd(new Date(en.dateTime||s.dateTime));if(d1<d0)d1=d0;
        const t=allDay?'':(()=>{const x=new Date(s.dateTime);return pad(x.getHours())+':'+pad(x.getMinutes())})();
        for(let k=d0,g=0;k<=d1&&g<40;k=addDays(k,1),g++)(ev[k]=ev[k]||[]).push({t,n:e.summary||'（無標題）',url:e.htmlLink||'',allDay});});
      token=pl.nextPageToken;}while(token&&++guard<4);
    GC.events=ev;GC.state='ok';
  }catch(e){GC.state='err';const c=e&&e.code;GC.msg=c==='server_not_connected'?'還沒有連接 Google 日曆。到 claude.ai 的「設定 → 連接器」加入 Google Calendar 後再試一次。':c==='not_in_manifest'||c==='approval_required'?'這次沒有允許讀取 Google 日曆。再按一次「重新整理」可以重新詢問。':c==='needs_reauth'?'Google 日曆需要重新連接（claude.ai 設定 → 連接器）。':'讀取 Google 日曆時發生問題，請稍後再試。'}
  if(R==='calendar')render();
}
function gcBar(){
  if(STANDALONE)return '';
  if(!gcOn())return `<div class="gcbar"><div><b>把 Google 日曆的行程放進來</b><div class="muted">在月曆上同時看到課表、會議和你的讀書紀錄。只會讀取，不會修改你的日曆。</div></div><button class="sec" data-act="gcOn">顯示 Google 日曆</button></div>`;
  return `<div class="gcbar on"><div><b>Google 日曆</b> <span class="muted">${GC.state==='loading'?'讀取中…':GC.state==='err'?esc(GC.msg):'已顯示這個月的行程'}</span></div><div class="row"><label class="row" style="font-size:calc(12px * var(--fs,1))"><input type="checkbox" data-ch="gcFree" ${cfg().gcalSkipFree!==false?'checked':''}> 略過標為「空閒」的活動</label><button class="sm" data-act="gcRefresh">重新整理</button><button class="ghost sm" data-act="gcOff">隱藏</button></div></div>`;
}

Object.assign(A,{
  pgNewOpen:openNewPage,
  pgNew:el=>newPage(el.dataset.t),
  pgAddToggle:()=>{pgAdding=!pgAdding;render()},
  pgDel:el=>{if(!twoStep(el))return;remove('pages',el.dataset.p);location.hash='today'},
  blkAdd:el=>{editPage(el.dataset.p,p=>{p.blocks.push(mkBlock(el.dataset.t))});pgAdding=false;render();setTimeout(()=>{const b=document.querySelectorAll('.blk');b.length&&b[b.length-1].scrollIntoView({block:'center'})},40)},
  blkDel:el=>{if(!twoStep(el))return;editPage(el.dataset.p,p=>{p.blocks=p.blocks.filter(b=>b.id!==el.dataset.b)});render()},
  blkMv:el=>{editPage(el.dataset.p,p=>{const i=p.blocks.findIndex(b=>b.id===el.dataset.b),j=i+(+el.dataset.d);if(j>=0&&j<p.blocks.length)[p.blocks[i],p.blocks[j]]=[p.blocks[j],p.blocks[i]]});render()},
  blkItemAdd:el=>{const i=$('#bi'+el.dataset.b),t=i.value.trim();if(!t)return;editPage(el.dataset.p,p=>{blk(p,el.dataset.b).items.push({id:rid(),t,done:false})});render();setTimeout(()=>{const n=$('#bi'+el.dataset.b);n&&n.focus()},30)},
  blkItemDel:el=>{editPage(el.dataset.p,p=>{const b=blk(p,el.dataset.b);b.items=b.items.filter(x=>x.id!==el.dataset.id)});render()},
  blkCnt:el=>{editPage(el.dataset.p,p=>{const b=blk(p,el.dataset.b);b.value=Math.max(0,(+b.value||0)+(+el.dataset.d)*(+b.step||1))});render()},
  blkReset:el=>{if(!twoStep(el))return;editPage(el.dataset.p,p=>{blk(p,el.dataset.b).value=0});render()},
  blkHabit:el=>{const k=el.dataset.k;editPage(el.dataset.p,p=>{const b=blk(p,el.dataset.b);if(b.days[k])delete b.days[k];else b.days[k]=true});render()},
  blkColAdd:el=>{editPage(el.dataset.p,p=>{blk(p,el.dataset.b).cols.push('新欄位')});render()},
  blkColDel:el=>{if(!twoStep(el))return;const i=+el.dataset.i;editPage(el.dataset.p,p=>{const b=blk(p,el.dataset.b);b.cols.splice(i,1);b.rows.forEach(r=>r.c.splice(i,1))});render()},
  blkRowAdd:el=>{const b0=blk(S.pages[el.dataset.p],el.dataset.b);const c=b0.cols.map((_,i)=>($('#br'+el.dataset.b+'_'+i)||{}).value||'');if(!c.some(x=>x.trim()))return toast('至少填一欄');editPage(el.dataset.p,p=>{blk(p,el.dataset.b).rows.push({id:rid(),c})});render()},
  blkRowDel:el=>{if(!twoStep(el))return;editPage(el.dataset.p,p=>{const b=blk(p,el.dataset.b);b.rows=b.rows.filter(r=>r.id!==el.dataset.id)});render()},
  gcOn:()=>{editCfg(c=>{c.gcalOn=true});GC.state='idle';render();gcLoad(false)},
  gcOff:()=>{editCfg(c=>{c.gcalOn=false});render()},
  gcRefresh:()=>{gcLoad(true);render()},
  navToggle:el=>{const r=el.dataset.r;editCfg(c=>{c.hidden=c.hidden||[];if(c.hidden.includes(r))c.hidden=c.hidden.filter(x=>x!==r);else c.hidden.push(r)});render()}
});
Object.assign(C,{
  pgName:el=>{editPage(el.dataset.p,p=>{p.name=el.value.trim()||'未命名頁面'});renderNav()},
  blkTxt:el=>{editPage(el.dataset.p,p=>{blk(p,el.dataset.b)[el.dataset.f]=el.value});if(el.dataset.f!=='title')render()},
  blkNum:el=>{editPage(el.dataset.p,p=>{blk(p,el.dataset.b)[el.dataset.f]=Math.max(0,+el.value||0)});render()},
  blkChk:el=>{editPage(el.dataset.p,p=>{const x=blk(p,el.dataset.b).items.find(y=>y.id===el.dataset.id);if(x)x.done=el.checked});render()},
  blkCol:el=>{editPage(el.dataset.p,p=>{blk(p,el.dataset.b).cols[+el.dataset.i]=el.value.trim()||'欄位'});render()},
  gcFree:el=>{editCfg(c=>{c.gcalSkipFree=el.checked});gcLoad(true)}
});
Object.assign(IN,{blkF:el=>{editPage(el.dataset.p,p=>{blk(p,el.dataset.b)[el.dataset.f]=el.value},true)}});

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(!f)return;if(el.tagName==='A'&&el.getAttribute('href')&&el.getAttribute('href').startsWith('#')&&el.dataset.act!=='goReview'&&el.dataset.act!=='toJournal'){e.preventDefault()}f(el,e)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(el&&C[el.dataset.ch])C[el.dataset.ch](el,e)});
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(el&&IN[el.dataset.in])IN[el.dataset.in](el,e)});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='parkIn'&&!e.isComposing){e.preventDefault();A.parkAdd();return}
  if(e.target.closest('input,textarea,select,[contenteditable]'))return;
  if($('#modal').innerHTML){if(e.key==='Escape')closeModal();return}
  if(e.key===' '&&R==='today'){e.preventDefault();P.running?pPause():pStart();render()}
  const n=+e.key;if(n>=1&&n<=9&&!e.metaKey&&!e.ctrlKey&&!e.altKey){const it=navItems()[n-1];if(it)location.hash=it[0]}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick(true);if(gdAvail()&&GD.on&&gdReady()&&Date.now()-Date.parse(GD.last||0)>60000)gdSync();renderSyncChip()}});
init();
})();
</script>
