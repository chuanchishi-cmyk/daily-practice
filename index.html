<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="番茄鐘、月曆、統計、考試衝刺、論文地圖、覺察日記與自訂頁面的個人讀書工作台。資料只存在你的瀏覽器。">
<meta name="theme-color" content="#f6f3ee">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>讀書工作台</title>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* Layout: quiet left rail (top strip on narrow screens), main column of soft paper-like cards; warm clay accent only for the running timer and primary actions, sage for secondary */
:root{
  --bg:#f6f3ee; --surface:#fffdfa; --sunk:#f0ece5; --ink:#3b3631; --muted:#8a8178; --line:#e8e2d8;
  --accent:#c2704f; --accent-ink:#ffffff; --focus:#5e8977;
  --good:#5a8a5e; --warn:#b98638; --bad:#b65a4e;
  --c0:#5f8f8c; --c1:#c39a4c; --c2:#8b7bae; --c3:#6a8db2; --c4:#c2704f; --c5:#7c9a68; --c6:#ad7898; --c7:#999263; --c8:#ae845e; --c9:#5c9886; --c10:#bd7383; --c11:#7c88a4;
  --shadow:0 1px 2px rgba(80,60,40,.05),0 4px 14px rgba(80,60,40,.04);
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1a17; --surface:#25221e; --sunk:#201e1a; --ink:#ece6dd; --muted:#a3998e; --line:#37322c;
  --accent:#e08d6b; --accent-ink:#2a160d; --focus:#8bb5a3;
  --good:#8dbf90; --warn:#ddb06a; --bad:#e08a7e;
  --c0:#8bbab6; --c1:#dcb872; --c2:#b3a5d6; --c3:#96b4d6; --c4:#e08d6b; --c5:#a5c290; --c6:#d3a2bf; --c7:#c3bc8a; --c8:#d4ab84; --c9:#88c2ae; --c10:#e09cab; --c11:#a8b3cc;
  --shadow:0 1px 2px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1a17; --surface:#25221e; --sunk:#201e1a; --ink:#ece6dd; --muted:#a3998e; --line:#37322c;
  --accent:#e08d6b; --accent-ink:#2a160d; --focus:#8bb5a3;
  --good:#8dbf90; --warn:#ddb06a; --bad:#e08a7e;
  --c0:#8bbab6; --c1:#dcb872; --c2:#b3a5d6; --c3:#96b4d6; --c4:#e08d6b; --c5:#a5c290; --c6:#d3a2bf; --c7:#c3bc8a; --c8:#d4ab84; --c9:#88c2ae; --c10:#e09cab; --c11:#a8b3cc;
  --shadow:0 1px 2px rgba(0,0,0,.25);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
.app{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100%}
nav.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;padding:20px 12px 20px max(12px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;background:var(--sunk)}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;padding:4px 10px 16px;letter-spacing:.02em}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.04em}
nav.rail a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
nav.rail a:hover{background:var(--surface)}
nav.rail a[aria-current="page"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--focus)}
nav.rail a .k{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.rail .foot{margin-top:auto;font-size:11px;color:var(--muted);padding:10px;line-height:1.5}
.rail .mini{font-family:var(--f-mono);font-size:13px;color:var(--accent);padding:6px 10px;display:none}
.rail .mini.on{display:block}
main{padding-block:24px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0;max-width:1280px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font-family:var(--f-display);font-size:28px;font-weight:700;margin:0;text-wrap:balance;letter-spacing:.02em}
h2{font-size:15px;font-weight:700;margin:0 0 12px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h3{font-size:13px;font-weight:700;margin:14px 0 8px}
.eyebrow{margin:0 0 2px;font-size:12px;color:var(--muted);letter-spacing:.06em}
.muted{color:var(--muted);font-weight:400;font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.gridA{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:16px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:baseline;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:12px;color:var(--ink);text-decoration:none}
.chip b{font-family:var(--f-mono);font-size:15px}
.chip.hot{border-color:var(--accent);color:var(--accent)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
button,.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;line-height:1.3}
button:hover{border-color:var(--muted)}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button.sec{background:var(--focus);border-color:var(--focus);color:var(--surface);font-weight:500}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.ghost:hover{color:var(--ink);background:var(--sunk)}
button.sm{padding:3px 8px;font-size:12px}
button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input,select,textarea{font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:0}
textarea{width:100%;resize:vertical;min-height:64px;line-height:1.6}
input[type=number]{width:80px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label.f>input,label.f>select,label.f>textarea{color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--sunk);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 12px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:700}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:13px;padding:10px 0}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--focus);border-radius:99px}
.pill{font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill.good{color:var(--good)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}.pill.mut{color:var(--muted)}
.banner{background:var(--sunk);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--muted);margin-bottom:14px}
/* pomodoro */
.pomo .modes{margin-bottom:14px}
.clock{font-family:var(--f-mono);font-weight:600;font-size:clamp(56px,9vw,96px);letter-spacing:-.02em;line-height:1;text-align:center;padding:14px 0 6px;font-variant-numeric:tabular-nums}
.clock.run{color:var(--accent)}
.pbar{height:4px;background:var(--sunk);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.pbar>i{display:block;height:100%;background:var(--accent);width:0}
.cycles{display:flex;gap:6px;justify-content:center;margin-bottom:14px;font-size:12px;color:var(--muted);align-items:center}
.cycles i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--accent)}
.cycles i.on{background:var(--accent)}
.pform{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.pform .wide{grid-column:1/-1}
.ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ctrl .pri{min-width:120px;padding:9px 18px;font-size:15px}
/* counters */
.ctr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.ctr:first-child{border-top:0}
.ctr .v{font-family:var(--f-mono);font-size:18px}
.ctr .bar{grid-column:1/-1}
.ctr.done .bar>i{background:var(--good)}
/* top3 */
.t3{display:flex;gap:8px;align-items:center;padding:4px 0}
.t3 input[type=text]{flex:1}
.t3.done input[type=text]{text-decoration:line-through;color:var(--muted)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .hd{font-size:11px;color:var(--muted);text-align:center;padding:4px 0}
.cell{min-height:92px;border-radius:8px;border:1px solid var(--line);padding:6px 7px;cursor:pointer;display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--surface);font:inherit;color:inherit;min-width:0}
.cell.out{opacity:.4}
.cell.today{border-color:var(--focus);box-shadow:inset 0 0 0 1px var(--focus)}
.cell.sel{outline:2px solid var(--ink);outline-offset:-1px}
.cell .d{font-family:var(--f-mono);font-size:12px;display:flex;justify-content:space-between;align-items:center}
.cell .m{font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.cell .tag{font-size:10.5px;line-height:1.3;padding:1px 5px;border-radius:4px;background:var(--sunk);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cell .tag.ex{background:var(--accent);color:var(--accent-ink)}
.cell .tag.ms{border-left:3px solid var(--c2)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
/* charts */
.chartwrap{overflow-x:auto}
svg.chart{width:100%;height:auto;display:block}
svg .grid{stroke:var(--line);stroke-width:1}
svg .ax{fill:var(--muted);font-size:10px;font-family:var(--f-mono)}
svg .lbl{fill:var(--ink);font-size:11px;font-family:var(--f-body)}
svg .today{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:3 3}
.hbars .li{gap:8px}
.hbars .nm{width:56px;flex:none;font-size:13px}
.hbars .bar{flex:1;height:10px}
.hbars .val{width:110px;text-align:right;font-size:12px;flex:none}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .n{font-family:var(--f-mono);font-size:24px;font-weight:600}
.kpi .n small{font-size:12px;color:var(--muted);font-family:var(--f-body);font-weight:400;margin-left:3px}
/* exam timer */
.xclock{font-family:var(--f-mono);font-weight:600;font-size:clamp(48px,8vw,84px);text-align:center;line-height:1;padding:10px 0;font-variant-numeric:tabular-nums}
.xclock.run{color:var(--focus)}
.xclock.low{color:var(--bad)}
.segs{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin:8px 0 14px}
.segs span{font-size:12px;padding:3px 9px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.segs span.on{background:var(--focus);color:var(--surface)}
.segs span.past{text-decoration:line-through}
.bigdays{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500}
td.num,th.num{text-align:right}
.tablewrap{overflow-x:auto}
/* plan */
.projtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.phase{border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:var(--surface)}
.phase>summary{list-style:none;cursor:pointer;padding:11px 14px;display:grid;grid-template-columns:22px minmax(0,1fr) 160px auto;gap:10px;align-items:center}
.phase>summary::-webkit-details-marker{display:none}
.phase .ix{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.phase .body{padding:4px 14px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.phase.done>summary .nm{color:var(--muted);text-decoration:line-through}
.phase.cur{border-color:var(--focus)}
.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.fields .w2{grid-column:span 2}
.next{background:var(--sunk);border-radius:8px;padding:10px 12px}
.next b{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:4px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,15,16,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:8px;font-size:13px;z-index:60;max-width:calc(100% - 32px)}
.mood{display:flex;gap:4px}
.mood button{width:34px;padding:5px 0;font-family:var(--f-mono)}
.wins input{width:100%;margin-bottom:6px}
.qa{white-space:pre-wrap;overflow-wrap:anywhere}
nav.rail .sharebtn{margin:12px 6px 0;background:var(--focus);border-color:var(--focus);color:var(--surface);font-weight:500}
.quiz{max-width:760px}
.qprog{display:flex;gap:4px;margin-bottom:18px;flex-wrap:wrap}
.qprog span{flex:1;min-width:64px;font-size:12px;color:var(--muted);padding-top:6px;border-top:3px solid var(--line)}
.qprog span.on{color:var(--ink);font-weight:700;border-color:var(--accent)}
.qprog span.past{border-color:var(--focus)}
.qq{padding:14px 0;border-top:1px solid var(--line)}
.qq:first-of-type{border-top:0}
.qt{display:block;font-size:15px;margin-bottom:10px;font-weight:500}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:8px 14px;border-radius:999px;text-align:left}
.likert{display:flex;gap:6px;align-items:center}
.likert button{width:44px;padding:8px 0;font-family:var(--f-mono)}
.likert::before{content:"不像我";font-size:11px;color:var(--muted);margin-right:4px}
.likert::after{content:"很像我";font-size:11px;color:var(--muted);margin-left:4px}
.callout{background:var(--sunk);border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 6px 6px 0}
.guide ul{margin:0;padding-left:18px}
.ex{font-size:12.5px;color:var(--muted);margin:-4px 0 10px;padding-left:22px}
.grid-al{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0 24px}
.qq.al{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qq.al .qt{margin:0}
.likert.al::before{content:"昏沉"}
.likert.al::after{content:"清醒"}
.quiz select{font-size:14px;padding:7px 10px;margin-left:22px}
.guide p{margin:0 0 6px}
.theory details{border-top:1px solid var(--line);padding:10px 0}
.theory details:first-child{border-top:0}
.theory summary{cursor:pointer;font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center}
.theory p{margin:8px 0;max-width:72ch}
.booklist{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.blinks{display:inline-flex;gap:10px;margin-left:8px;flex-wrap:wrap;font-size:12px}
.blinks a{color:var(--focus)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.book{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:2px;background:var(--bg)}
.book .bt{font-family:var(--f-display);font-weight:700;font-size:15px}
.book .en{font-size:11px;font-style:italic}
.book p{margin:6px 0}
.book ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.book h3{margin:10px 0 4px}
.tedit{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.tedit input[type=number]{width:70px}
.book .blinks{margin-left:0}
.exp{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.emos{display:flex;flex-wrap:wrap;gap:8px}
.emo{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:150px;padding:8px 10px;border-radius:9px;text-align:left;--tone:var(--c1);background:color-mix(in srgb,var(--tone) calc(var(--lv)*14%),var(--surface))}
.emo.ease{--tone:var(--c5)}
.emo.other{--tone:var(--c2)}
.emo.on{border-color:var(--tone)}
.emo .en{font-weight:700;font-size:14px}
.emo .ed{font-size:11px;color:var(--muted);line-height:1.35}
.emo .lv{display:flex;gap:3px;margin-top:4px}
.emo .lv i{width:14px;height:4px;border-radius:2px;background:var(--line)}
.emo .lv i.f{background:var(--tone)}
.tips{margin-top:12px;background:var(--sunk);border-radius:8px;padding:6px 12px}
.tips p{margin:6px 0}
.mclock-wrap{padding:4px 0 12px;border-bottom:1px solid var(--line)}
.mclock{font-family:var(--f-mono);font-weight:500;font-size:clamp(44px,7vw,64px);text-align:center;line-height:1;padding:6px 0 12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mclock.run{color:var(--c5)}
.emap{display:grid;gap:3px;align-items:center}
.em-n{font-size:11px;color:var(--muted)}
.em-d{font-size:9px;color:var(--muted);text-align:center;font-family:var(--f-mono)}
.em-c{aspect-ratio:1;border-radius:3px;max-width:100%;--tone:var(--c1);background:color-mix(in srgb,var(--tone) calc(var(--lv)*30%),var(--sunk))}
.em-c.ease{--tone:var(--c5)}
.projchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pchip{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:6px 12px;border-radius:9px;background:var(--sunk);border-color:transparent;font-size:12px}
.pchip .pn{font-size:13px;font-weight:500}
.pchip.on{background:var(--surface);border-color:var(--focus);box-shadow:inset 0 0 0 1px var(--focus)}
.pchip.add{justify-content:center;color:var(--muted)}
.track{display:flex;gap:4px;min-width:0}
.tseg{position:relative;min-width:0;height:46px;border-radius:7px;padding:0;background:var(--sunk);border:1px solid var(--line);overflow:hidden;text-align:left}
.tseg .tfill{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--c0) 35%,var(--surface))}

<script>
(()=>{
'use strict';
const STANDALONE=true;
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o??null));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const parseD=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parseD(k);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const weekStart=k=>{const d=parseD(k);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return ymd(d)};
const WD=['一','二','三','四','五','六','日'];
const wdName=k=>'日一二三四五六'[parseD(k).getDay()];
const fmtLong=k=>{const d=parseD(k);return `${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日（週${wdName(k)}）`};
const fmtMD=k=>{const d=parseD(k);return `${d.getMonth()+1}/${d.getDate()}`};
const fmtMin=m=>{m=Math.round(m);if(m<60)return m+' 分';const h=Math.floor(m/60),r=m%60;return r?`${h} 時 ${r} 分`:`${h} 小時`};
const mmss=s=>{s=Math.max(0,Math.ceil(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${pad(m)}:${pad(x)}`:`${pad(m)}:${pad(x)}`};
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}

/* ---------- defaults ---------- */
const DEF={
  subjects:[
    {id:'R',name:'閱讀',c:0,unit:'篇'},{id:'L',name:'聽力',c:3,unit:'段'},
    {id:'S',name:'口說',c:2,unit:'題'},{id:'W',name:'寫作',c:1,unit:'篇'},
    {id:'T',name:'論文',c:4,unit:'字'}],
  pomo:{work:25,short:5,long:15,every:4},
  counters:[{id:'vocab',name:'英文單字',goal:30,step:5},{id:'shadow',name:'跟讀句數',goal:20,step:1},{id:'quotes',name:'整理書摘',goal:3,step:1}],
  exams:[{id:'toefl',name:'托福 TOEFL',date:''}],
  timers:[
    {id:'n1',name:'閱讀',segs:[{n:'閱讀',s:1800}]},
    {id:'n2',name:'聽力',segs:[{n:'聽力',s:1740}]},
    {id:'n3',name:'寫作',segs:[{n:'寫作',s:1380}]},
    {id:'n4',name:'口說',segs:[{n:'口說',s:480}]},
    {id:'n5',name:'整場模考',segs:[{n:'閱讀',s:1800},{n:'聽力',s:1740},{n:'寫作',s:1380},{n:'口說',s:480}]}],
  tv:2,
  scale:'30'
};
const CAUSES=['觀念','單字','粗心','時間不夠','題型不熟','聽不清楚'];
const SRS=[1,3,7,14,30];
const SECS=[['r','閱讀','R'],['l','聽力','L'],['s','口說','S'],['w','寫作','W']];

/* ---------- store ---------- */
const COLLS=['meta','days','mocks','mistakes','projects','reviews','quiz','quotes','pnotes','pages'];
const S={};COLLS.forEach(c=>S[c]={});
let backend='loading',base=null,dlNS=null,canWrite=true,localWhy='',unsubs=[];
const LKEY='studydesk-v1';
const OLD_TIMERS='[{"id":"x1","name":"閱讀單節","segs":[{"n":"閱讀","s":1800}]},{"id":"x2","name":"聽力單節","segs":[{"n":"聽力","s":1800}]},{"id":"x3","name":"寫作單節","segs":[{"n":"寫作","s":1500}]},{"id":"x4","name":"口說一題","segs":[{"n":"準備","s":15},{"n":"作答","s":45}]},{"id":"x5","name":"整場模考","segs":[{"n":"閱讀","s":1800},{"n":"聽力","s":1800},{"n":"寫作","s":1500},{"n":"口說","s":600}]}]';
function cfg(){const m=S.meta.main||{};const c=Object.assign(clone(DEF),m);if(!m.tv&&JSON.stringify(m.timers||null)===OLD_TIMERS)c.timers=clone(DEF.timers);return c}
function day(k){return S.days[k]||{date:k,sessions:[],j:{},counts:{}}}
function persistLocal(){lsSet(LKEY,S)}
const wq={};
function save(c,id,data){
  S[c][id]=data;
  if(backend!=='db'){persistLocal();return}
  const k=c+'/'+id,q=wq[k]||(wq[k]={busy:false,next:null});
  q.next=data;pump(c,id,q);
}
async function pump(c,id,q){
  if(q.busy)return;q.busy=true;
  while(q.next){const d=q.next;q.next=null;
    try{await base.collection(c).doc(id).set(d)}
    catch(e){if(e&&e.code==='invalid_argument'){S[c][id]=d;switchToLocal();break}toast(e&&e.code==='quota_exceeded'?'雲端空間已滿，請先匯出並刪除舊資料':'這筆還沒存好，稍後會自動再試一次');if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*800));q.next=q.next||d}}}
  q.busy=false;
}
function remove(c,id){
  delete S[c][id];
  if(backend!=='db'){persistLocal();return}
  base.collection(c).doc(id).delete().catch(()=>toast('沒有刪除成功，請再試一次'));
}
const soonT={};
function saveSoon(c,id,data){S[c][id]=data;clearTimeout(soonT[c+id]);soonT[c+id]=setTimeout(()=>save(c,id,S[c][id]),600)}
function editDay(k,fn,soon){const d=clone(day(k));d.date=k;d.sessions=d.sessions||[];d.j=d.j||{};d.counts=d.counts||{};fn(d);(soon?saveSoon:save)('days',k,d)}
async function saveFile(name,data,type,ascii){
  if(dlNS&&!STANDALONE){try{await dlNS.save({filename:name,data});return true}catch(e){if(e&&e.code==='declined')return false}}
  if(STANDALONE){try{const u=URL.createObjectURL(new Blob([data],{type:type+';charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=ascii||name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);return true}catch{}}
  try{await navigator.clipboard.writeText(data);toast('這裡不能下載檔案，已把內容複製到剪貼簿');return true}catch{toast('這裡無法下載，請手動複製');return false}
}
function editCfg(fn){const c=clone(cfg());fn(c);save('meta','main',c)}

const NOTES={cloud:'資料存在你的私人雲端空間，只有你看得到。',viewonly:'目前沒有雲端儲存權限，紀錄先存在這個瀏覽器。',nologin:'資料只存在這個瀏覽器。登入 claude.ai 後開啟，就能同步到雲端。',standalone:'資料存在這個瀏覽器裡。記得定期到「設定」匯出備份。'};
function goLocal(why){
  backend='local';localWhy=why;
  const L=lsGet(LKEY,null);if(L)COLLS.forEach(c=>{S[c]=Object.assign({},L[c]||{},why==='viewonly'?S[c]:{})});
  if(!S.meta.main)save('meta','main',clone(DEF));else persistLocal();
  setNote(NOTES[why]);
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch{}
  render();
}
function switchToLocal(){
  if(backend==='local')return;
  unsubs.forEach(u=>{try{u()}catch{}});unsubs=[];
  goLocal('viewonly');
  toast('你沒有雲端儲存權限，接下來的紀錄會存在這個瀏覽器');
}
async function init(){
  route();
  if(STANDALONE)return goLocal('standalone');
  let db=null,user=null,uid=null;
  try{if(window.claude&&claude.use){[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);claude.use('downloads').then(d=>{dlNS=d}).catch(()=>{})}}catch{}
  try{if(user)uid=await user.id()}catch{}
  if(db&&uid){
    let w=null;try{w=await user.can('data.write')}catch{}
    if(w===false)return goLocal('viewonly');
    backend='db';base=db.doc(`data/users/${uid}/app`);
    setNote(NOTES.cloud);
    let loaded=0;const timer=setTimeout(()=>setNote('暫時連不到雲端，畫面上的資料可能不是最新。'),10000);
    COLLS.forEach(c=>{
      let first=true;
      unsubs.push(base.collection(c).onSnapshot(snap=>{
        if(backend!=='db')return;
        const nx={};snap.docs.forEach(d=>{nx[d.id]=d.data()});
        const changed=JSON.stringify(nx)!==JSON.stringify(S[c]);
        S[c]=nx;
        if(first&&!snap.metadata.fromCache){first=false;loaded++;if(loaded===COLLS.length){clearTimeout(timer);setNote(NOTES.cloud);if(!S.meta.main)save('meta','main',clone(DEF))}}
        if(changed)softRender();
      },e=>{clearTimeout(timer);setNote('暫時讀不到雲端資料，請重新整理頁面。')}));
    });
  }else goLocal('nologin');
}
function localBanner(){
  if(backend!=='local')return '';
  const last=lsGet('sd-lastexport',''),hasData=Object.keys(S.days).length+Object.keys(S.projects).length>0,stale=hasData&&(!last||diffDays(last,today())>=7);
  const msg=localWhy==='viewonly'?'你目前沒有雲端儲存權限，紀錄會先存在這個瀏覽器。想在不同裝置同步，請分享這個頁面的人把你設為「可使用」。':localWhy==='standalone'?'你的資料存在這個瀏覽器裡，換電腦或清除瀏覽資料就會不見。':'資料目前只存在這個瀏覽器。登入 claude.ai 後開啟，就能同步到雲端。';
  return `<div class="banner row sb"><span>${msg}${stale?` <b>${last?'上次備份是 '+fmtMD(last)+'，':'還沒備份過，'}建議現在備份一次。</b>`:''}</span>${stale?'<button class="sm sec" data-act="export">立即備份</button>':''}</div>`;
}
function setNote(t){const n=$('#storeNote');if(n)n.textContent=t}

/* ---------- routing / rendering ---------- */
const ROUTES=['today','calendar','stats','exam','plan','journal','quiz','prefs'];
let R='today',pendingRender=false;
function route(){const h=location.hash.slice(1);R=h.startsWith('page-')||ROUTES.includes(h)?h:'today';pgAdding=false;render()}
window.addEventListener('hashchange',route);
function editing(){const a=document.activeElement;return a&&$('#main').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)}
function softRender(){if(editing()){pendingRender=true;return}render()}
document.addEventListener('focusout',()=>{if(pendingRender)setTimeout(()=>{if(!editing()&&pendingRender){pendingRender=false;render()}},250)});
function render(){
  const m=$('#main');const sy=window.scrollY;
  m.innerHTML=localBanner()+(R.startsWith('page-')?vPage(R.slice(5)):VIEWS[R!=='today'&&R!=='prefs'&&!isOn(R)?'today':R]());
  renderNav();
  window.scrollTo(0,sy);
  tick(true);
}

/* ---------- subjects / small parts ---------- */
const subj=id=>cfg().subjects.find(s=>s.id===id)||{id,name:id||'未分類',c:7,unit:''};
const sdot=id=>`<span class="dot" style="background:var(--c${subj(id).c})"></span>`;

function phaseOptions(pid,sel){const p=S.projects[pid];if(!p)return '<option value="">—</option>';return '<option value="">（不指定）</option>'+stagesOf(p).map(ph=>`<option value="${esc(ph.id)}"${ph.id===sel?' selected':''}>${esc(ph.name)}</option>`).join('')}

/* ---------- pomodoro ---------- */
let P=lsGet('sd-pomo',null)||{mode:'work',running:false,endAt:0,left:null,startedAt:null,sub:'R',proj:'',phase:'',task:'',cycles:0,cday:today()};
if(P.cday!==today()){P.cycles=0;P.cday=today()}
const savP=()=>lsSet('sd-pomo',P);
function modeSec(m){const p=cfg().pomo;return Math.round((m==='work'?p.work:m==='short'?p.short:p.long)*60)}
function pLeft(){return P.running?Math.max(0,(P.endAt-Date.now())/1000):(P.left??modeSec(P.mode))}
function pomoHTML(){
  const c=cfg(),every=c.pomo.every,done=P.cycles%every;
  return `<div class="row sb modes"><div class="seg" role="group" aria-label="模式">
    ${[['work','專注'],['short','短休'],['long','長休']].map(([m,n])=>`<button data-act="pmode" data-m="${m}" aria-pressed="${P.mode===m}">${n}</button>`).join('')}

  <div class="clock" id="pomoTime">--:--</div>
  <div class="pbar"><i id="pomoBar"></i></div>
  <div class="cycles">${Array.from({length:every},(_,i)=>`<i class="${i<done?'on':''}"></i>`).join('')}<span>每 ${every} 個番茄長休一次</span></div>
  <div class="pform">

    <label class="f wide">這顆番茄要做什麼<input id="pTask" type="text" data-ch="pfield" data-k="task" value="${esc(P.task)}" placeholder="例：讀完第三章、做一回閱讀練習"></label>
    ${P.proj&&isOn('plan')?`<label class="f wide">階段<select id="pPhase" data-ch="pfield" data-k="phase">${phaseOptions(P.proj,P.phase)}</select></label>`:''}
  </div>
  <div class="ctrl">
    <button class="pri" data-act="ptoggle" id="pToggle">${P.running?'暫停':'開始'}</button>
    <button data-act="preset">重設</button>
    ${P.mode==='work'?'<button data-act="pfinish">提前結束並記錄</button>':'<button data-act="pskip">跳過休息</button>'}
  </div>
  <p class="muted" style="text-align:center;margin:12px 0 0">空白鍵：開始／暫停</p>`;
}
function pStart(){unlockAudio();if(P.mode==='work'&&!P.startedAt)P.startedAt=new Date().toISOString();P.endAt=Date.now()+pLeft()*1000;P.running=true;savP()}
function pPause(){P.left=pLeft();P.running=false;savP()}
function pReset(){P.running=false;P.left=null;P.startedAt=null;savP()}
function pSetMode(m){pReset();P.mode=m;savP()}
function pComplete(early){
  const planned=modeSec('work');
  const wasWork=P.mode==='work';
  const elapsed=wasWork?Math.round((planned-pLeft())/60):0;
  const started=P.startedAt||new Date(Date.now()-planned*1000).toISOString();
  P.running=false;
  if(wasWork){
    P.cycles++;P.cday=today();
    const next=P.cycles%cfg().pomo.every===0?'long':'short';
    P.mode=next;P.left=null;P.startedAt=null;savP();
    if(!early)beep(3);
    openRecord({min:early?Math.max(1,elapsed):Math.round(planned/60),t:started,sub:P.sub,proj:P.proj,phase:P.phase,task:P.task});
  }else{
    P.mode='work';P.left=null;P.startedAt=null;savP();if(!early)beep(2);toast('休息結束，準備下一個番茄');
  }
  render();
}

/* ---------- exam countdown timer (not logged) ---------- */
let T=lsGet('sd-xtimer',null)||{pid:'n1',seg:0,running:false,endAt:0,left:null};
const savT=()=>lsSet('sd-xtimer',T);
function tPreset(){return cfg().timers.find(t=>t.id===T.pid)||cfg().timers[0]||{id:'',name:'',segs:[{n:'計時',s:600}]}}
function tSegSec(){const p=tPreset();return (p.segs[T.seg]||p.segs[0]||{s:0}).s}
function tLeft(){return T.running?Math.max(0,(T.endAt-Date.now())/1000):(T.left??tSegSec())}
function tAdvance(){
  const p=tPreset();
  if(T.seg<p.segs.length-1){T.seg++;T.left=null;T.endAt=Date.now()+tSegSec()*1000;beep(2);toast('下一段：'+p.segs[T.seg].n)}
  else{T.running=false;T.left=0;beep(4);toast('測驗時間到')}
  savT();if(R==='exam')render();
}

/* ---------- ticking ---------- */
let lastTitle='';
function tick(force){
  if(P.running&&Date.now()>=P.endAt){pComplete(false);return}
  if(T.running&&Date.now()>=T.endAt){tAdvance();return}
  if(MT.running&&Date.now()>=MT.endAt){mComplete();return}
  const me=$('#mTime');if(me){me.textContent=mmss(mLeft());me.classList.toggle('run',MT.running)}
  const pl=pLeft(),tot=modeSec(P.mode);
  const el=$('#pomoTime');
  if(el){el.textContent=mmss(pl);el.classList.toggle('run',P.running&&P.mode==='work');const b=$('#pomoBar');if(b)b.style.width=(100*(1-pl/tot))+'%'}
  const mini=$('#miniClock');
  if(mini){const on=P.running||T.running||MT.running;mini.classList.toggle('on',on&&R!=='today');mini.textContent=P.running?`${P.mode==='work'?'專注':'休息'} ${mmss(pl)}`:T.running?`測驗 ${mmss(tLeft())}`:MT.running?`靜心 ${mmss(mLeft())}`:''}
  const xe=$('#xTime');
  if(xe){const l=tLeft();xe.textContent=mmss(l);xe.classList.toggle('run',T.running);xe.classList.toggle('low',T.running&&l<=60)}
}
setInterval(()=>tick(false),250);

/* ---------- audio ---------- */
let AC=null;
function unlockAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch{}}
function beep(n){if(!AC)return;try{for(let i=0;i<n;i++){const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=i%2?660:880;o.connect(g);g.connect(AC.destination);const t=AC.currentTime+i*.32;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.start(t);o.stop(t+.27)}}catch{}}

/* ---------- calendar view ---------- */

function dayMarks(k){

  cfg().exams.forEach(e=>{if(e.date===k)t.push({c:'ex',n:e.name})});

  return t;
}

function dayDetail(k){

/* ---------- charts ---------- */
function niceMax(v){if(v<=0)return 4;const raw=v/4,p=Math.pow(10,Math.floor(Math.log10(raw)));const n=raw/p;const s=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;return s*p*4}
function fmtN(v){return Math.round(v*10)/10}
function stackBars(rows,{h=200,unit='分',every=1,marker=null}={}){
  const W=Math.max(rows.length*30,320),pl=38,pb=22,pt=10,ih=h-pb-pt;
  const max=niceMax(Math.max(1,...rows.map(r=>r.parts.reduce((a,p)=>a+p.v,0))));
  const bw=(W-pl)/rows.length;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="長條圖">`;
  for(let i=0;i<=4;i++){const v=max*i/4,y=pt+ih-ih*i/4;s+=`<line class="grid" x1="${pl}" x2="${W}" y1="${y}" y2="${y}"/><text class="ax" x="${pl-6}" y="${y+3.5}" text-anchor="end">${fmtN(v)}</text>`}
  rows.forEach((r,i)=>{let y=pt+ih;const x=pl+i*bw+bw*.18,w=bw*.64;
    if(marker&&r.key===marker)s+=`<rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${ih}" fill="var(--sunk)"/>`;
    r.parts.forEach(p=>{if(!p.v)return;const hh=ih*p.v/max;y-=hh;s+=`<rect x="${x}" y="${y}" width="${w}" height="${hh}" fill="var(--c${p.c})"><title>${esc(r.label)} ${esc(p.n||'')}：${fmtN(p.v)} ${unit}</title></rect>`});
    if(i%every===0)s+=`<text class="ax" x="${pl+i*bw+bw/2}" y="${h-6}" text-anchor="middle">${esc(r.label)}</text>`});
  return `<div class="chartwrap">${s}</svg></div>`;
}
function lineChart(series,{h=220,ymax=30,labels=[]}={}){
  const W=640,pl=34,pr=12,pb=24,pt=10,ih=h-pb-pt,iw=W-pl-pr,n=labels.length;
  const X=i=>pl+(n<=1?iw/2:iw*i/(n-1)),Y=v=>pt+ih-ih*v/ymax;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="分數趨勢">`;
  for(let i=0;i<=4;i++){const v=ymax*i/4;s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${pl-6}" y="${Y(v)+3.5}" text-anchor="end">${fmtN(v)}</text>`}
  const ev=Math.max(1,Math.ceil(n/8));labels.forEach((l,i)=>{if(i%ev===0||i===n-1)s+=`<text class="ax" x="${X(i)}" y="${h-6}" text-anchor="middle">${esc(l)}</text>`});
  series.forEach(se=>{const pts=se.vals.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);if(!pts.length)return;
    s+=`<polyline fill="none" stroke="var(--c${se.c})" stroke-width="2" points="${pts.map(p=>p.join(',')).join(' ')}"/>`;
    pts.forEach((p,i)=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4:2.5}" fill="var(--c${se.c})"/>`})});
  return `<div class="chartwrap">${s}</svg></div>`;
}
function hbars(items,unitFn){
  const max=Math.max(1,...items.map(i=>i.v));
  return `<div class="list hbars">${items.map(i=>`<div class="li"><span class="nm">${esc(i.n)}</span><div class="bar"><i style="width:${100*i.v/max}%;background:var(--c${i.c})"></i></div><span class="val num">${unitFn(i)}</span></div>`).join('')}</div>`;
}

function aggregate(keys){

function moodInsight(keys){

      </section>`:''}

      </section>
    </div>
    <aside class="stack side">
      <section class="card"><h2>本週成果</h2>
        <div class="wallnums"><div><b class="num">${wkSteps}</b><span>完成步驟</span></div><div><b class="num">${wkWins}</b><span>小成果</span></div><div><b class="num">${wkQuotes}</b><span>書摘</span></div><div><b class="num">${fmtN(wkMin/60)}</b><span>小時</span></div></div>
        <h3>近五週</h3><div class="wall">${days30.map(k=>{const n=dayActivity(curProj,k);return `<i style="--lv:${Math.min(3,n)}" title="${fmtMD(k)}：${n} 項"></i>`}).join('')}</div>
        <p class="muted" style="margin:6px 0 0">有任何進展的日子就會亮起來，再小的一步都算。</p>
        ${(p.wins||[]).length?`<h3>最近的小成果</h3><div class="list">${(p.wins||[]).slice(-5).reverse().map(w=>`<div class="li"><span class="num muted">${fmtMD(w.d)}</span><span class="pill mut">${winLabel(w.k)}</span><span class="grow">${esc(w.t||'')}</span></div>`).join('')}</div>`:''}
      </section>
      <section class="card"><h2>下次會談</h2>${p.next&&p.next.date?`<div class="bigstep">${fmtMD(p.next.date)}（週${wdName(p.next.date)}）${esc(p.next.time||'')}</div><div class="muted">與${esc(p.next.who||'指導教授')}・${esc(p.next.mode||'面談')}${p.next.eventLink?'・已加入日曆':''}</div>`:'<p class="empty">還沒有排定。</p>'}
        <p class="muted" style="margin:8px 0 0">會前清單 ${openTodos(p).length} 項未完成</p>
        <button class="sm" style="margin-top:8px" data-act="planTab" data-t="meet">${p.next&&p.next.date?'查看會談':'安排會談'}</button></section>
      <section class="card"><h2>專案設定</h2>
        <label class="f">名稱<input id="pjN" type="text" data-ch="pjF" data-f="name" value="${esc(p.name)}"></label>
        <label class="f" style="margin-top:8px">預計完成日<input id="pjD" type="date" data-ch="pjF" data-f="deadline" value="${esc(p.deadline)}"></label>
        <label class="f" style="margin-top:8px">類型<select id="pjT" data-ch="pjF" data-f="type">${Object.entries(PTYPES).map(([k,v])=>`<option value="${k}"${p.type===k?' selected':''}>${v}</option>`).join('')}</select></label>
        <button class="ghost sm" style="margin-top:10px" data-act="projDel" data-id="${curProj}">刪除這個專案</button></section>
    </aside>
  </div>
  <section class="card" style="margin-top:16px" id="planTabs">
    <div class="seg" style="margin-bottom:14px">${[['notes','研究手記'],['quotes','書摘'],['meet','會談']].map(([k,n])=>`<button data-act="planTab" data-t="${k}" aria-pressed="${planTab===k}">${n}</button>`).join('')}</div>
    ${planTab==='notes'?notesHTML(p):planTab==='quotes'?quotesHTML(p):meetHTML(p)}
  </section>`;
}
function notesHTML(p){
  const all=Object.entries(S.pnotes).filter(([,n])=>n.proj===curProj).sort((a,b)=>(a[1].at||a[1].d)<(b[1].at||b[1].d)?1:-1);
  const list=all.filter(([,n])=>!noteFilter||n.kind===noteFilter);
  return `<p class="muted" style="margin-top:-6px">隨手記下工作事項、靈感和卡住的問題。待辦可以打勾，也可以轉成目前階段的步驟。</p>
  <div class="row" style="margin-bottom:8px"><div class="seg" id="nkSeg">${NOTE_KINDS.map(k=>`<button data-act="nKind" data-k="${k}" aria-pressed="${(window.__nk||'待辦')===k}">${k}</button>`).join('')}</div></div>
  <div class="row"><textarea id="noteTxt" rows="2" placeholder="例：問老師第三章要不要拆成兩節；圖書館週五還書" style="flex:1"></textarea><button class="sec" data-act="noteAdd">加入</button></div>
  <div class="row" style="margin:14px 0 6px"><span class="muted">篩選：</span>${['',...NOTE_KINDS].map(k=>`<button class="sm" data-act="nFilter" data-k="${k}" aria-pressed="${noteFilter===k}">${k||'全部'} ${k?all.filter(([,n])=>n.kind===k).length:all.length}</button>`).join('')}</div>
  <div class="list">${list.map(([id,n])=>`<div class="li note${n.done?' done':''}">${n.kind==='待辦'?`<input type="checkbox" data-ch="noteChk" data-id="${id}" ${n.done?'checked':''} aria-label="完成">`:''}<span class="pill ${n.kind==='問題'?'warn':n.kind==='想法'?'good':'mut'}">${n.kind}</span><div class="grow qa">${esc(n.text)}</div><span class="num muted">${fmtMD(n.d)}</span>${n.kind==='待辦'&&!n.done?`<button class="ghost sm" data-act="noteToStep" data-id="${id}">轉成步驟</button>`:''}<button class="ghost sm" data-act="noteDel" data-id="${id}" aria-label="刪除">×</button></div>`).join('')||'<p class="empty">這裡還是空的。</p>'}</div>`;
}
function quotesHTML(p){
  const q=quoteQ.trim().toLowerCase();
  const all=Object.entries(S.quotes).filter(([,x])=>x.proj===curProj).sort((a,b)=>(a[1].at||a[1].d)<(b[1].at||b[1].d)?1:-1);
  const list=all.filter(([,x])=>!q||[x.src,x.au,x.text,x.thought,x.tag].join(' ').toLowerCase().includes(q));
  return `<p class="muted" style="margin-top:-6px">讀到重要的段落就記下來，連同頁碼。之後寫作和核對引文時直接搜尋。</p>
  <div class="fields" style="grid-template-columns:2fr 1fr 90px 1fr">
    <label class="f">出處（書名或篇名）<input id="qSrc" type="text" placeholder="例：《萬曆十五年》"></label>
    <label class="f">作者<input id="qAu" type="text"></label>
    <label class="f">頁碼<input id="qPg" type="text" placeholder="頁 45"></label>
    <label class="f">標籤<input id="qTag" type="text" placeholder="例：第二章、方法"></label>
  </div>
  <label class="f" style="margin-top:8px">摘錄<textarea id="qText" rows="3" placeholder="原文"></textarea></label>
  <label class="f" style="margin-top:8px">我的想法<textarea id="qTh" rows="2" placeholder="為什麼重要？可以用在哪裡？"></textarea></label>
  <div class="row sb" style="margin:10px 0 16px"><button class="sec" data-act="quoteAdd">加入書摘</button><input id="qSearch" type="search" data-in="qSearch" value="${esc(quoteQ)}" placeholder="搜尋出處、作者、內容、標籤" style="width:260px"></div>
  <div class="quotes">${list.map(([id,x])=>`<article class="quote"><blockquote>${esc(x.text)}</blockquote>${x.thought?`<p class="qa"><b>想法：</b>${esc(x.thought)}</p>`:''}<div class="row sb"><span class="muted">${esc(x.au)}${x.au&&x.src?'，':''}${esc(x.src)}${x.pg?'，'+esc(x.pg):''}${x.tag?` <span class="pill mut">${esc(x.tag)}</span>`:''}</span><span class="row"><button class="ghost sm" data-act="quoteCopy" data-id="${id}">複製</button><button class="ghost sm" data-act="quoteDel" data-id="${id}" aria-label="刪除">×</button></span></div></article>`).join('')||`<p class="empty">${all.length?'找不到符合的書摘。':'還沒有書摘。整理一則書摘也是一個小成果。'}</p>`}</div>`;
}
function meetHTML(p){

    <div>

      <div class="fields" style="grid-template-columns:1fr 1fr 1fr">

        <label class="f">形式<select id="mtM">${['面談','線上會議','電話','Email'].map(x=>`<option>${x}</option>`).join('')}</select></label>

    <div><button class="ghost sm" data-act="mtDel" data-id="${m.id}">刪除這次紀錄</button></div></div></details>`).join('')||'<p class="empty">每次見面後花五分鐘填寫，下次見面前就不會忘記老師說過什麼。</p>'}</div>`;

function baseDrv(){const s={};DK.forEach(k=>{const v=[0,1,2].map(i=>+QZ.a['d'+k+i]||0);s[k]=v.reduce((a,b)=>a+b,0)/3});return s}
function buildPairs(){
  const s=baseDrv(),srt=DK.slice().sort((a,b)=>s[b]-s[a]);
  let c=srt.filter(k=>s[k]>=s[srt[0]]-0.67).slice(0,4);
  if(c.length<2&&s[srt[1]]-s[srt[2]]<0.34)c=[srt[1],srt[2]];
  if(c.length<2)return [];
  const out=[];for(let i=0;i<c.length;i++)for(let j=i+1;j<c.length;j++)out.push([c[i],c[j]]);return out;
}

const blOfHour=h=>h>=6&&h<9?'b1':h>=9&&h<12?'b2':h>=12&&h<14?'b3':h>=14&&h<17?'b4':h>=17&&h<20?'b5':h>=20&&h<23?'b6':(h>=23||h<2)?'b7':null;
function energyData(){
  const from=addDays(today(),-30),acc={},study={};let n=0;const ds=new Set();
  Object.entries(S.days).forEach(([k,d])=>{if(k<from)return;
    (d.en||[]).forEach(x=>{const b=blOfHour(+String(x.t).slice(0,2));if(!b)return;(acc[b]=acc[b]||[]).push(+x.e);n++;ds.add(k)});
    (d.sessions||[]).forEach(s=>{const b=blOfHour(new Date(s.t).getHours());if(b)study[b]=(study[b]||0)+(+s.min||0)})});
  const avg={};Object.entries(acc).forEach(([b,v])=>{if(v.length>=2)avg[b]=v.reduce((a,c)=>a+c,0)/v.length});
  const st=Object.entries(study).sort((a,b)=>b[1]-a[1])[0];
  return {ok:n>=8&&ds.size>=3,n,days:ds.size,avg,studyTop:st?st[0]:null};
}
function sleepCalc(E){
  const night=(s,w)=>{if(s==null||w==null)return null;const on=+s,off=+w+1440,dur=off-on;return {on,off,dur,mid:(on+dur/2)%1440}};
  const free=E.reg==='n'?night(E.iSleep,E.iWake):night(E.fSleep,E.fWake);
  const work=E.reg==='n'?null:night(E.wSleep,E.wWake);
  const msf=free?free.mid/60:4.5;
  const type=msf<3?'e2':msf<4?'e1':msf<5?'m':msf<6?'l1':'l2';
  const sj=work?Math.abs(free.mid-work.mid)/60:0;
  return {free,work,msf,type,sj};
}
const TYPE5={
  e2:{n:'明顯晨型',d:'你的生理時鐘明顯偏早。清晨到上午是黃金時間，晚上精神下滑得早。'},
  e1:{n:'偏晨型',d:'你的生理時鐘略偏早，上午通常比晚上有效率。'},
  m:{n:'中間型',d:'你的生理時鐘落在中間，和多數人相近。精神曲線比較平均，作息穩定時表現最好。'},
  l1:{n:'偏夜型',d:'你的生理時鐘略偏晚。早上需要比較長的暖機，下午到晚上狀態比較好。'},
  l2:{n:'明顯夜型',d:'你的生理時鐘明顯偏晚，早起對你特別辛苦，晚上才最清醒。不必硬逼自己早上做最難的事。'}};
function energyModel(E){
  const sl=sleepCalc(E),ed=energyData();
  const win=sl.work||sl.free;
  const asleep=b=>{if(!win)return false;let mid=(b.h+b.len/2)*60;if(mid<win.on)mid+=1440;return mid>win.on+30&&mid<win.off-30};
  const sc={};BL.forEach(b=>{let v=+E['al_'+b.k]||1;if(E.focusBest===b.k)v+=1.5;if(E.worst===b.k)v-=1.5;if(ed.ok&&ed.avg[b.k]!=null)v+=(ed.avg[b.k]-3)*0.8;sc[b.k]=Math.max(0,Math.min(6.5,v))});
  const awake=BL.filter(b=>!asleep(b));
  const pool=awake.length?awake:BL;
  const peak=pool.reduce((a,b)=>sc[b.k]>sc[a.k]?b:a).k;
  const low=pool.filter(b=>b.k!==peak).reduce((a,b)=>sc[b.k]<sc[a.k]?b:a,pool.find(b=>b.k!==peak)||pool[0]).k;
  const idea=E.ideaBest&&E.ideaBest!==peak&&pool.some(b=>b.k===E.ideaBest)?E.ideaBest:null;
  const roles=BL.map(b=>{let r;
    if(asleep(b))r=['睡眠','mut','睡覺，或放鬆準備入睡'];
    else if(b.k===peak)r=['高峰','bad','深度工作：最需要思考、分析、寫作的事'];
    else if(b.k===idea)r=['靈感','good','發想與規劃：腦力激盪、構思、整理想法'];
    else if(b.k===low)r=['低潮','mut','例行事務：回訊息、整理資料、行政、輕量複習'];
    else if(E.dip===2&&(b.k==='b3'||b.k==='b4'))r=['低潮','mut','午後低潮：例行事務、走動，或小睡 15 分鐘'];
    else if(sc[b.k]>=3.5)r=['次高','warn','練習與學習：做練習題、閱讀、學新東西'];
    else if(sc[b.k]<=2.3)r=['低潮','mut','例行事務，或安排休息、運動'];
    else r=['一般','good','中等難度的事：溝通、開會、修改'];
    return {b,r}});
  return {sl,ed,sc,peak,low,idea,roles};
}

function findStr(o,re,d=0){if(d>6||o==null)return null;if(typeof o==='string')return re.test(o)?o:null;if(typeof o==='object'){for(const v of Object.values(o)){const r=findStr(v,re,d+1);if(r)return r}}return null}

async function addToGCal(){
  const n=readNext();if(!n.date)return toast('先選日期');
  editProj(p=>{p.next=Object.assign({},p.next&&p.next.date===n.date&&p.next.time===n.time?p.next:{},n)});render();
  const p=proj(curProj),msg=()=>$('#gcalMsg');
  let mcp=null;try{mcp=window.claude&&claude.use?await claude.use('mcp'):null}catch{}
  const fallback=why=>{const m=msg();if(m)m.innerHTML=`${esc(why)}可以<a href="${esc(gcalUrl(p))}" target="_blank" rel="noopener">在 Google 日曆網頁新增這個活動</a>，提醒和 Meet 連結請在網頁上設定。`};
  if(!mcp)return fallback('這裡無法直接連到 Google 日曆。');
  const st=new Date(`${n.date}T${n.time}`),en=new Date(st.getTime()+n.dur*60000);
  const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:00`;
  const input={summary:`${p.name}｜與${n.who}會談`,startTime:iso(st),endTime:iso(en),description:meetPrepText(p)||'（論文地圖建立）'};
  if(n.meetOn)input.addGoogleMeetUrl=true;
  if($('#nxRem').checked)input.overrideReminders=[{method:'popup',minutes:1440},{method:'popup',minutes:60}];
  if(n.email)input.attendees=[{email:n.email}];
  const m=msg();if(m)m.textContent='正在加入 Google 日曆…';
  try{
    const res=await mcp.callTool('Google Calendar','create_event',input);
    const pl=res&&(res.payload!==undefined?res.payload:res);
    const link=findStr(pl,/^https:\/\/(www\.)?google\.com\/calendar|^https:\/\/calendar\.google\.com/),meet=findStr(pl,/^https:\/\/meet\.google\.com\//);
    editProj(q=>{q.next=Object.assign({},q.next,{eventLink:link||'https://calendar.google.com/calendar/r/day/'+n.date.replace(/-/g,'/'),meet:meet||''})});
    toast('已加入 Google 日曆');render();
  }catch(e){
    const c=e&&e.code;
    fallback(c==='server_not_connected'?'你還沒連接 Google 日曆（claude.ai 設定 → 連接器）。':c==='not_in_manifest'||c==='approval_required'?'這次沒有允許使用 Google 日曆。':c==='needs_reauth'?'Google 日曆需要重新連接（claude.ai 設定 → 連接器）。':'加入日曆時發生問題。');
  }
}

function navItems(){return NAV.filter(([r])=>r==='today'||isOn(r)).concat(Object.entries(S.pages||{}).sort((a,b)=>(a[1].at||'')<(b[1].at||'')?-1:1).map(([id,p])=>['page-'+id,p.name||'未命名頁面',true])).concat([['prefs','設定']])}
function renderNav(){
  const el=$('#navLinks');if(!el)return;
  const items=navItems();let k=0;
  el.innerHTML=items.map(([r,n,pg],i)=>{k++;const sep=pg&&!(items[i-1]||[])[2]?'<div class="navsep">我的頁面</div>':'';return sep+`<a href="#${r}" data-r="${r}" aria-current="${R===r?'page':'false'}">${esc(n)}${k<=9?`<span class="k">${k}</span>`:''}</a>`}).join('')+`<button class="ghost sm navadd" data-act="pgNewOpen">＋ 新增頁面</button>`;
}

/* ---------- custom pages ---------- */
const BLOCKS={
  note:{n:'筆記',d:'自由書寫的文字欄',mk:()=>({text:''})},
  check:{n:'清單',d:'可以打勾的待辦或步驟',mk:()=>({items:[]})},
  counter:{n:'計數器',d:'按一下加一，可設目標',mk:()=>({value:0,goal:10,step:1,unit:''})},
  progress:{n:'進度條',d:'目前／目標，看見完成比例',mk:()=>({cur:0,target:100,unit:''})},
  countdown:{n:'倒數日',d:'距離某個日子還有幾天',mk:()=>({date:addDays(today(),30)})},
  habit:{n:'每日打卡',d:'每天做到就點亮一格',mk:()=>({days:{}})},
  log:{n:'紀錄表',d:'自訂欄位，一列一筆紀錄',mk:()=>({cols:['日期','內容'],rows:[]})}
};
const PAGE_TPL={
  blank:{n:'空白頁面',d:'從零開始，自己加入需要的區塊',blocks:[]},
  habit:{n:'習慣養成',d:'每日打卡、計數器和心得筆記',blocks:[['habit','每天運動'],['counter','本週次數'],['note','心得']]},
  study:{n:'學習計畫',d:'進度條、清單和倒數日',blocks:[['countdown','目標日'],['progress','完成章節'],['check','這週要做']]},
  track:{n:'專案追蹤',d:'清單、紀錄表和筆記',blocks:[['check','待辦'],['log','進度紀錄'],['note','備忘']]},
  reading:{n:'閱讀清單',d:'紀錄書名、作者、狀態與心得',blocks:[['log','書單'],['counter','今年讀完'],['note','想讀的書']]}
};
let pgAdding=false;
function mkBlock(type,title){return Object.assign({id:rid(),type,title:title||BLOCKS[type].n},BLOCKS[type].mk(),type==='log'&&title==='書單'?{cols:['書名','作者','狀態','心得']}:{})}
function newPage(tpl){
  const t=PAGE_TPL[tpl]||PAGE_TPL.blank,id=rid();
  const name=(($('#pgName')||{}).value||'').trim()||(tpl==='blank'?'我的頁面':t.n);
  save('pages',id,{name,at:new Date().toISOString(),blocks:t.blocks.map(([ty,ti])=>mkBlock(ty,ti))});
  closeModal();location.hash='page-'+id;
}
function openNewPage(){
  $('#modal').innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="npT"><div class="box">
    <h2 id="npT">新增一個頁面</h2><p class="muted">用幾種基本區塊組合出你自己的計畫。建立後隨時可以新增、刪除或調整順序。</p>
    <label class="f">頁面名稱<input id="pgName" type="text" placeholder="例：減重計畫、日文 N2、教學備課"></label>
    <div class="tplgrid">${Object.entries(PAGE_TPL).map(([k,t])=>`<button class="tpl" data-act="pgNew" data-t="${k}"><b>${t.n}</b><span>${t.d}</span></button>`).join('')}</div>
    <div class="row sb"><span></span><button data-act="recCancel">取消</button></div></div></div>`;
  setTimeout(()=>{const i=$('#pgName');i&&i.focus()},30);
}
function editPage(id,fn,soon){const p=clone(S.pages[id]);fn(p);(soon?saveSoon:save)('pages',id,p)}
function blockBody(pid,b){
  const A_=`data-p="${pid}" data-b="${b.id}"`;
  if(b.type==='note')return `<textarea id="bn${b.id}" data-in="blkF" ${A_} data-f="text" rows="4" placeholder="寫點什麼…">${esc(b.text)}</textarea>`;
  if(b.type==='check'){const d=b.items.filter(x=>x.done).length;return `${b.items.length?`<div class="bar" style="margin-bottom:8px"><i style="width:${d/b.items.length*100}%"></i></div>`:''}<div class="list">${b.items.map(x=>`<div class="li"><input type="checkbox" data-ch="blkChk" ${A_} data-id="${x.id}" ${x.done?'checked':''} aria-label="完成"><span class="grow" style="${x.done?'text-decoration:line-through;color:var(--muted)':''}">${esc(x.t)}</span><button class="ghost sm" data-act="blkItemDel" ${A_} data-id="${x.id}" aria-label="刪除">×</button></div>`).join('')}</div><div class="row" style="margin-top:6px"><input id="bi${b.id}" type="text" placeholder="新增一項" style="flex:1"><button class="sm" data-act="blkItemAdd" ${A_}>加入</button></div>`}
  if(b.type==='counter'){const pct=b.goal?Math.min(100,b.value/b.goal*100):0;return `<div class="row sb"><span class="bignum num">${b.value}<small> ${esc(b.unit)}${b.goal?' / '+b.goal:''}</small></span><div class="row"><button data-act="blkCnt" ${A_} data-d="-1" aria-label="減少">−</button><button class="sec" data-act="blkCnt" ${A_} data-d="1">＋${b.step}</button></div></div>${b.goal?`<div class="bar" style="margin-top:8px"><i style="width:${pct}%"></i></div>`:''}<div class="row cfgrow"><label class="f">目標<input type="number" min="0" data-ch="blkNum" ${A_} data-f="goal" value="${b.goal}"></label><label class="f">每次<input type="number" min="1" data-ch="blkNum" ${A_} data-f="step" value="${b.step}"></label><label class="f">單位<input type="text" data-ch="blkTxt" ${A_} data-f="unit" value="${esc(b.unit)}" style="width:70px"></label><button class="ghost sm" data-act="blkReset" ${A_}>歸零</button></div>`}
  if(b.type==='progress'){const pct=b.target?Math.min(100,b.cur/b.target*100):0;return `<div class="row sb"><span class="bignum num">${Math.round(pct)}<small>%</small></span><span class="muted num">${b.cur} / ${b.target} ${esc(b.unit)}</span></div><div class="bar big"><i style="width:${pct}%"></i></div><div class="row cfgrow"><label class="f">目前<input type="number" min="0" data-ch="blkNum" ${A_} data-f="cur" value="${b.cur}"></label><label class="f">目標<input type="number" min="1" data-ch="blkNum" ${A_} data-f="target" value="${b.target}"></label><label class="f">單位<input type="text" data-ch="blkTxt" ${A_} data-f="unit" value="${esc(b.unit)}" style="width:70px" placeholder="頁、章"></label></div>`}
  if(b.type==='countdown'){const n=b.date?diffDays(today(),b.date):null;return `<div class="bignum num">${n==null?'—':n<0?'已過 '+(-n):n}<small> 天</small></div><label class="f" style="margin-top:8px">日期<input type="date" data-ch="blkTxt" ${A_} data-f="date" value="${esc(b.date)}"></label>`}
  if(b.type==='habit'){const ds=Array.from({length:35},(_,i)=>addDays(today(),i-34)),done=ds.filter(k=>b.days[k]).length;let streak=0,k=today();if(!b.days[k])k=addDays(k,-1);while(b.days[k]){streak++;k=addDays(k,-1)}
    return `<div class="row sb"><button class="${b.days[today()]?'sec':'pri'}" data-act="blkHabit" ${A_} data-k="${today()}">${b.days[today()]?'今天完成了 ✓':'今天做到了'}</button><span class="muted">連續 ${streak} 天・近五週 ${done} 天</span></div><div class="wall" style="margin-top:10px">${ds.map(k=>`<button class="hcell${b.days[k]?' on':''}" data-act="blkHabit" ${A_} data-k="${k}" title="${fmtMD(k)}" aria-label="${fmtMD(k)}${b.days[k]?' 已完成':''}"></button>`).join('')}</div>`}
  if(b.type==='log')return `<div class="tablewrap"><table class="logt"><thead><tr>${b.cols.map((c,i)=>`<th><input type="text" data-ch="blkCol" ${A_} data-i="${i}" value="${esc(c)}" aria-label="欄位名稱"></th>`).join('')}<th><button class="ghost sm" data-act="blkColAdd" ${A_}>＋ 欄位</button></th></tr></thead>
    <tbody>${b.rows.map(r=>`<tr>${b.cols.map((_,i)=>`<td>${esc(r.c[i]||'')}</td>`).join('')}<td><button class="ghost sm" data-act="blkRowDel" ${A_} data-id="${r.id}" aria-label="刪除">×</button></td></tr>`).join('')}
    <tr class="addrow">${b.cols.map((c,i)=>`<td><input type="text" id="br${b.id}_${i}" placeholder="${esc(c)}"${i===0&&/日期/.test(c)?` value="${today()}"`:''}></td>`).join('')}<td><button class="sm sec" data-act="blkRowAdd" ${A_}>加入</button></td></tr></tbody></table></div>
    ${b.cols.length>1?`<div class="row" style="margin-top:6px"><span class="muted">刪除欄位：</span>${b.cols.map((c,i)=>`<button class="ghost sm" data-act="blkColDel" ${A_} data-i="${i}">${esc(c)} ×</button>`).join('')}</div>`:''}`;
  return '';
}
function vPage(id){
  const p=S.pages[id];
  if(!p)return `<header class="ph"><div><p class="eyebrow">我的頁面</p><h1>找不到這個頁面</h1></div></header><p class="empty">可能已經刪除，或資料還在載入。</p>`;
  return `<header class="ph"><div style="flex:1;min-width:0"><p class="eyebrow">我的頁面</p><input class="pgtitle" id="pgt${id}" type="text" data-ch="pgName" data-p="${id}" value="${esc(p.name)}" aria-label="頁面名稱"></div>
    <div class="row"><button class="${pgAdding?'':'sec'}" data-act="pgAddToggle">${pgAdding?'完成':'＋ 新增區塊'}</button><button class="ghost sm" data-act="pgDel" data-p="${id}">刪除頁面</button></div></header>
  ${pgAdding?`<section class="card" style="margin-bottom:16px"><h2>選一種區塊加入</h2><div class="tplgrid">${Object.entries(BLOCKS).map(([k,b])=>`<button class="tpl" data-act="blkAdd" data-p="${id}" data-t="${k}"><b>${b.n}</b><span>${b.d}</span></button>`).join('')}</div></section>`:''}
  ${p.blocks.length?`<div class="blocks">${p.blocks.map((b,i)=>`<section class="card blk ${b.type==='log'||b.type==='note'?'wide':''}">
    <div class="row sb blkhead"><input class="blktitle" type="text" data-ch="blkTxt" data-p="${id}" data-b="${b.id}" data-f="title" value="${esc(b.title)}" aria-label="區塊名稱"><span class="row blktools"><span class="pill mut">${BLOCKS[b.type].n}</span><button class="ghost sm" data-act="blkMv" data-p="${id}" data-b="${b.id}" data-d="-1" aria-label="往前"${i===0?' disabled':''}>↑</button><button class="ghost sm" data-act="blkMv" data-p="${id}" data-b="${b.id}" data-d="1" aria-label="往後"${i===p.blocks.length-1?' disabled':''}>↓</button><button class="ghost sm" data-act="blkDel" data-p="${id}" data-b="${b.id}" aria-label="刪除區塊">×</button></span></div>
    ${blockBody(id,b)}</section>`).join('')}</div>`:`<section class="card empty-page"><h2>這是一個空白頁面</h2><p class="muted">按「＋ 新增區塊」，從筆記、清單、計數器、進度條、倒數日、每日打卡、紀錄表中挑選，組合成你需要的樣子。</p><button class="sec" data-act="pgAddToggle">＋ 新增區塊</button></section>`}`;
}
const blk=(p,b)=>p.blocks.find(x=>x.id===b);

/* ---------- Google Calendar import ---------- */
const GC={key:'',events:{},state:'idle',msg:''};
function gcOn(){return !STANDALONE&&!!cfg().gcalOn}
async function gcLoad(force){
  const days=monthDays(calM),key=calM;
  if(!force&&GC.key===key&&GC.state==='ok')return;
  GC.key=key;GC.state='loading';GC.msg='';
  let mcp=null;try{mcp=window.claude&&claude.use?await claude.use('mcp'):null}catch{}
  if(!mcp){GC.state='err';GC.msg='這裡無法連到 Google 日曆。請在 claude.ai 開啟這個頁面。';if(R==='calendar')render();return}
  const ev={};let token=null,guard=0;
  try{
    do{const input={startTime:days[0]+'T00:00:00',endTime:addDays(days[41],1)+'T00:00:00',orderBy:'startTime',pageSize:250};if(token)input.pageToken=token;
      const res=await mcp.callTool('Google Calendar','list_events',input,{cache:force?{refresh:true,staleTime:300000,gcTime:3600000}:{staleTime:300000,gcTime:3600000}});
      const pl=res&&res.payload||{};
      (pl.events||[]).forEach(e=>{if(e.status==='cancelled')return;if(cfg().gcalSkipFree!==false&&(e.transparency==='transparent'||e.availability==='AVAILABILITY_FREE'))return;
        const s=e.start||{},en=e.end||{};const allDay=!!s.date;const d0=allDay?s.date:ymd(new Date(s.dateTime));let d1=allDay?addDays(en.date||s.date,-1):ymd(new Date(en.dateTime||s.dateTime));if(d1<d0)d1=d0;
        const t=allDay?'':(()=>{const x=new Date(s.dateTime);return pad(x.getHours())+':'+pad(x.getMinutes())})();
        for(let k=d0,g=0;k<=d1&&g<40;k=addDays(k,1),g++)(ev[k]=ev[k]||[]).push({t,n:e.summary||'（無標題）',url:e.htmlLink||'',allDay});});
      token=pl.nextPageToken;}while(token&&++guard<4);
    GC.events=ev;GC.state='ok';
  }catch(e){GC.state='err';const c=e&&e.code;GC.msg=c==='server_not_connected'?'還沒有連接 Google 日曆。到 claude.ai 的「設定 → 連接器」加入 Google Calendar 後再試一次。':c==='not_in_manifest'||c==='approval_required'?'這次沒有允許讀取 Google 日曆。再按一次「重新整理」可以重新詢問。':c==='needs_reauth'?'Google 日曆需要重新連接（claude.ai 設定 → 連接器）。':'讀取 Google 日曆時發生問題，請稍後再試。'}
  if(R==='calendar')render();
}
function gcBar(){
  if(STANDALONE)return '';
  if(!gcOn())return `<div class="gcbar"><div><b>把 Google 日曆的行程放進來</b><div class="muted">在月曆上同時看到課表、會議和你的讀書紀錄。只會讀取，不會修改你的日曆。</div></div><button class="sec" data-act="gcOn">顯示 Google 日曆</button></div>`;
  return `<div class="gcbar on"><div><b>Google 日曆</b> <span class="muted">${GC.state==='loading'?'讀取中…':GC.state==='err'?esc(GC.msg):'已顯示這個月的行程'}</span></div><div class="row"><label class="row" style="font-size:12px"><input type="checkbox" data-ch="gcFree" ${cfg().gcalSkipFree!==false?'checked':''}> 略過標為「空閒」的活動</label><button class="sm" data-act="gcRefresh">重新整理</button><button class="ghost sm" data-act="gcOff">隱藏</button></div></div>`;
}

Object.assign(A,{
  pgNewOpen:openNewPage,
  pgNew:el=>newPage(el.dataset.t),
  pgAddToggle:()=>{pgAdding=!pgAdding;render()},
  pgDel:el=>{if(!twoStep(el))return;remove('pages',el.dataset.p);location.hash='today'},
  blkAdd:el=>{editPage(el.dataset.p,p=>{p.blocks.push(mkBlock(el.dataset.t))});pgAdding=false;render();setTimeout(()=>{const b=document.querySelectorAll('.blk');b.length&&b[b.length-1].scrollIntoView({block:'center'})},40)},
  blkDel:el=>{if(!twoStep(el))return;editPage(el.dataset.p,p=>{p.blocks=p.blocks.filter(b=>b.id!==el.dataset.b)});render()},
  blkMv:el=>{editPage(el.dataset.p,p=>{const i=p.blocks.findIndex(b=>b.id===el.dataset.b),j=i+(+el.dataset.d);if(j>=0&&j<p.blocks.length)[p.blocks[i],p.blocks[j]]=[p.blocks[j],p.blocks[i]]});render()},
  blkItemAdd:el=>{const i=$('#bi'+el.dataset.b),t=i.value.trim();if(!t)return;editPage(el.dataset.p,p=>{blk(p,el.dataset.b).items.push({id:rid(),t,done:false})});render();setTimeout(()=>{const n=$('#bi'+el.dataset.b);n&&n.focus()},30)},
  blkItemDel:el=>{editPage(el.dataset.p,p=>{const b=blk(p,el.dataset.b);b.items=b.items.filter(x=>x.id!==el.dataset.id)});render()},
  blkCnt:el=>{editPage(el.dataset.p,p=>{const b=blk(p,el.dataset.b);b.value=Math.max(0,(+b.value||0)+(+el.dataset.d)*(+b.step||1))});render()},
  blkReset:el=>{if(!twoStep(el))return;editPage(el.dataset.p,p=>{blk(p,el.dataset.b).value=0});render()},
  blkHabit:el=>{const k=el.dataset.k;editPage(el.dataset.p,p=>{const b=blk(p,el.dataset.b);if(b.days[k])delete b.days[k];else b.days[k]=true});render()},
  blkColAdd:el=>{editPage(el.dataset.p,p=>{blk(p,el.dataset.b).cols.push('新欄位')});render()},
  blkColDel:el=>{if(!twoStep(el))return;const i=+el.dataset.i;editPage(el.dataset.p,p=>{const b=blk(p,el.dataset.b);b.cols.splice(i,1);b.rows.forEach(r=>r.c.splice(i,1))});render()},
  blkRowAdd:el=>{const b0=blk(S.pages[el.dataset.p],el.dataset.b);const c=b0.cols.map((_,i)=>($('#br'+el.dataset.b+'_'+i)||{}).value||'');if(!c.some(x=>x.trim()))return toast('至少填一欄');editPage(el.dataset.p,p=>{blk(p,el.dataset.b).rows.push({id:rid(),c})});render()},
  blkRowDel:el=>{if(!twoStep(el))return;editPage(el.dataset.p,p=>{const b=blk(p,el.dataset.b);b.rows=b.rows.filter(r=>r.id!==el.dataset.id)});render()},
  gcOn:()=>{editCfg(c=>{c.gcalOn=true});GC.state='idle';render();gcLoad(false)},
  gcOff:()=>{editCfg(c=>{c.gcalOn=false});render()},
  gcRefresh:()=>{gcLoad(true);render()},
  navToggle:el=>{const r=el.dataset.r;editCfg(c=>{c.hidden=c.hidden||[];if(c.hidden.includes(r))c.hidden=c.hidden.filter(x=>x!==r);else c.hidden.push(r)});render()}
});
Object.assign(C,{
  pgName:el=>{editPage(el.dataset.p,p=>{p.name=el.value.trim()||'未命名頁面'});renderNav()},
  blkTxt:el=>{editPage(el.dataset.p,p=>{blk(p,el.dataset.b)[el.dataset.f]=el.value});if(el.dataset.f!=='title')render()},
  blkNum:el=>{editPage(el.dataset.p,p=>{blk(p,el.dataset.b)[el.dataset.f]=Math.max(0,+el.value||0)});render()},
  blkChk:el=>{editPage(el.dataset.p,p=>{const x=blk(p,el.dataset.b).items.find(y=>y.id===el.dataset.id);if(x)x.done=el.checked});render()},
  blkCol:el=>{editPage(el.dataset.p,p=>{blk(p,el.dataset.b).cols[+el.dataset.i]=el.value.trim()||'欄位'});render()},
  gcFree:el=>{editCfg(c=>{c.gcalSkipFree=el.checked});gcLoad(true)}
});
Object.assign(IN,{blkF:el=>{editPage(el.dataset.p,p=>{blk(p,el.dataset.b)[el.dataset.f]=el.value},true)}});

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(!f)return;if(el.tagName==='A'&&el.getAttribute('href')&&el.getAttribute('href').startsWith('#')&&el.dataset.act!=='goReview'&&el.dataset.act!=='toJournal'){e.preventDefault()}f(el,e)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(el&&C[el.dataset.ch])C[el.dataset.ch](el,e)});
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(el&&IN[el.dataset.in])IN[el.dataset.in](el,e)});
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea,select,[contenteditable]'))return;
  if($('#modal').innerHTML){if(e.key==='Escape')closeModal();return}
  if(e.key===' '&&R==='today'){e.preventDefault();P.running?pPause():pStart();render()}
  const n=+e.key;if(n>=1&&n<=9&&!e.metaKey&&!e.ctrlKey&&!e.altKey){const it=navItems()[n-1];if(it)location.hash=it[0]}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick(true)});
init();
})();
</script>
