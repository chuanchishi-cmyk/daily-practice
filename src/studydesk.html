<title>日課</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* Layout: quiet left rail (top strip on narrow screens), main column of soft paper-like cards; warm clay accent only for the running timer and primary actions, sage for secondary */
:root{
  --bg:#f6f3ee; --surface:#fffdfa; --sunk:#f0ece5; --ink:#3b3631; --muted:#8a8178; --line:#e8e2d8;
  --accent:#c2704f; --accent-ink:#ffffff; --focus:#5e8977;
  --good:#5a8a5e; --warn:#b98638; --bad:#b65a4e;
  --c0:#5f8f8c; --c1:#c39a4c; --c2:#8b7bae; --c3:#6a8db2; --c4:#c2704f; --c5:#7c9a68; --c6:#ad7898; --c7:#999263; --c8:#ae845e; --c9:#5c9886; --c10:#bd7383; --c11:#7c88a4;
  --shadow:0 1px 2px rgba(80,60,40,.05),0 4px 14px rgba(80,60,40,.04);
  --f-body:-apple-system,"PingFang TC","Noto Sans TC",system-ui,"Microsoft JhengHei",sans-serif;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU","PingFang TC",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1a17; --surface:#25221e; --sunk:#1e1c19; --ink:#ece6dd; --muted:#a89e93; --line:#463f37; --seg-on:#3d3731;
  --accent:#e08d6b; --accent-ink:#2a160d; --focus:#8bb5a3;
  --good:#8dbf90; --warn:#ddb06a; --bad:#e08a7e;
  --c0:#8bbab6; --c1:#dcb872; --c2:#b3a5d6; --c3:#96b4d6; --c4:#e08d6b; --c5:#a5c290; --c6:#d3a2bf; --c7:#c3bc8a; --c8:#d4ab84; --c9:#88c2ae; --c10:#e09cab; --c11:#a8b3cc;
  --shadow:0 1px 2px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1a17; --surface:#25221e; --sunk:#1e1c19; --ink:#ece6dd; --muted:#a89e93; --line:#463f37; --seg-on:#3d3731;
  --accent:#e08d6b; --accent-ink:#2a160d; --focus:#8bb5a3;
  --good:#8dbf90; --warn:#ddb06a; --bad:#e08a7e;
  --c0:#8bbab6; --c1:#dcb872; --c2:#b3a5d6; --c3:#96b4d6; --c4:#e08d6b; --c5:#a5c290; --c6:#d3a2bf; --c7:#c3bc8a; --c8:#d4ab84; --c9:#88c2ae; --c10:#e09cab; --c11:#a8b3cc;
  --shadow:0 1px 2px rgba(0,0,0,.25);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{--fs:var(--fsu,1);accent-color:var(--focus);background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:calc(14px * var(--fs,1));line-height:1.55}
.app{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100%}
nav.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh / var(--zoom,1));padding:20px 12px 20px max(12px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;background:var(--sunk)}
.brand{font-family:var(--f-display);font-weight:700;font-size:calc(18px * var(--fs,1));padding:4px 10px 16px;letter-spacing:.02em}
.brand{display:flex;align-items:center;gap:10px}
.brand>span{font-size:calc(22px * var(--fs,1));line-height:1.25;letter-spacing:.08em}
.brand small{letter-spacing:.02em}
.blogo{width:36px;height:36px;border-radius:9px;flex:none}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:calc(11px * var(--fs,1));color:var(--muted);letter-spacing:.04em}
nav.rail a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
nav.rail a:hover{background:var(--surface)}
nav.rail a[aria-current="page"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--focus)}
nav.rail a .nb{margin-left:auto;min-width:22px;text-align:center;letter-spacing:.02em;font-family:var(--f-mono);font-size:calc(11px * var(--fs,1));color:var(--muted);padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--line) 55%,transparent);line-height:1.5;white-space:nowrap}
nav.rail a .nb.ok{color:var(--focus);background:color-mix(in srgb,var(--focus) 12%,transparent)}
nav.rail a .nb.hot{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
nav.rail a .nb.ghostk{padding:0;background:none}
nav.rail{overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
nav.rail a{position:relative}
nav.rail a[aria-current="page"]::after{content:"";position:absolute;right:6px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#c9a35a;box-shadow:0 0 0 2px var(--surface)}
nav.rail a[aria-current="page"] .nb{margin-right:12px}
nav.rail.more-b{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 36px),transparent)}
nav.rail.more-a.more-b{-webkit-mask-image:linear-gradient(to bottom,transparent,#000 28px,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(to bottom,transparent,#000 28px,#000 calc(100% - 36px),transparent)}
nav.rail.more-a:not(.more-b){-webkit-mask-image:linear-gradient(to bottom,transparent,#000 28px);mask-image:linear-gradient(to bottom,transparent,#000 28px)}
nav.rail::-webkit-scrollbar{display:none}
.rail .foot{margin-top:auto;font-size:calc(11px * var(--fs,1));color:var(--muted);padding:10px;line-height:1.5}
.rail .mini{font-family:var(--f-mono);font-size:calc(13px * var(--fs,1));color:var(--accent);padding:6px 10px;display:none}
.rail .mini.on{display:block}
main{padding-block:24px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0;max-width:1280px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font-family:var(--f-display);font-size:calc(28px * var(--fs,1));font-weight:700;margin:0;text-wrap:balance;letter-spacing:.02em}
h2{font-size:calc(15px * var(--fs,1));font-weight:700;margin:0 0 12px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h3{font-size:calc(13px * var(--fs,1));font-weight:700;margin:14px 0 8px}
.eyebrow{margin:0 0 2px;font-size:calc(12px * var(--fs,1));color:var(--muted);letter-spacing:.06em}
.muted{color:var(--muted);font-weight:400;font-size:calc(12px * var(--fs,1))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.gridA{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:16px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:baseline;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:calc(12px * var(--fs,1));color:var(--ink);text-decoration:none}
.chip b{font-family:var(--f-mono);font-size:calc(15px * var(--fs,1))}
.chip.hot{border-color:var(--accent);color:var(--accent)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
button,.btn{font:inherit;font-size:calc(13px * var(--fs,1));border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;line-height:1.3}
button:hover{border-color:var(--muted)}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button.sec{background:var(--focus);border-color:var(--focus);color:var(--surface);font-weight:500}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.ghost:hover{color:var(--ink);background:var(--sunk)}
button.sm{padding:3px 8px;font-size:calc(12px * var(--fs,1))}
button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input,select,textarea{font:inherit;font-size:calc(13px * var(--fs,1));color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:0}
textarea{width:100%;resize:vertical;min-height:64px;line-height:1.6}
input[type=number]{width:80px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:calc(12px * var(--fs,1));color:var(--muted)}
label.f>input,label.f>select,label.f>textarea{color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--sunk);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 12px}
.seg button[aria-pressed="true"]{background:var(--seg-on,var(--surface));color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12),inset 0 0 0 1px color-mix(in srgb,var(--focus) 35%,transparent);font-weight:700}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:calc(13px * var(--fs,1));padding:10px 0}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--focus);border-radius:99px}
.pill{font-size:calc(11px * var(--fs,1));padding:1px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill.good{color:var(--good)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}.pill.mut{color:var(--muted)}
.banner{position:relative;background:color-mix(in srgb,var(--sunk) 70%,var(--surface));border:1px solid var(--line);border-radius:12px;padding:9px 14px 9px 28px;font-size:calc(12.5px * var(--fs,1));line-height:1.65;color:color-mix(in srgb,var(--ink) 65%,var(--muted));margin-bottom:14px}
.banner::before{content:"";position:absolute;left:12px;top:calc(9px + .62em);width:6px;height:6px;border-radius:50%;background:var(--focus);opacity:.65}
/* pomodoro */
.pomo .modes{margin-bottom:14px}
.clock{font-family:var(--f-mono);font-weight:600;font-size:clamp(56px,9vw,96px);letter-spacing:-.02em;line-height:1;text-align:center;padding:14px 0 6px;font-variant-numeric:tabular-nums}
.clock.run{color:var(--accent)}
.pbar{height:4px;background:var(--sunk);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.pbar>i{display:block;height:100%;background:var(--accent);width:0}
.cycles{display:flex;gap:6px;justify-content:center;margin-bottom:14px;font-size:calc(12px * var(--fs,1));color:var(--muted);align-items:center}
.cycles i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--accent)}
.cycles i.on{background:var(--accent)}
.pform{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.pform .wide{grid-column:1/-1}
.ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ctrl .pri{min-width:120px;padding:9px 18px;font-size:calc(15px * var(--fs,1))}
/* counters */
.ctr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.ctr:first-child{border-top:0}
.ctr .v{font-family:var(--f-mono);font-size:calc(18px * var(--fs,1))}
.ctr .bar{grid-column:1/-1}
.ctr.done .bar>i{background:var(--good)}
/* top3 */
.t3{display:flex;gap:8px;align-items:center;padding:4px 0}
.t3 input[type=text]{flex:1}
.t3.done input[type=text]{text-decoration:line-through;color:var(--muted)}
.t3c{flex:none;font-family:var(--f-mono);font-size:calc(11px * var(--fs,1));color:var(--warn)}
.t3pre{font-size:calc(12px * var(--fs,1));color:var(--muted);font-weight:400;margin-left:6px}
.carry{margin:0 0 10px;padding:8px 12px;border-radius:calc(var(--r) - 4px);background:var(--sunk);border:1px solid var(--line)}
.carry>p{margin:0 0 6px;font-size:calc(13px * var(--fs,1));color:var(--muted)}
.cr{padding:6px 0;border-top:1px dashed var(--line)}
.cr:first-of-type{border-top:0}
.cr .grow{display:block;overflow-wrap:anywhere}
.cr .grow::first-letter{color:var(--muted)}
.cr .row{gap:4px;flex-wrap:wrap;margin-top:4px}
.jq{display:flex;align-items:center;gap:14px;margin:-4px 0 14px;padding:12px 16px;border-radius:var(--r);background:linear-gradient(100deg,color-mix(in srgb,var(--surface) 70%,var(--bg)),var(--bg));border:1px solid var(--line)}
.jq{position:relative;overflow:hidden}
.jqart{width:88px;height:88px;object-fit:contain;flex:none;mix-blend-mode:multiply}
.jq.has-art{padding-right:120px;min-height:96px}
.jq.has-art .jqart{position:absolute;right:6px;width:116px;height:116px;opacity:.95;pointer-events:none;-webkit-mask-image:radial-gradient(closest-side,#000 62%,transparent 100%);mask-image:radial-gradient(closest-side,#000 62%,transparent 100%)}
.jq.p-hang .jqart{top:-10px;object-position:right top}
.jq.p-up .jqart{bottom:-12px;object-position:right bottom}
.jq.p-side .jqart{top:50%;transform:translateY(-50%);object-position:right center}
@media (max-width:600px){.jq.has-art{padding-right:96px}.jq.has-art .jqart{width:100px;height:100px;right:2px;top:50%;bottom:auto;transform:translateY(-50%)}}
.jq.fest{background:linear-gradient(100deg,color-mix(in srgb,var(--accent) 7%,var(--surface)),var(--bg));border-color:color-mix(in srgb,var(--accent) 25%,var(--line))}
.jq .jqalso{display:block;margin-top:4px;font-size:calc(11.5px * var(--fs,1));color:var(--muted)}
.jq .jqseal.fseal{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);opacity:1}
.jqmoon{flex:none;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 38% 36%,#fffaf0,#f3dfae 55%,#e2c27d);box-shadow:0 0 0 6px color-mix(in srgb,#f3dfae 25%,transparent),0 0 24px 6px color-mix(in srgb,#f3dfae 45%,transparent)}
:root[data-theme="dark"] .jq.has-art .jqart{mix-blend-mode:normal;opacity:.9;width:84px;height:84px;right:14px;top:50%;bottom:auto;transform:translateY(-50%);border-radius:10px;-webkit-mask-image:none;mask-image:none;box-shadow:0 2px 10px rgba(0,0,0,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .jq.has-art .jqart{mix-blend-mode:normal;opacity:.9;width:84px;height:84px;right:14px;top:50%;bottom:auto;transform:translateY(-50%);border-radius:10px;-webkit-mask-image:none;mask-image:none;box-shadow:0 2px 10px rgba(0,0,0,.35)}}
.jqseal{flex:none;display:grid;place-items:center;width:46px;height:46px;border:1.5px solid color-mix(in srgb,var(--accent) 70%,transparent);border-radius:6px;color:var(--accent);font-family:var(--f-display);font-size:calc(14px * var(--fs,1));letter-spacing:.1em;writing-mode:vertical-rl;line-height:1.1;opacity:.85}
.jqt{min-width:0}
.jqh{margin:0;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.jqh b{font-family:var(--f-display);font-size:calc(17px * var(--fs,1));letter-spacing:.12em}
.jqh span{font-size:calc(12px * var(--fs,1));color:var(--muted);letter-spacing:.06em}
.jql{margin:3px 0 0;font-family:var(--f-display);font-size:calc(13.5px * var(--fs,1));line-height:1.7;color:color-mix(in srgb,var(--ink) 85%,var(--muted))}
.adapt{margin:-6px 2px 14px;font-size:calc(12.5px * var(--fs,1));color:var(--muted)}
.adapt::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--focus);margin-right:8px;vertical-align:2px;opacity:.7}
.xcount{text-align:center;margin:10px 0 0;font-size:calc(13px * var(--fs,1));color:var(--muted)}
.xcount b{color:var(--ink);font-size:calc(15px * var(--fs,1))}
.xcount .xlink{margin-left:6px}
.yoga-now{text-align:center}
.ypose{font-family:var(--f-display);font-size:calc(22px * var(--fs,1));margin:6px 0 0;letter-spacing:.06em}
.ybreath{width:120px;height:120px;margin:4px auto 6px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--focus) 14%,var(--surface));border:1.5px solid color-mix(in srgb,var(--focus) 45%,transparent);animation:ybr var(--bt) ease-in-out infinite}
.ybreath span{font-size:calc(12px * var(--fs,1));color:var(--focus)}
@keyframes ybr{0%{transform:scale(.72)}40%{transform:scale(1)}100%{transform:scale(.72)}}
@media (prefers-reduced-motion:reduce){.ybreath{animation:none}}
.gymex{padding:10px 0;border-top:1px solid var(--line)}
.fllist{display:flex;flex-direction:column}
.flrow{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--line)}
.flrow input[type=text]{flex:1 1 7em;min-width:0}.flrow input[type=number]{width:46px;padding-left:4px;padding-right:4px;text-align:center}
.flrow>.ghost{opacity:.5;min-height:0!important;padding:2px 6px}
.fldots{display:flex;justify-content:center;flex-wrap:wrap;gap:5px;margin:10px 0 2px}
.fldots i{width:9px;height:9px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--focus) 55%,var(--line))}
.fldots i.d{background:var(--focus);border-color:var(--focus)}.fldots i.on{background:color-mix(in srgb,var(--focus) 35%,transparent);transform:scale(1.25)}
.flbig{display:block;width:min(260px,100%);margin:12px auto 0;padding:12px 0;font-size:calc(16px * var(--fs,1));border-radius:999px}
.flnote{margin:10px 0 0;font-size:calc(12px * var(--fs,1))}
.fldone .mood button{min-width:38px}
.caregrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.caretile{display:grid;grid-template-columns:28px 1fr;grid-template-rows:auto auto auto;column-gap:8px;text-align:left;padding:10px 12px;border-radius:12px;background:var(--sunk);border:1px solid var(--line)}
.caretile svg{grid-row:1/4;width:24px;height:24px;fill:none;stroke:var(--focus);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-top:2px}
.caretile b{font-size:calc(14px * var(--fs,1))}.caretile span{font-size:calc(12px * var(--fs,1));color:var(--muted)}.caretile i{font-style:normal;font-size:calc(11.5px * var(--fs,1));color:var(--focus);margin-top:2px}
.caretile.on{border-color:var(--focus);background:color-mix(in srgb,var(--focus) 10%,var(--surface))}
.brktip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.brkbtn{display:inline-flex;align-items:center;gap:6px;border-radius:999px}.brkbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.spquick{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}.spquick input[type=text]{flex:1 1 10em;min-width:0}.spquick input[type=number]{width:62px}
.gymex:first-of-type{border-top:0}
.gymex .chip{margin:2px 2px 2px 0}
.ltcard{display:flex;align-items:center;gap:12px;margin:-4px 0 14px;padding:12px 16px;border-radius:var(--r);border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));background:color-mix(in srgb,var(--accent) 6%,var(--surface));color:var(--ink);text-decoration:none}
.ltcard .grow{display:flex;flex-direction:column}
.ltseal{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-size:calc(17px * var(--fs,1))}
.letter{margin-bottom:14px}
.ltwait{text-align:center;padding-top:8px}

@media (max-width:1100px){.grid3{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.gridA{grid-template-columns:1fr}}
@media (max-width:820px),(orientation:landscape) and (max-height:500px) and (pointer:coarse){
  body{--fs:calc(var(--fsu,1) * 1.1);line-height:1.65;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  .muted{line-height:1.6}
  .jnav{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:6px;width:100%}
  .jnav>.seg{grid-column:1/-1;justify-self:start}
  .jnav input[type=date]{width:100%}
  h1{line-height:1.3}
  .card h2{line-height:1.4}
  input,select,textarea{font-size:max(16px,calc(13px * var(--fs,1)))}
  .app{grid-template-columns:minmax(0,1fr)}
  nav.rail{max-width:100%;width:100%;box-sizing:border-box}
  nav.rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;overflow-x:auto;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line);z-index:5}
  .brand,.rail .foot,nav.rail a .k{display:none}
  nav.rail .sharebtn{margin:0;white-space:nowrap}
  nav.rail .fbbtn{margin:0;white-space:nowrap}
  nav.rail .syncchip{margin:0;white-space:nowrap}
  nav.rail{overflow-y:hidden;overflow-x:auto}
  nav.rail a{white-space:nowrap}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .grid2,.grid3{grid-template-columns:1fr}
  .fields{grid-template-columns:1fr 1fr!important}
  .phase>summary{grid-template-columns:22px minmax(0,1fr) auto}
  .phase>summary .bar{display:none}
  .cell{min-height:64px}
  .cell .tag{display:none}
  .emo{width:calc(50% - 4px)}
  .plan-grid{grid-template-columns:1fr}
  .navsep{display:none}
  .navlinks{flex-direction:row}
  .navadd{white-space:nowrap}
  .grid3{grid-template-columns:1fr!important}
  .step{grid-template-columns:auto minmax(0,1fr) auto auto}
  .step input[type=date],.step [data-act=stepMv],.step .stepdue{display:none}
  .card,main>*{min-width:0}
  .track{width:100%;max-width:100%;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .tseg{flex:0 0 auto!important;min-width:96px;scroll-snap-align:start}
  .tseg.on{min-width:132px}
  .tseg .tlab{font-size:calc(12px * var(--fs,1));padding:6px 8px}
  .ph{flex-direction:column;align-items:stretch;gap:10px}
  .ph>div:first-child{flex:none}
  .ph h1{font-size:calc(26px * var(--fs,1));overflow-wrap:anywhere}
  .card{padding:16px}
  button,.btn{min-height:40px}
  button.sm,.btn.sm{min-height:34px;padding:5px 12px}
  .seg button{min-height:36px}
  .xlink{display:inline-block;padding:6px 0}
  .tdel,.mood button,.likert button,.hcell,.cal .cell,nav.rail button,nav.rail a{min-height:0}
  .visline .ord button,.ostrow .ord button{min-height:34px}
  .stepdetail{padding-left:0}
  .wincards{grid-template-columns:1fr 1fr}
  .winact{flex-direction:column;align-items:flex-start;gap:6px}
  .modal{align-items:flex-end;padding:0}
  .modal .box{width:100%;border-radius:20px 20px 0 0;max-height:92vh;padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px))}
  .modal .box.welcome{border-radius:20px;margin:16px;width:calc(100% - 32px)!important;align-self:center}
  .ostage{grid-template-columns:22px minmax(0,1fr) auto 40px}
  .ostage .bar{display:none}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sunk)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- splash ---- */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#f3ece0;color:#3b3631;cursor:pointer;transition:opacity .55s ease,visibility .55s}
#splash.out{opacity:0;visibility:hidden}
#splash .sp-art{position:relative;width:min(56vw,300px);aspect-ratio:1;border-radius:22%;overflow:hidden;box-shadow:0 18px 50px rgba(90,60,30,.18);animation:spIn .9s cubic-bezier(.2,.7,.2,1) both}
#splash .sp-art img{width:100%;height:100%;display:block}
#splash .sp-ring{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#splash .sp-ring circle{fill:none;stroke:#c9a35a;stroke-width:.9;stroke-linecap:round;stroke-dasharray:196;stroke-dashoffset:196;transform:rotate(-90deg);transform-origin:50% 38%;animation:spDraw 1.5s .35s cubic-bezier(.45,.05,.3,1) forwards}
#splash .sp-ring .dot{fill:#e8c98a;stroke:none;transform-origin:50% 38%;animation:spDot 1.5s .35s cubic-bezier(.45,.05,.3,1) forwards;opacity:0}
#splash .sp-name{font-family:var(--f-display);font-size:30px;letter-spacing:.35em;margin:6px 0 0 .35em;animation:spUp .7s .8s both}
#splash .sp-line{font-size:15px;color:#7d7268;letter-spacing:.12em;margin:0;animation:spUp .7s 1.15s both}
#splash .sp-skip{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));font-size:12px;color:#a59a8f;animation:spUp .5s 1.6s both}
@keyframes spIn{from{opacity:0;transform:scale(.92);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spDot{0%{opacity:1;transform:rotate(0)}95%{opacity:1}100%{opacity:0;transform:rotate(360deg)}}
@keyframes spUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #splash{background:#1f1c19;color:#eee7dc}:root:not([data-theme="light"]) #splash .sp-line{color:#b3a899}}
:root[data-theme="dark"] #splash{background:#1f1c19;color:#eee7dc}
:root[data-theme="dark"] #splash .sp-line{color:#b3a899}
/* ---- page switch ---- */
#main.enter{animation:pgIn .32s cubic-bezier(.2,.7,.2,1) both}
@keyframes pgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.blogo.turn{animation:logoTurn .7s cubic-bezier(.4,0,.2,1)}
@keyframes logoTurn{0%{transform:perspective(200px) rotateY(0)}50%{transform:perspective(200px) rotateY(-90deg) scale(.92)}100%{transform:perspective(200px) rotateY(0)}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}#main.enter,.blogo.turn{animation:none}}
</style>

<script>
(()=>{
'use strict';
const STANDALONE=false;
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o??null));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const parseD=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parseD(k);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const weekStart=k=>{const d=parseD(k);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return ymd(d)};
const WD=['一','二','三','四','五','六','日'];
const wdName=k=>'日一二三四五六'[parseD(k).getDay()];
const fmtLong=k=>{const d=parseD(k);if(window.APPLANG==='en')return d.toLocaleDateString('en-US',{weekday:'short',year:'numeric',month:'short',day:'numeric'});return `${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日（週${wdName(k)}）`};
const fmtMD=k=>{const d=parseD(k);return `${d.getMonth()+1}/${d.getDate()}`};
const fmtMin=m=>{m=Math.round(m);if(window.APPLANG==='en'){if(m<60)return m+' min';const h=Math.floor(m/60),r=m%60;return r?`${h} h ${r} min`:`${h} h`}if(m<60)return m+' 分';const h=Math.floor(m/60),r=m%60;return r?`${h} 時 ${r} 分`:`${h} 小時`};
const mmss=s=>{s=Math.max(0,Math.ceil(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${pad(m)}:${pad(x)}`:`${pad(m)}:${pad(x)}`};
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}

/* ---------- defaults ---------- */
// 上班情境：用途選了「工作上班」，或計畫是工作類型時，用主管、同事、客戶、專案的說法
const WK=()=>(cfg().purposes||[]).includes('work');
const ACAD_T=['thesis','article','conf','chapter','grant','project','report','apply','exam','scholar'];
const isAcadProj=p=>!!p&&ACAD_T.includes(p.type)&&!(WK()&&p.type==='project');
const WHO_ACAD=['指導教授','口試委員','共同作者','同儕','其他'],WHO_WORK=['主管','同事','客戶','合作夥伴','其他'];
const whoList=p=>isAcadProj(p)?WHO_ACAD:WHO_WORK,whoDef=p=>whoList(p)[0];
const isTeacher=w=>w==='指導教授'||w==='口試委員';
const PH=(acad,work)=>(WK()||(typeof R!=='undefined'&&R==='work'))?work:acad;
const WORK_TAGS=[{id:'W1',name:'專案',c:5,unit:''},{id:'W2',name:'會議',c:3,unit:''},{id:'W3',name:'信件與聯絡',c:1,unit:''},{id:'W4',name:'學習成長',c:10,unit:''},{id:'E',name:'運動',c:8,unit:'分'}];
const DEF={
  subjects:[
    {id:'T',name:'論文',c:4,unit:'頁'},{id:'P',name:'專案進度',c:5,unit:''},{id:'B',name:'閱讀',c:10,unit:'頁'},

/* ---------- charts ---------- */
function niceMax(v){if(v<=0)return 4;const raw=v/4,p=Math.pow(10,Math.floor(Math.log10(raw)));const n=raw/p;const s=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;return s*p*4}
function fmtN(v){return Math.round(v*10)/10}
function stackBars(rows,{h=200,unit='分',every=1,marker=null,minW=320,minMax=null,per=30}={}){
  const W=Math.max(rows.length*per,minW),pl=38,pb=22,pt=10,ih=h-pb-pt;
  const max=niceMax(Math.max(minMax==null?(unit==='分'?30:4):minMax,...rows.map(r=>r.parts.reduce((a,p)=>a+p.v,0))));
  const bw=(W-pl)/rows.length;
  let s=`<svg class="chart${minW>=700?' wide':''}" viewBox="0 0 ${W} ${h}" role="img" aria-label="長條圖">`;
  for(let i=0;i<=4;i++){const v=max*i/4,y=pt+ih-ih*i/4;s+=`<line class="grid" x1="${pl}" x2="${W}" y1="${y}" y2="${y}"/><text class="ax" x="${pl-6}" y="${y+3.5}" text-anchor="end">${fmtN(v)}</text>`}
  rows.forEach((r,i)=>{let y=pt+ih;const x=pl+i*bw+bw*.18,w=bw*.64;
    if(marker&&r.key===marker)s+=`<rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${ih}" fill="var(--sunk)"/>`;
    r.parts.forEach(p=>{if(!p.v)return;const hh=ih*p.v/max;y-=hh;s+=`<rect x="${x}" y="${y}" width="${w}" height="${hh}" fill="var(--c${p.c})"><title>${esc(r.label)} ${esc(p.n||'')}：${fmtN(p.v)} ${unit}</title></rect>`});
    if(i%every===0)s+=`<text class="ax" x="${pl+i*bw+bw/2}" y="${h-6}" text-anchor="middle">${esc(r.label)}</text>`});
  return `<div class="chartwrap">${s}</svg></div>`;
}
function lineChart(series,{h=220,ymax=30,labels=[],steps=4}={}){
  const W=640,pl=34,pr=26,pb=24,pt=10,ih=h-pb-pt,iw=W-pl-pr,n=labels.length;
  const X=i=>pl+(n<=1?iw/2:iw*i/(n-1)),Y=v=>pt+ih-ih*v/ymax;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="分數趨勢">`;
  for(let i=0;i<=steps;i++){const v=ymax*i/steps;s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${pl-6}" y="${Y(v)+3.5}" text-anchor="end">${fmtN(v)}</text>`}
  const ev=Math.max(1,Math.ceil(n/8));labels.forEach((l,i)=>{if(i%ev===0||i===n-1)s+=`<text class="ax" x="${X(i)}" y="${h-6}" text-anchor="middle">${esc(l)}</text>`});
  series.forEach(se=>{const pts=se.vals.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);if(!pts.length)return;
    s+=`<polyline fill="none" stroke="var(--c${se.c})" stroke-width="2" points="${pts.map(p=>p.join(',')).join(' ')}"/>`;
    pts.forEach((p,i)=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4:2.5}" fill="var(--c${se.c})"/>`})});
  return `<div class="chartwrap">${s}</svg></div>`;
}
function hbars(items,unitFn){
  const max=Math.max(1,...items.map(i=>i.v));
  return `<div class="list hbars">${items.map(i=>`<div class="li"><span class="nm">${esc(i.n)}</span><div class="bar"><i style="width:${100*i.v/max}%;background:var(--c${i.c})"></i></div><span class="val num">${unitFn(i)}</span></div>`).join('')}</div>`;
}

function exRing(e,n){const tot=Math.max(n,e.setAt?diffDays(e.setAt,e.date):Math.max(n,90),1),f=n<0?1:1-n/tot,R=40,C=2*Math.PI*R,hot=n>=0&&n<=7;

function parseSegs(str){return str.split(/[,，、]/).map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/^(.*?)\s*(\d+)(?::(\d{1,2}))?$/);if(!m)return null;return {n:m[1].trim()||'計時',s:(+m[2])*60+(+(m[3]||0))}}).filter(s=>s&&s.s>0)}

    notes:['多數人一天會經歷高峰、低谷、回升三個階段。晨型和中間型大致依這個順序，夜型的順序接近相反。','高峰時警覺度最高，適合需要專注和分析的工作；低谷時最容易出錯，適合例行事務；回升時心情放鬆、比較不受拘束，適合需要創意和聯想的任務。','休息是表現的一部分。短暫、規律、離開螢幕的休息，例如走動、和人聊天、到戶外，比硬撐更能恢復狀態。','書中建議連續幾天定時記錄自己的精力，用數據而不是印象找出自己的模式。'],

  intent:{zh:'Intentional: How to Finish What You Start',en:'Intentional: How to Finish What You Start',au:'Chris Bailey（克里斯・貝利）',part:'價值',noZh:true,
    intro:'Bailey 認為，完成目標的關鍵不是意志力或最新的效率技巧，而是更有意圖地行動。他結合目標達成、渴望、價值與拖延的研究，以及和佛教僧侶的對話，整理出從價值到每天行動的方法。你的價值輪廓，就是依照書中的 12 個基本價值整理的。',

    use:'報告的價值輪廓、價值拉扯和「卡住時問自己」，都依照書中的 12 個價值和兩條軸整理。作者自己用的是正式的 PVQ-RR 量表；這份測驗是簡易自編版本，適合用來認識自己。'},

    notes:['一個番茄 = 專注 25 分鐘，接著短休 3–5 分鐘；每完成 4 個番茄，休息長一點，約 15–30 分鐘。','一個番茄不能分割。中途被打斷時，先記下來、晚點處理；真的必須中斷，這個番茄就不算，重新開始。','面對外來打擾：先告知對方你正在忙、約好稍後回覆，再準時回頭處理。','記錄每天完成幾個番茄，也用番茄數估計一件事要花多少力氣，估得越來越準。','休息時真正離開工作，讓大腦恢復，下一個番茄才會專注。'],

function lastPractice(){const ds=Object.keys(S.days).filter(d=>((day(d).j||{}).practice||[]).length).sort();const d=ds[ds.length-1];if(!d)return null;const ps=day(d).j.practice;return {d,p:ps[ps.length-1]}}

 {k:'sad',re:/難過|傷心|失落|沮喪|低落|想哭|孤單|寂寞|委屈/,
  a:['今天心裡有些沉，謝謝你願意寫下來。','難過的時候還願意坐下來陪自己，這份溫柔很珍貴。'],
  b:'不需要把情緒推開，可以把手輕輕放在胸口，感覺手的溫度。今天練習短一點也沒關係，照顧好自己最重要。如果低落持續很多天，記得找信任的人聊聊。',
  m:'靜心不是要讓情緒消失，而是在情緒裡也能有一點空間。聖嚴法師提醒，情緒低落、身心疲累時，不適合硬撐著坐，先讓身體休息、讓呼吸平順下來，再回來練習。也可以用很簡單的方式陪伴自己：慢慢走一段路，或只是感覺三次呼吸，告訴自己「現在是這樣，沒關係」。如果難過一直持續，影響到睡眠或生活，請和信任的人或專業人員聊聊，這也是照顧自己的一部分。',
  s:'參考聖嚴法師《禪的體驗‧禪的開示》頁 36'},
 {k:'expect',re:/期待|想要|追求|應該要|一定要|效果|進步|達到|成果|做到|上次那樣|上次那種/,
  a:['想坐得更好、想再有上次的感覺，這份用心很真誠。','看得出來你很在意練習有沒有進步。'],
  b:'每次坐下，不求效果，不怕不好的狀態，也不追求好的狀態，保持平穩就好。平靜時知道平靜，散亂時知道散亂，兩種都有價值。只管用方法，進步會自己來。',
  m:'有學生坐出一次很好的狀態，之後一直想再回去，聖嚴法師回答他：「我沒辦法使你每一次打坐，都能得到輕靈明淨；我只能告訴你，每次打坐，不求效果，不怕壞境界，也不求好境界現前……不期待、不企求，保持平穩的心情。唯有如此，才會進步。」他也用破繭來比喻：蝴蝶若急著鑽出繭殼，反而可能提前死在繭中。練習需要時間，急不來。',
  s:'聖嚴法師《禪的生活》頁 108–109、203–204'},
 {k:'judge',re:/做不好|很差|失敗|沒用|自責|不夠好|好爛|笨|退步|比以前差|沒進步/,
  a:['覺得自己沒做好，心裡一定有點沮喪。','你對自己的要求很高。'],
  b:'練習本來就有進有退：有進，知道方法有用；有退，知道還需要練習。不用懊惱，也不必不好意思。坐下來、發現走神、再回來，每一步都算數。',
  m:'有年輕學生在禪修時覺得自己脫胎換骨，回到生活不久又退回原狀，懊喪得不好意思再回來。聖嚴法師說：「其實不要害怕，不必害羞，這是正常的現象……有進，才知道修行有用；有退，才知道你是凡夫；既知道尚是凡夫，你才更要好好地用功。」對自己嚴格的聲音，也只是一個念頭，看見它就好，不必相信它。試著用對好朋友說話的語氣對自己說：「沒關係，我們再回來就好。」',
  s:'聖嚴法師《禪的生活》頁 42–43'},
 {k:'doubt',re:/懷疑|有沒有用|做得對嗎|不知道怎麼|不確定|迷惘|方法對嗎/,
  a:['不確定自己做得對不對，是練習一陣子後常有的疑問。','你在認真想這個方法適不適合自己。'],
  b:'先相信自己有能力練習，選一個簡單的方法，例如數呼吸，持續一兩週再看看。不要今天換這個、明天換那個。比較快發現自己走神，就已經是進步。',
  m:'聖嚴法師在禪修開示中提醒：要相信自己有練習的能力，不要小看自己，也不要懷疑自己；若對自己和方法起疑，遇到困難時就很容易放棄。明代憨山大師也把「不可自生疑慮」列為用功的原則：今天這樣、明天那樣，又擔心得不到效果，這些盤算本身就成了障礙。所以先選定一個方法，安心地用一段時間。有疑問時，請教有經驗的老師，會比自己反覆猜測更有幫助。',
  s:'聖嚴法師《禪的體驗‧禪的開示》頁 288–289；《禪門修證指要》頁 176'},
 {k:'strange',re:/看到光|看見光|影像|身體自己動|自己晃|飄起來|奇怪的感覺|特別的感覺|好像離開身體/,
  a:['靜坐時出現了特別的感覺，有點新奇，也可能有點不安。'],
  b:'不管是舒服的還是奇怪的感覺，都不用管它：不害怕，也不追求，回到呼吸就好。如果這些感覺讓你不安，或常常出現，先暫停練習，並請教有經驗的老師或醫師。',
  m:'心比較集中時，身心偶爾會出現特別的反應，例如看到光、身體晃動或輕飄飄的感覺。虛雲老和尚說：「雖遇著或見著什麼惡境界，也不要管它，不要害怕；就是看見什麼好境界，也不要管它，不要生歡喜。」也就是俗話說的「見怪不怪，其怪自敗」。聖嚴法師也提醒，若把這些感覺當真，每次坐下就害怕它再來、或期待它再來，心就無法放在方法上。感覺持續或讓你不安時，請暫停並尋求專業協助。',
  s:'虛雲老和尚開示，收於聖嚴法師《禪門修證指要》頁 235；《禪的體驗‧禪的開示》頁 118'},
 {k:'good',chip:'幾乎沒有',re:/平靜|安定|舒服|清楚|輕鬆|喜悅|放鬆|安靜|很好|順/,
  a:['這次坐得很安定，真替你高興。','今天的練習很順。'],
  b:'記住此刻身心的感覺，也留意是什麼幫助了你：時段、姿勢或當天的狀態。但不必抓住這份平靜，下次不一樣也很自然。每次都用新的心情坐下來就好。',
  m:'坐得好的時候，聖嚴法師反而提醒要「提高警覺」：在坐得舒服或平穩時，不期待、不企求，保持平穩的心情。因為一旦抓住好的感覺，下一次坐下就會想追回它，心反而緊了。放鬆和安定是一體的兩面，這次的安定，是放鬆自然帶來的結果。可以把這次的條件記在筆記裡，例如什麼時段、睡得好不好、坐前有沒有暖身，之後再創造類似的條件。',
  s:'聖嚴法師《禪的生活》頁 203–204；《禪的體驗‧禪的開示》'}];
// Detailed explanations (shown under "看更多說明…"), several per situation from different teachers; rotated per session.
// Plain language, at most one light image or quote each. Source text is not counted in length.
const MZ_M={
 dull:[
  {m:'昏沉和散亂，是靜坐時最常見的兩種狀態。用功時太緊張，神經一繃緊就容易累，累了自然想睡，所以第一步其實是放鬆，而不是更用力。輕微的昏沉，睜大眼睛、把注意力提到眉心，通常就能清醒；很重的昏沉，最好的方法反而是乾脆睡一會兒。也可以留意時段：飯後或熬夜後最容易昏沉，換到精神好的時候坐，會輕鬆很多。下次坐前先活動一下肩頸、洗把臉，坐的時間也可以先短一點，清醒地坐十分鐘，勝過昏沉地坐半小時。',s:'聖嚴法師《禪的體驗‧禪的開示》頁 41–43；《禪的生活》頁 59–60'},
  {m:'想睡的時候，可以不急著趕走它，先在心裡輕輕說：「想睡、想睡」，眼皮重就知道「沉重」。這樣清楚地看著，有時睡意會自己退去，心又變得清明。如果一直只看同一個點、太安靜，也容易昏沉，這時可以改成觀察腹部的起伏，或加上身體接觸坐墊的感覺，讓心有一點事做。坐和走交替練習，也是對治昏沉的好方法。如果睡意始終不退，也不必責怪自己，那可能只是身體需要休息，今天早點睡，明天再坐。',s:'馬哈希大師《向馬哈希大師學正念Ⅰ》頁 37；《Ⅱ》頁 28–30'},
  {m:'昏沉常有兩種來源：一是真的累了、睡不夠；二是對練習的對象提不起興趣，心力變得薄弱。前者需要的是休息，好好睡一覺，比硬撐更有幫助；後者可以讓練習多一點新鮮感，例如換成行走靜心，或在吸氣時感受空氣的清涼、吐氣時感受溫暖，讓注意力有個鮮明的地方停留。也可以想想最近的作息：睡得夠嗎？吃得太飽嗎？很多時候，調整一下生活，比在坐墊上用力有效。下次不妨換個時段試試。',s:'帕奧禪師《如實知見》'}],
 tense:[
  {m:'靜坐的目的可以說得很簡單：學會放鬆身心，以及隨時能安定身心，兩者是一體的兩面，能放鬆就能安定。放鬆的方法就是「不用力」：眼球不用力、臉部不用力、肩膀和手臂不用力，再檢查小腹，小腹一直緊著，久了會呼吸不順。如果數呼吸時頭會痛，通常是在用頭腦「想」呼吸，把注意力放回身體和坐墊接觸的地方，頭就會輕鬆。下次開始前，花一分鐘從頭到腳掃過一遍，哪裡緊就讓哪裡鬆一點。',s:'聖嚴法師《禪的體驗‧禪的開示》頁 226、253；《聖嚴法師教默照禪》頁 31'},
  {m:'有人把呼吸想像成一只直立的水瓶：吸氣時，水從瓶底慢慢升起，經過腹部、胸口到喉嚨；吐氣時，水位一路往下降，直到瓶底。不必刻意控制，只是溫和地詢問身體：「怎麼呼吸對你最好？」也許把肩膀放低一點，也許胸口打開一點。試著找到讓身體覺得舒服的呼吸方式，緊繃會在不知不覺中鬆開。這樣的呼吸沒有要達成什麼，只因為呼吸本身值得被好好感受。下次覺得緊時，就回到這只水瓶。',s:'比約恩．納提科《我可能錯了》第 3 章'}],
 restless:[
  {m:'多數調心的方法，都是用來對治散亂的心，最基本的就是數呼吸：只數吐氣，從一到十，周而復始。數數本身也是一個念頭，但它用一個單純的念頭代替紛亂的念頭，心就有了落腳處。調心最要緊的是不可心急，心若老是焦急地期待什麼、擔心什麼，只會更疲憊。心太躁時，也可以先活動幾分鐘或慢慢走路，再坐下來。下次坐不住時，先別急著要安靜，從「數到十」這樣一個小目標開始，數亂了就從一重來。',s:'聖嚴法師《禪的體驗‧禪的開示》頁 43；《禪的生活》頁 53、108–109'},
  {m:'心浮動不安的時候，就像一堆灰燼被石頭擊中，灰塵四處飛揚。這時不需要用力壓制，越壓越亂；先讓吐氣慢一點、長一點，讓揚起的灰塵自己慢慢落下。也可以把呼吸分成幾小段來數，每次吸氣在心裡默數到五，吐氣也數到五，注意力就比較不容易跑掉。數的目的不是數字本身，而是讓心一直跟著呼吸。數到五或十就好，不要數得太快，也不必在意數字對不對，平靜地數，讓數字陪著呼吸。下次心亂時，先從長長的吐氣開始。',s:'帕奧禪師《如實知見》；焦諦卡禪師《禪修之旅》第二講'}],
 thoughts:[
  {m:'念頭很多不需要害怕，也不用費力去降伏它。只要認得它，不跟著它跑，也不急著把它推開，念頭沒有被接下去，自己就會離開。就像貓守在洞口等老鼠：放鬆地看著，老鼠出來也好、不出來也好，出來就看見牠，跑了也不追。練習久了，會發現察覺念頭的時候，它往往已經過去了。下次念頭很多時，可以在心裡輕輕說一聲「想」，像跟它打個招呼，然後回到呼吸，不必和它講道理。',s:'虛雲老和尚開示，收於聖嚴法師《禪門修證指要》頁 233；《禪的生活》頁 53、58'},
  {m:'有位泰國禪師用蜘蛛來比喻：蜘蛛結好網，就安靜地待在網中央；有蟲子撞上來，牠過去處理一下，又回到中央。念頭和感受就像撞上網的小蟲，來了就知道，處理完再回到呼吸這個中心。念頭越常出現，越不要為此煩躁，反而要把心情放鬆，輕輕地回到氣息上就好。不管念頭是什麼，覺知的心只要清楚，念頭就只是進來又離開。下次心被拉走時，記得那隻在網中央、不慌不忙的蜘蛛。',s:'《阿姜查的禪修世界（二）》；帕奧禪師《轉正法輪》'},
  {m:'有位在森林寺院修行十七年的瑞典僧人說，他學到最珍貴的一件事是：不再相信自己的每一個念頭。大腦本來就像熱鬧的馬戲團，不停冒出各種想法，這很正常，每個人都一樣。我們不能選擇哪些念頭會出現，但可以選擇要不要相信它。注意力每次溜走，發現了就好，不用責備自己，平靜地把它帶回來。用一點幽默看待自己的念頭，會讓人更容易做自己。下次腦中又開始演戲時，可以對自己笑一笑：「馬戲團又開演了。」',s:'比約恩．納提科《我可能錯了》第 3、5、6 章'}],
 body:[
  {m:'痛、麻、痠、癢都是打坐常見的反應：腿痛、腰痛多屬正常；腿麻站起來甩一甩、走幾步就會恢復；關節或腰部痠，下坐後按摩幾下即可；坐時用毛巾蓋住雙腿，可以避免受寒痠痛。輕微的痛不必理會，甚至能讓心念更集中；但如果痛到已無法安心，就不需要忍：背痛就彎一彎腰，腿痛就把腿放開。另外，打坐時的痛常與緊張有關，接受它、不對抗它，反而容易緩解。下次開始前先暖身，坐的時間也可以循序漸進。',s:'聖嚴法師《聖嚴法師教禪坐》頁 102；《聖嚴法師教默照禪》頁 83'},
  {m:'身體出現痠、痛、麻、癢時，可以把注意力放在那裡，心裡輕輕標記：「痛、痛」或「痠、痠」，看它怎麼變化。有時它會慢慢減弱，有時會變強。如果真的忍不住想換姿勢，先知道「想換了」，再慢慢地、清楚地移動，每個動作都看著。換好之後，再回到呼吸。這樣，換姿勢本身也成了練習。如果觀察一陣子仍很難受，就照顧身體、換個姿勢，不必硬撐。下次可以先選一個能久坐又舒服的姿勢，坐椅子也很好。',s:'馬哈希大師《向馬哈希大師學正念Ⅰ》頁 27–30'}],
 sound:[
  {m:'不論在做什麼，只要知道正在發生什麼，並恰如其分地處理，不加上「我好討厭」「這真麻煩」的評論，就不會被外境帶著走。面對聲音也是如此：聲音出現，清楚知道；聲音離開，也清楚知道，不迎接、不抗拒。這樣練習，聲音反而能成為讓心安定的對象，像潮水一樣來來去去。也就是說，讓我們煩的常常不是聲音，而是心裡那句「希望它停下來」。下次聽到聲音時，試著只聽，不加評論，看看心有什麼不同。',s:'聖嚴法師《聖嚴法師教默照禪》頁 22–23'},
  {m:'聽到明顯的聲音時，可以在心裡標記「聽到、聽到」兩三次，然後回到呼吸。不用去分辨那是什麼聲音、好不好聽。容易被聲音嚇一跳或煩躁，常是因為我們不自覺地替聲音加上了意思。練習久了，心安定下來，聲音就只是聲音，不再拉走你。環境太吵時，換個時段或地點，也是照顧練習的方式。下次被聲音拉走時，不用懊惱，知道「聽到了」，就是這次練習的一部分。',s:'馬哈希大師《向馬哈希大師學正念Ⅰ》頁 44–45；帕奧禪師《轉正法輪》'}],
 anger:[
  {m:'面對困擾，可以練習「面對它、接受它、處理它、放下它」。生氣時先面對：知道「我正在生氣」，看清它在身體裡的樣子，胸口緊、臉發熱或拳頭握著；再接受：不責怪自己怎麼又生氣了；然後處理：等心平靜時，再想該怎麼回應那件事；最後放下：事情處理了，就不再反覆咀嚼。這四個步驟不一定一次做到，能先做到第一步「知道自己在生氣」，就已經很不容易。下次怒氣上來時，先給自己三個長長的吐氣。',s:'聖嚴法師《聖嚴法師教默照禪》頁 22–23、68'},
  {m:'有位禪師說，每一種情緒都有它的家。怒氣來了，不必討論「該不該生氣」，只是清清楚楚地看著它來，看它在身體和心裡的樣子，然後讓它慢慢回到自己的家。不執著，也不逃避。這需要一點安靜和耐心，但每一次你只是看著而沒有被帶走，心就多了一分自由。這種單純的觀察需要練習，一開始可能只撐得了幾秒鐘，沒關係。下次情緒來時，試著在心裡說：「我看見你了」，然後陪它待一會兒，等它自己回家。',s:'《阿姜查的禪修世界（二）》'}],
 worry:[
  {m:'「好事不強求，壞事不拒絕。一切現象的發生必有其原因，要平心靜氣地接受它、處理它、完成它，這就容易放鬆了。」擔心，多半是心跑到了還沒發生的未來。感到恐懼、緊張時，呼吸會變得急促，這時不一定適合勉強打坐，可以先躺下或坐著休息，等呼吸平順了再開始。靜心不是要讓擔心消失，而是在擔心旁邊，多留一點空間給自己。下次擔心浮現時，可以先問自己：「此刻，我是安全的嗎？」',s:'聖嚴法師《禪的體驗‧禪的開示》頁 36、253'},
  {m:'當心情很糟時，所有念頭好像都通過一層灰暗的濾鏡，最後都變成不安和焦慮。試圖硬壓下這些念頭往往沒用，換成正面思考也覺得很假。這時可以做一件很簡單的事：把注意力放回呼吸，這次吸氣從哪裡開始、在哪裡結束，停頓一下。只是十幾分鐘，胸口的緊悶也可能稍微鬆開，念頭之間的空隙會變長。這不是要你想通什麼，只是讓自己從念頭的漩渦裡短暫地喘口氣。下次心裡很亂時，先試著陪呼吸十次就好。',s:'比約恩．納提科《我可能錯了》第 2–3 章'}],
 sad:[
  {m:'靜心不是要讓情緒消失，而是在情緒裡也能有一點空間。情緒低落、身心疲累時，不適合硬撐著坐，先讓身體休息、讓呼吸平順下來，再回來練習。也可以用很簡單的方式陪伴自己：慢慢走一段路，或只是感覺三次呼吸，告訴自己「現在是這樣，沒關係」。如果難過一直持續，請和信任的人或專業人員聊聊。難過時，也可以把練習改成慈心：在心裡對自己說「願我平安，願我好好照顧自己」，就像安慰一位朋友那樣。',s:'參考聖嚴法師《禪的體驗‧禪的開示》頁 36'},
  {m:'有位曾經歷憂鬱的老師說，很難熬的夜裡，他的老師只是微笑地說：「好好睡吧，也許明天早上你就會感覺很不一樣。」事情也真的如此。沒有什麼是永遠不變的，最艱難的時候也一樣。練習不能保證我們永遠順利，但能讓我們身處難受之中，心不完全被它帶走。所以今天就先好好休息、照顧自己，不需要逼自己馬上好起來。如果低落持續很多天，記得找信任的人聊聊，或尋求專業協助。',s:'比約恩．納提科《我可能錯了》第 6 章；《阿姜查的禪修世界（二）》'}],
 expect:[
  {m:'納提科第一次在寺院靜坐時，心裡嘀咕：「怎麼這麼無聊？不是應該發生什麼事嗎？」他說，很多人剛開始都犯同樣的錯，以為腦袋會靜下來；其實只要活著，念頭就會不斷冒出來，這再正常不過。練習不是等待特別的體驗，而是看見念頭來了，輕輕對自己說：「嘿，那個念頭又來了，那就放掉它吧。」帶著一點幽默，別把每個念頭都看得太認真。',s:'比約恩．納提科《我可能錯了》第5章〈初探寺院〉'},
  {m:'有學生坐出一次很好的狀態，之後一直想再回去，他的老師說：「我沒辦法使你每一次打坐，都能得到輕靈明淨；我只能告訴你，每次打坐，不求效果，不怕壞境界，也不求好境界現前。」他也用破繭來比喻：蝴蝶若急著鑽出繭殼，反而可能提前死在繭中。練習需要時間，急不來。練習比較像種花：每天澆水，花什麼時候開，不用一直去看。下次坐下時，試著把目標從「要坐得好」換成「要清楚知道」，不管狀態如何，知道就是做對了。',s:'聖嚴法師《禪的生活》頁 108–109、203–204'},
  {m:'試著不期待好的經驗，也不排斥壞的經驗，因為每一種經驗，都能幫我們更了解自己。希望練習更順利、想要特別的體驗時，可以在心裡知道「期待、期待」，然後回到呼吸。有些人只想付出一點、得到很多，但練習比較像種地：先整地、拔草，種子才會慢慢長出來。只要持續整地、澆水，土壤準備好了，該長的自然會長出來。下次坐下前，可以對自己說一句：「今天怎麼樣都好，我只是來看看。」',s:'馬哈希大師《向馬哈希大師學正念Ⅰ》頁 46；《Ⅱ》；焦諦卡禪師《禪修之旅》第一講'}],
 judge:[
  {m:'有學生在禪修時覺得自己脫胎換骨，回到生活不久又退回原狀，懊喪得不好意思再回來。他的老師說：「其實不要害怕，不必害羞，這是正常的現象……有進，才知道修行有用；有退，才知道還需要用功。」對自己嚴格的聲音，也只是一個念頭，看見它就好，不必相信它。試著用對好朋友說話的語氣對自己說：「沒關係，我們再回來就好。」坐下來、發現走神、再回來，每一步都算數，明天再坐就好。',s:'聖嚴法師《禪的生活》頁 42–43'},
  {m:'很多人心裡都有一個挑剔的聲音，做得好時默不作聲，一出錯就變得特別大聲。一位前僧人說，他剛學靜坐時，面對的正是自己源源不絕的批評和質疑，四天就逃離了寺院。後來他和自己約定：要學著成為和自己更自在相處的人，有一天甚至成為自己的好朋友。不用一次做到，每天一點就好。下次那個聲音又出現時，可以只是知道「批評的聲音來了」，不和它爭辯，然後溫和地回到呼吸。每一次這樣做，都是在練習善待自己。',s:'比約恩．納提科《我可能錯了》第 6 章'}],
 doubt:[
  {m:'要相信自己有練習的能力，不要小看自己，也不要懷疑自己；若對自己和方法起疑，遇到困難時就很容易放棄。今天這樣、明天那樣，又擔心得不到效果，這些盤算本身就成了障礙。所以先選定一個方法，安心地用一段時間。有疑問時，請教有經驗的老師，比自己反覆猜測更有幫助。下次覺得「這樣有沒有用」時，可以先把問題寫下來，繼續練習一兩週，再回頭看看，很多疑問會在練習中自己有了答案。',s:'聖嚴法師《禪的體驗‧禪的開示》頁 288–289；《禪門修證指要》頁 176'},
  {m:'一位著名的禪師坦白說，他剛開始練習時也沒有信心，練了一個月仍覺得一無所獲，後來才明白是把時間花在懷疑上，誤把懷疑當成了分析。練習沒有進展時，可以知道「懷疑、懷疑」，然後回到呼吸。持續地做，答案常常會在練習中自己出現。小小的改變常常不容易察覺：比較快發現自己走神、情緒來時多了一點空間、睡得比較好，這些都是進步。下次可以留意一下這些小變化，寫進筆記裡。',s:'馬哈希大師《向馬哈希大師學正念Ⅱ》頁 15–19；焦諦卡禪師《禪修之旅》第二講'}],
 strange:[
  {m:'心比較集中時，偶爾會出現特別的反應，例如看到光、身體晃動或輕飄飄的感覺。這些通常只是專注帶來的現象，像夢境一樣，不需要高興，也不需要害怕。好奇、害怕或執著它，它反而會停留更久；只是知道「看到了」，回到呼吸，它會慢慢淡去。若感覺讓你不安，或常常出現，請先暫停，並請教有經驗的老師或醫師。這些感覺本身沒有好壞，也不代表練習的程度高低，平常心看待就好。',s:'馬哈希大師《向馬哈希大師學正念Ⅰ》頁 30–33、57–59、66–70'},
  {m:'練習中若突然被驚醒、身體一震，常是因為心習慣緊抓著「我要知道發生什麼事」，一放鬆就本能地想保護自己。找一個讓你覺得安全的地方練習，坐前先對自己和身邊的人祝福一下，也可以告訴自己：「如果有任何狀況，我會醒來處理。」不用控制，只要像坐在路邊看車來車往的人一樣，知道就好。對初學者來說，這是很常見的反應，隨著練習越來越安心，它會慢慢減少。也可以和信任的人一起練習，會更有安全感。',s:'焦諦卡禪師《禪修之旅》第三講'}],
 good:[
  {m:'坐得好的時候，反而要提醒自己：不期待、不企求，保持平穩的心情。一旦抓住好的感覺，下一次坐下就會想追回它，心反而緊了。這次的安定，是放鬆自然帶來的結果。可以把這次的條件記在筆記裡，例如時段、睡得好不好、坐前有沒有暖身，之後再創造類似的條件。也要記得，下一次不一樣是很自然的事，平靜的時候知道平靜，散亂的時候知道散亂，兩種都有價值。用新的心情坐下來就好。',s:'聖嚴法師《禪的生活》頁 203–204'},
  {m:'當心比較安定，可能會覺得身心輕快、很舒服，甚至想把這份感覺告訴別人。這很好，但不必花時間享受或回味它，只是知道「舒服、平靜」，再回到呼吸。有人說，靜心像一個寬敞、空無一物、欣然接納的房間，念頭、情緒、身體的感覺，一切都可以順其自然地在裡面來去。下次坐下時，不必想重現今天的感覺，只要帶著同樣放鬆、好奇的心開始就好。',s:'馬哈希大師《向馬哈希大師學正念Ⅰ》頁 66–68；比約恩．納提科《我可能錯了》第 1 章'}]};

function mzPeriod(t){const m=/^(\d{1,2}):/.exec(t||'');if(!m)return null;const h=+m[1];return h<4?'late':h<7?'dawn':h<11?'morning':h<14?'noon':h<17?'afternoon':h<21?'evening':'night'}

 thoughts:{dawn:'清晨念頭多也不用急，心像剛攪動過的水，慢慢就會沉澱。',morning:'早上念頭常跑到今天的行程，坐前先把待辦寫下來，心會放下一些。',noon:'白天正忙的時候，念頭多很正常，能停下來坐幾分鐘，已經是很好的轉換。',afternoon:'白天正忙的時候，念頭多很正常，能停下來坐幾分鐘，已經是很好的轉換。',evening:'傍晚的念頭常是白天的事在回放，看見它們，知道「這是今天的事」，就好。',night:'睡前念頭多，可以先寫幾句日記，把它們放到紙上，心會輕一些。',late:'半夜醒來念頭紛飛時，不必要求自己入定，陪著呼吸、讓身體放鬆，能再睡著就很好。'},

function mzFeedback(x){
  const txt=[x.note||'',x.next||''].join(' '),dist=x.dist||[];
  if(MZ_CRISIS.test(txt))return {k:'crisis',b:'謝謝你願意寫下來。你現在的感受很重要，請不要一個人承受。如果有傷害自己的念頭，請馬上聯絡信任的人，或撥打安心專線 1925、生命線 1995（24 小時）。靜心可以先暫停，先讓自己安全、被陪伴。'};
  if(MZ_DISTRESS.test(txt))return {k:'distress',b:'練習中出現很強烈的不舒服時，可以先停下來，睜開眼睛，感覺雙腳踩地、看看周圍的物品，讓自己回到現在。不必勉強繼續，喝口水、走一走都好。如果這種情況常常出現，建議和醫師、心理師或有經驗的老師談談，找到適合你的練習方式。'};

  MZ_FB.forEach(f=>{let s=0;if(f.chip&&dist.includes(f.chip))s+=2;const m=txt.match(new RegExp(f.re.source,'g'));if(m)s+=m.length;if(dist.includes('情緒')&&['anger','worry','sad'].includes(f.k)&&m)s+=1;if(s>score){score=s;best=f}});
  if(!best&&dist.includes('情緒'))best=MZ_FB.find(f=>f.k==='worry');
  if(!best&&(x.q>=4))best=MZ_FB.find(f=>f.k==='good');
  const per=mzPeriod(x.t);
  if(!best)return {k:'general',a:x.q&&x.q<=2?'今天的心比較散，也沒關係。':'謝謝你今天花時間陪伴自己。',b:'靜心不是要達到某種狀態，而是一次又一次溫柔地回到當下。'+((per&&MZ_TOD.general[per])||'')+'下次坐完，可以多寫一句你注意到的事，例如念頭、身體或呼吸的變化，回饋會更貼近你。'};
  const h=[...String(x.id||'')].reduce((a,c)=>a+c.charCodeAt(0),0),nx=(x.next||'').trim();
  let b=best.b;const tod=per&&(MZ_TOD[best.k]||{})[per];if(tod)b+=tod;if(nx)b+=`你想試的「${nx.slice(0,30)}」很好，下次開始前看一眼就能用上。`;
  const vs=MZ_M[best.k]||[{m:best.m,s:best.s}],v=mzPickVariant(vs);

const FLOW_DEF={time:{prep:10,buf:15,items:[['棒式',45,3],['靠牆蹲',40,3],['側棒式（左右）',30,2]]},reps:{prep:10,rest:90,items:[['深蹲',12,3],['伏地挺身',10,3],['划船',12,3]]}};

function flowSteps(kind,f){const S=[{ph:'prep',sec:Math.max(3,f.prep)}],it=f.items.filter(x=>(x[0]||'').trim()&&+x[2]>0);

function flTone(k){if(!AC)return;try{const out=outNode(),t=T0()+.03,beep=(f,at,d,v)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(out);g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(v,at+.012);g.gain.exponentialRampToValueAtTime(.0001,at+d);o.start(at);o.stop(at+d+.05)};
  if(k==='tick')beep(660,t,.13,.28);else if(k==='go'){beep(988,t,.16,.38);beep(1319,t+.18,.32,.38)}else if(k==='rest'){beep(587,t,.45,.26);beep(440,t+.32,.6,.24)}else if(k==='end'){[784,988,1175].forEach((f,i)=>beep(f,t+i*.22,.5,.34))}}catch{}}

  flAdd:()=>{editCfg(c=>{const g=c.gymFlow=c.gymFlow||{},f=flowCfg(flowKind);g[flowKind]=Object.assign({},g[flowKind]||{},{items:f.items.concat([[flowKind==='time'?'新動作':'新動作',flowKind==='time'?30:10,3]])})});render()},

  hiitGo:()=>{const h=spCfg().hiit;spStart({k:'hiit',h,n:0,phase:'w',left:h.w});try{bell(1)}catch{}},

  ySeqAdd:()=>{editSeq(q=>q.p.splice(Math.max(0,q.p.length-1),0,['新體式',30]));render()},

  ySeqReset:()=>{editCfg(c=>{delete c.yogaSeqs});lsSet('sd-yseq','');spSeqEdit=false;render()},
  spDel:el=>{if(!twoStep(el))return;editDay(el.dataset.k,d=>{d.sport=(d.sport||[]).filter(x=>x.id!==el.dataset.id)});render()},
  gymExAdd:()=>{const n=$('#gExN').value.trim();if(!n)return toast('寫下動作名稱');const known=GYM_EX.find(x=>x[0]===n);GW.ex.push({n,part:known?known[1]:$('#gExP').value,sets:[]});gwSave();render()},
  gymExDel:el=>{GW.ex.splice(+el.dataset.i,1);gwSave();render()},
  gymSet:el=>{const i=+el.dataset.i,r=+$('#gR'+i).value,w=+$('#gW'+i).value||0;if(!r)return toast('填一下次數');GW.ex[i].sets.push({r,w});gwSave();spStart({k:'rest',left:spCfg().rest})},
  gymSetDel:el=>{GW.ex[+el.dataset.i].sets.splice(+el.dataset.j,1);gwSave();render()},
  gymSave:()=>{const ex=GW.ex.filter(e=>e.sets.length);if(!ex.length)return toast('還沒有完成任何一組');const rp=$('#gRpe');spRecord('gym',{ex,min:Math.min(240,Math.max(1,Math.round((Date.now()-GW.start)/60000))),rpe:rp&&rp.value?+rp.value:null,hurt:spHurtVal()});GW=null;gwSave();ST={k:null,running:false};toast('訓練完成，記得伸展和補充水分');render()},
  cdSave:el=>{const t=el.dataset.t,d=+$('#cdD').value,m=+$('#cdM').value;if(!d||!m)return toast('填一下距離和時間');spRecord(t,{dist:d,min:Math.round(m),note:spNoteVal(),hurt:spHurtVal()});toast('已記錄');render()},
  stpSave:()=>{const n=Math.round(+$('#stpN').value);if(!n)return toast('填一下步數');editDay(today(),d=>{d.sport=(d.sport||[]).filter(x=>x.type!=='steps');d.sport.push({id:rid(),t:new Date().toISOString(),type:'steps',steps:n})});toast(n>=spCfg().steps?'達標了，很好！':'已記錄');render()},
});

   信存在寫信那天 day.letters=[{id,t,text,due,reply,src,read}]；due＝下一個起床時間（我的節奏，沒有就 07:30）

const LT_THEMES=[
 {k:'calm',re:/焦慮|擔心|想太多|睡不著|失眠|緊張|壓力|不安|害怕|恐懼|煩/,a:['讀得出來，你最近心裡一直繃著。','謝謝你把這些煩惱寫下來，光是寫下來，就已經鬆開了一點。'],
  p:[["How to Calm Your Mind", "克里斯．貝利發現，讓人焦躁的常常不是事情本身，而是一整天不停的刺激：訊息、新聞、滑不完的畫面。刺激越多，心越靜不下來。他建議試試「刺激斷食」：暫時減少這些輸入，多待在不插電的實體世界，心會慢慢沉澱。", "Ch.5〈Heights of Stimulation〉、Ch.6〈Stimulation Fasting〉"], ["我可能錯了", "納提科說，在生活中幫助他最大的一句話是：「不要相信你的每個念頭。」當腦中反覆上演最壞的情況時，可以帶著一點懷疑和幽默看待它們。那些擔心只是念頭，不一定是事實，不必被它一路拖著走。", "第6章〈不要相信你的每個念頭〉"], ["炎夏飄雪", "焦諦卡禪師在給學生的信裡說：不要把情緒和煩躁看得太認真，也不必急著替它辯護。遇到麻煩時，就觀察它，不抱怨、不責備自己或別人，也不逃避。能這樣看著它而不排斥，就比較容易度過。", "第一章〈心、正念和禪修〉，頁 19"]],
  act:['今天找十分鐘，把手機放到另一個房間，只做一件慢慢的事：喝杯茶、散個步，或在日課靜心三分鐘。','睡前把擔心的事寫在紙上，寫完對自己說：「明天再處理。」把它交給明天。']},
 {k:'habit',re:/拖延|拖著|習慣|做不到|堅持|懶|三分鐘熱度|動不起來|沒辦法開始|自律/,a:['你說很難開始，這種卡住的感覺，其實很多人都有。','看得出來你對自己有期待，所以才會這麼在意。'],
  p:[["原子習慣", "詹姆斯．克利爾的「兩分鐘法則」：開始一個新習慣時，讓它兩分鐘內就能完成，例如「每晚讀書」變成「讀一頁」，「準備考試」變成「打開筆記」。重點不是那兩分鐘做了多少，而是先養成「出現」的習慣；習慣要先建立，才能再改進。", "第13章〈如何運用「兩分鐘法則」停止拖延〉"], ["最有生產力的一年", "克里斯．貝利的「三重點法則」：每天一開始、正式工作之前，先決定今天結束前要完成的三件事；每週一開始也這樣做。事情少了，反而比較做得完。", "第3章〈每日必做的三件事〉"], ["Intentional", "克里斯．貝利發現，我們一再拖延的事，通常帶著幾個讓人抗拒的特徵：無聊、不舒服、讓人挫折、沒有頭緒、找不到意義。先看看這件事卡在哪一個，再針對它改一點：太無聊就限時挑戰，太模糊就先寫下第一步。", "Ch.4〈Ugly Goals: Lowering Aversion〉"], ["如何成為一流職場菁英？", "書中介紹心理學家海佛森的研究：事先決定「遇到這種狀況，就這樣做」，例如「早上洗完臉就讀十頁書」「想打電動時，先出去走五分鐘」。不給自己猶豫的時間，比單純下決心有效得多。", "〈從心理學觀點分析「持之以恆的人」、「表現傑出的人」有何共通點〉"]],
  act:['明天把最想做的那件事，縮小成兩分鐘的版本，寫進日課「今天最重要的三件事」的第一格。','下次想拖的時候，只答應自己做一個番茄鐘，時間到了就可以停。']},
 {k:'study',re:/考試|讀書|唸書|念書|學不會|記不住|成績|複習|功課|報告寫不出/,a:['準備考試的日子，真的很辛苦。','你這麼努力，卻還是覺得不夠，這份焦急我懂。'],
  p:[["大腦喜歡這樣學", "芭芭拉．歐克莉說，大腦有兩種模式：專注模式在用力解題；放鬆、散步、洗澡、睡覺時，發散模式會在背後默默整理。卡住時起身走一走並不是偷懶，而是讓另一種模式接手，很多答案是休息之後才浮現的。", "第2章〈大腦的兩種學習模式〉、第3章〈學習是一種創造〉"], ["大腦喜歡這樣學", "歐克莉也提醒「能力的錯覺」：反覆看筆記，會讓人以為自己懂了。比較有效的是闔上書，試著回想重點；而且分成幾天、間隔著複習，比一個晚上練二十次記得更牢。", "第3章、第4章〈記憶組塊與能力的錯覺〉"], ["超速學習", "史考特．楊的法則之一是「提取記憶：用測驗來學習」：與其反覆看，不如闔上書，自己寫出來或做題目。另一條是「直截了當」：想學會什麼，就直接去做那件事；被動學習帶來知識，主動練習才帶來技能。", "第6章〈法則3 直截了當〉、第8章〈法則5 提取記憶〉"]],
  act:['明天讀完一段，先闔上書，用一分鐘寫下記得的重點，再打開對照。','每讀 25 分鐘，就起來走五分鐘，讓頭腦在背後整理。']},
 {k:'work',re:/分心|效率|忙|工作|專注不了|手機|加班|做不完|事情太多|主管|同事/,a:['事情一件接一件，連喘口氣的時間都沒有，真的很累。','你一直在撐著，這份辛苦值得被看見。'],
  p:[["Hyperfocus", "克里斯．貝利把注意力比喻成一個小小的空間，一次只放得下少數幾件事。手機、通知、同時開著的工作，都在搶這個空間。刻意一次只放一件重要的事進去，每一件都會做得比較好。", "Ch.2〈The Limits of Your Attention〉"], ["Hyperfocus", "他也說，人的精力大約以九十分鐘為一個週期起伏。發現專注力開始下滑，或做完一件大事時，就真正休息一下，讓心思自由漫遊，回來時會更有力氣。", "Ch.7〈Recharging Your Attention〉"], ["故道白雲", "書裡，佛陀教孩子們專心吃橘子：剝皮時知道自己在剝皮，放進嘴裡時知道自己在吃。他說，一天的二十四小時就像一顆橘子的一片片果肉，把每一個小時都活在專注之中，就不會糊里糊塗地過日子。", "第19章〈對橘子的專注〉"]],
  act:['明天第一個番茄鐘開始前，把手機調成勿擾，只開一個視窗。','今天下班前，花兩分鐘寫下明天的三件事，讓腦袋可以下班。']},
 {k:'voice',re:/表達|說不清|開會|簡報|被否定|溝通|講話|說服|提案|被罵/,a:['想說的話說不出來，或說了沒被聽懂，那種挫折很真實。','你在意別人怎麼看，也代表你很認真看待這件事。'],
  p:[["精準表達", "高田貴久提醒，要讓對方接受，先理解談話的目的、抓住對方真正在意的論點，再準備答案。對方很忙、想先聽結論，就先講結論；對方還不了解狀況，就先把背景說清楚。說得清楚，不靠口才，而是先想清楚對方要什麼。", "第3章第1節〈理解目的〉、第4章第2節〈決定著陸形式〉"], ["我可能錯了", "這本書的書名來自一句箴言。很多爭執，是因為每個人都堅持自己是對的。被否定的時候，可以先在心裡默念幾次「我可能錯了」，不急著辯解，先好奇對方在意的是什麼。", "第13章〈有魔法的箴言〉"], ["如何成為一流職場菁英？", "書中介紹阿德勒的「課題的分離」：把事情認真做好，是自己的課題；別人怎麼看，是別人的課題。把心力放在自己能控制的部分，不必為了別人的認同耿耿於懷。", "〈透過「課題的分離」讓自己從認同需求中解脫〉"], ["Working Backwards", "亞馬遜的高階會議不用投影片，改成先寫一份完整的文字說明。作者引用塔夫特的話：條列式的投影片容易讓粗糙的想法過關。把想法寫成完整的段落，才看得出哪裡還沒想清楚。", "Ch.4〈Communicating〉"]],
  act:['下次開口前，先用一句話寫下結論：「我希望……，因為……。」','把那次被否定的經驗寫進日記，下面再寫一句：「下次我可以先問……」。']},
 {k:'meaning',re:/無聊|沒意義|提不起勁|空虛|沒動力|麻木|不知道為什麼要|厭倦/,a:['提不起勁的日子，連自己都覺得陌生吧。','你願意停下來問「為什麼」，這本身就很珍貴。'],
  p:[["心流", "契克森米哈伊研究發現，最投入、最有樂趣的體驗，常出現在面對一件「做得完」、需要一點技巧的挑戰時。太簡單會無聊，太難會焦慮；提不起勁，有時只是挑戰和能力沒有對上。", "第三章〈心流的構成要素〉"], ["心流", "他也整理出，有明確的目標、做了馬上看得到回饋的事，最容易讓人全神貫注。不必一下子找到人生的意義，先找一件今天可以全心投入的小事。", "第三章〈心流的構成要素〉"], ["故道白雲", "佛陀對孩子們說，吃橘子時若心裡想著昨天或明天，就嚐不到橘子的香甜；全心投入這一刻，橘子才真正存在，吃橘子的人也才真正活著。意義有時不在遠方，而在全心做眼前這件事。", "第19章〈對橘子的專注〉"]],
  act:['挑一件稍微有點難、但努力一下做得到的小事，今天用一個番茄鐘做它。','睡前寫下今天有一點點投入的時刻，哪怕只有五分鐘。']},
 {k:'loss',re:/失去|分手|離開|放不下|過世|遺憾|後悔|捨不得|走了|離婚/,a:['讀到這裡，我很想先陪你安靜一下。失去，真的很痛。','放不下，是因為曾經很在乎。'],
  p:[["金剛經白話講座", "《金剛經》說：「應無所住，而生其心。」王思迅解釋，「清淨」不是什麼都沒有，而是放下得失、放下好惡，不被任何事物綁住。可以想念，可以難過，心不必一直困在同一個地方。", "〈莊嚴淨土分第十〉講解"], ["我可能錯了", "納提科教人想像：原本握緊的拳頭，慢慢鬆開五指，變成張開的手掌。這個簡單的手勢，提醒我們怎麼放開緊抓的事物與念頭。鬆開，不是把重要的東西丟掉，而是讓心有一點空間。", "第3章〈多呼吸，少思考〉、第18章〈握緊的拳頭，張開的手掌〉"]],
  act:['今天不必勉強自己好起來。寫幾句話給那個人或那段時光，寫完收起來。','找一個信任的人，說說你在想念的事。']},
 {k:'love',re:/家人|朋友|另一半|伴侶|吵架|關係|孤單|寂寞|爸|媽|孩子|男友|女友/,a:['和在乎的人之間卡住，心裡最難受。','覺得孤單的時候，連一句話都特別重。'],

  blkItemDel:el=>{editPage(el.dataset.p,p=>{const b=blk(p,el.dataset.b);b.items=b.items.filter(x=>x.id!==el.dataset.id)});render()},
  blkCnt:el=>{editPage(el.dataset.p,p=>{const b=blk(p,el.dataset.b);b.value=Math.max(0,(+b.value||0)+(+el.dataset.d)*(+b.step||1))});render()},
  blkReset:el=>{if(!twoStep(el))return;editPage(el.dataset.p,p=>{blk(p,el.dataset.b).value=0});render()},
  blkHabit:el=>{const k=el.dataset.k;editPage(el.dataset.p,p=>{const b=blk(p,el.dataset.b);if(b.days[k])delete b.days[k];else b.days[k]=true});render()},
  blkColAdd:el=>{editPage(el.dataset.p,p=>{blk(p,el.dataset.b).cols.push('新欄位')});render()},
  blkColDel:el=>{if(!twoStep(el))return;const i=+el.dataset.i;editPage(el.dataset.p,p=>{const b=blk(p,el.dataset.b);b.cols.splice(i,1);b.rows.forEach(r=>r.c.splice(i,1))});render()},
  blkRowAdd:el=>{const b0=blk(S.pages[el.dataset.p],el.dataset.b);const c=b0.cols.map((_,i)=>($('#br'+el.dataset.b+'_'+i)||{}).value||'');if(!c.some(x=>x.trim()))return toast('至少填一欄');editPage(el.dataset.p,p=>{blk(p,el.dataset.b).rows.push({id:rid(),c})});render()},
  blkRowDel:el=>{if(!twoStep(el))return;editPage(el.dataset.p,p=>{const b=blk(p,el.dataset.b);b.rows=b.rows.filter(r=>r.id!==el.dataset.id)});render()},
  gcOn:()=>{editCfg(c=>{c.gcalOn=true});GC.state='idle';if(STANDALONE&&!gcwReady()){gcAuth();return}render();gcLoad(false)},
  gcAuth:()=>gcAuth(),
  gcOff:()=>{editCfg(c=>{c.gcalOn=false});render()},
  gcRefresh:()=>{gcLoad(true);render()},
  navMove:el=>{const o=navOrder().filter(r=>r!=='today'),i=o.indexOf(el.dataset.r),j=i+(+el.dataset.d);if(i<0||j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];editCfg(c=>{c.navOrder=o});render();setTimeout(()=>{const b=document.querySelector(`[data-act=navMove][data-r="${el.dataset.r}"][data-d="${el.dataset.d}"]`);b&&!b.disabled&&b.focus()},30)},
  navReset:()=>{editCfg(c=>{delete c.navOrder});render()},
  navToggle:el=>{const r=el.dataset.r;editCfg(c=>{c.hidden=c.hidden||[];if(c.hidden.includes(r))c.hidden=c.hidden.filter(x=>x!==r);else c.hidden.push(r)});render()}
});
Object.assign(C,{
  pgName:el=>{editPage(el.dataset.p,p=>{p.name=el.value.trim()||'未命名頁面'});renderNav()},
  blkTxt:el=>{editPage(el.dataset.p,p=>{blk(p,el.dataset.b)[el.dataset.f]=el.value});if(el.dataset.f!=='title')render()},
  blkNum:el=>{editPage(el.dataset.p,p=>{blk(p,el.dataset.b)[el.dataset.f]=Math.max(0,+el.value||0)});render()},
  blkChk:el=>{editPage(el.dataset.p,p=>{const x=blk(p,el.dataset.b).items.find(y=>y.id===el.dataset.id);if(x)x.done=el.checked});render()},
  blkCol:el=>{editPage(el.dataset.p,p=>{blk(p,el.dataset.b).cols[+el.dataset.i]=el.value.trim()||'欄位'});render()},
  gcFree:el=>{editCfg(c=>{c.gcalSkipFree=el.checked});gcLoad(true)}
});
Object.assign(IN,{blkF:el=>{editPage(el.dataset.p,p=>{blk(p,el.dataset.b)[el.dataset.f]=el.value},true)}});

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(!f)return;if(el.tagName==='A'&&el.getAttribute('href')&&el.getAttribute('href').startsWith('#')&&el.dataset.act!=='goReview'&&el.dataset.act!=='toJournal'){e.preventDefault()}f(el,e)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(el&&C[el.dataset.ch])C[el.dataset.ch](el,e)});
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(el&&IN[el.dataset.in])IN[el.dataset.in](el,e)});
document.addEventListener('toggle',e=>{if(e.target&&e.target.classList&&e.target.classList.contains('others'))stagesOpen=e.target.open},true);
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='parkIn'&&!e.isComposing){e.preventDefault();A.parkAdd();return}
  if(e.key==='Enter'&&e.target.id==='ptagName'&&!e.isComposing){e.preventDefault();A.ptagSave();return}
  if(e.target.closest('input,textarea,select,[contenteditable]'))return;
  if($('#modal').innerHTML){if(e.key==='Escape')closeModal();return}
  if(e.key===' '&&R==='today'){e.preventDefault();P.running?pPause():pStart();render()}
  const n=+e.key;if(n>=1&&n<=9&&!e.metaKey&&!e.ctrlKey&&!e.altKey){const it=navItems()[n-1];if(it)location.hash=it[0]}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick(true);if(gdAvail()&&GD.on&&gdReady()&&Date.now()-Date.parse(GD.last||0)>60000)gdSync();renderSyncChip()}});
init();
})();
</script>
